/* ============================================================
   OTHER SIDE — KLIPZASTUDIO
   Terror psicológico 8-bit · 320x180 · paleta: #000 #FFF #AAA #555
   FASE 2: CEMITÉRIO — esqueletos, invisibilidade (R), ponte
============================================================ */
const W=320,H=180,TILE=10,MW=88,MH=18,MW2=128;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let RK=1; // resolução interna (nitidez)

function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  const cssW=Math.max(1,Math.floor(W*s)),cssH=Math.max(1,Math.floor(H*s));
  RK=Math.max(1,Math.min(4,Math.ceil(s*(window.devicePixelRatio||1))));
  canvas.width=W*RK;canvas.height=H*RK;
  ctx.setTransform(RK,0,0,RK,0,0);
  ctx.imageSmoothingEnabled=false;
  canvas.style.width=cssW+'px';
  canvas.style.height=cssH+'px';
}
addEventListener('resize',fit);
document.addEventListener('fullscreenchange',fit);
fit();

function hash(x,y){let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);n=Math.imul(n^(n>>>13),1274126177);return(n^(n>>>16))>>>0;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function wrapText(str,max){
  const words=String(str).split(' '),out=[];let cur='';
  for(let w of words){
    const t=cur?cur+' '+w:w;
    if(t.length<=max)cur=t;
    else{
      if(cur)out.push(cur);
      if(w.length>max){while(w.length>max){out.push(w.slice(0,max));w=w.slice(max);}cur=w;}
      else cur=w;
    }
  }
  out.push(cur);return out;
}

'K':["1001","1010","1100","1010","1001"],'L':["1000","1000","1000","1000","1111"],
'M':["1001","1111","1111","1001","1001"],'N':["1001","1101","1011","1001","1001"],
'O':["0110","1001","1001","1001","0110"],'P':["1110","1001","1110","1000","1000"],
'Q':["0110","1001","1001","1010","0101"],'R':["1110","1001","1110","1010","1001"],
'S':["0111","1000","0110","0001","1110"],'T':["1111","0110","0110","0110","0110"],
'U':["1001","1001","1001","1001","0110"],'V':["1001","1001","1001","1010","0100"],
'W':["1001","1001","1111","1111","1001"],'X':["1001","1001","0110","1001","1001"],

'0':["0110","1001","1001","1001","0110"],'1':["0100","1100","0100","0100","1110"],

'4':["1001","1001","1111","0001","0001"],'5':["1111","1000","1110","0001","1110"],
'6':["0110","1000","1110","1001","0110"],'7':["1111","0001","0010","0100","0100"],
'8':["0110","1001","0110","1001","0110"],'9':["0110","1001","0111","0001","0110"],
' ':["0000","0000","0000","0000","0000"],':':["0000","0100","0000","0100","0000"],
'!':["0100","0100","0100","0000","0100"],'.':["0000","0000","0000","0000","0100"],
'-':["0000","0000","1110","0000","0000"],'>':["1000","0100","0010","0100","1000"],
'<':["0010","0100","1000","0100","0010"],'/':["0001","0010","0100","1000","0000"],
'?':["1110","0001","0110","0000","0100"],'+':["0000","0100","1110","0100","0000"]
};
function textW(s,sc){return s.length?(s.length*5-1)*sc:0;}
function drawText(s,x,y,sc,col,align,g){
  g=g||ctx;
  if(align==='center')x-=textW(s,sc)/2;else if(align==='right')x-=textW(s,sc);
  x=Math.round(x);y=Math.round(y);
  g.fillStyle=col;
  for(let i=0;i<s.length;i++){
    const gl=FONT[s[i]];if(!gl)continue;
    for(let r=0;r<5;r++){const bits=gl[r];
      for(let b=0;b<4;b++)if(bits.charCodeAt(b)===49)g.fillRect(x+i*5*sc+b*sc,y+r*sc,sc,sc);
    }
  }
}
function drawTextSh(s,x,y,sc,col,align){
  drawText(s,x+sc,y+sc,sc,'#000000',align);
  drawText(s,x,y,sc,col,align);
}
function textSources(text,sc,x,y){
  const w=textW(text,sc),h=5*sc;
  const oc=document.createElement('canvas');oc.width=w;oc.height=h;
  const o=oc.getContext('2d');
  drawText(text,0,0,sc,'#FFFFFF','left',o);
  const d=o.getImageData(0,0,w,h).data,out=[];
  for(let cx=0;cx<w;cx++){
    for(let cy=h-1;cy>=0;cy--){
      if(d[(cy*w+cx)*4+3]>0){if(Math.random()<0.16)out.push({x:x+cx,y:y+cy+1});break;}
    }
  }
  return out;
}

/* ================= SOUND (WebAudio 8-bit) ================= */
class Sound{
  constructor(){this.ctx=null;this.ok=false;this.musicOn=true;this.intense=false;this.step=0;this.nextT=0;this.drone=null;this.tryLoad();}
  tryLoad(){try{const v=localStorage.getItem('os_music');if(v!==null)this.musicOn=v==='1';}catch(e){}}
  unlock(){
    if(this.ok){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return;}
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    try{this.ctx=new A();}catch(e){return;}
    const c=this.ctx;
    this.master=c.createGain();this.master.gain.value=0.7;this.master.connect(c.destination);
    this.mus=c.createGain();this.mus.gain.value=this.musicOn?1:0;this.mus.connect(this.master);
    this.sfxG=c.createGain();this.sfxG.gain.value=0.9;this.sfxG.connect(this.master);
    this.ok=true;this.startDrone();this.nextT=c.currentTime+0.15;
  }
  startDrone(){
    if(!this.ok||this.drone)return;const c=this.ctx;
    const o1=c.createOscillator();o1.type='sawtooth';o1.frequency.value=55;
    const o2=c.createOscillator();o2.type='sine';o2.frequency.value=55.7;
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=150;f.Q.value=3;
    const g=c.createGain();g.gain.value=0;
    o1.connect(f);o2.connect(f);f.connect(g);g.connect(this.mus);
    const lfo=c.createOscillator();lfo.frequency.value=0.05;
    const lg=c.createGain();lg.gain.value=70;lfo.connect(lg);lg.connect(f.frequency);
    o1.start();o2.start();lfo.start();
    g.gain.setTargetAtTime(0.15,c.currentTime,1.5);
    this.drone={g:g,tens:null,tensG:null};
  }
  setIntense(v){
    if(this.intense===v)return;this.intense=v;if(!this.ok)return;
    const c=this.ctx,d=this.drone;if(!d)return;
    if(v&&!d.tens){
      const o=c.createOscillator();o.type='sawtooth';o.frequency.value=58.27;
      const g2=c.createGain();g2.gain.value=0;g2.gain.setTargetAtTime(0.055,c.currentTime,2);
      o.connect(g2);g2.connect(this.mus);o.start();d.tens=o;d.tensG=g2;
    }
    if(!v&&d.tens){
      d.tensG.gain.setTargetAtTime(0,c.currentTime,1);
      const oo=d.tens;setTimeout(()=>{try{oo.stop();}catch(e){}},3000);d.tens=null;
    }
  }
  setMusic(v){
    this.musicOn=v;
    try{localStorage.setItem('os_music',v?'1':'0');}catch(e){}
    if(this.ok){this.mus.gain.setTargetAtTime(v?1:0,this.ctx.currentTime,0.15);
      if(v)this.nextT=Math.max(this.nextT,this.ctx.currentTime+0.1);}
  }
  tick(){
    if(!this.ok||!this.musicOn)return;
    const c=this.ctx;if(c.state!=='running')return;
    const sd=this.intense?0.42:0.56;
    if(this.nextT<c.currentTime-0.5)this.nextT=c.currentTime+0.1;
    while(this.nextT<c.currentTime+0.7){
      this.schedStep(this.step,this.nextT);
      this.step=(this.step+1)%32;this.nextT+=sd;
    }
  }
  schedStep(s,t){
    if(s%8===0){this.thump(t);this.thump(t+0.3);}
    if(this.intense&&s%8===4)this.thump(t+0.1);
    if(Math.random()<(this.intense?0.4:0.22)){
      const sc=[220,233.08,261.63,293.66,311.13,415.3];
      const f=sc[(Math.random()*sc.length)|0]*(Math.random()<0.35?0.5:1);
      this.pluck(f,t);
    }
    if(s===20&&Math.random()<(this.intense?0.5:0.2))this.sting(t);
  }
  thump(t){const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(80,t);o.frequency.exponentialRampToValueAtTime(36,t+0.12);
    g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.32);
    o.connect(g);g.connect(this.mus);o.start(t);o.stop(t+0.35);}
  pluck(f,t){const c=this.ctx,o=c.createOscillator(),fl=c.createBiquadFilter(),g=c.createGain();
    o.type='square';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=900;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.05,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+(this.intense?0.8:1.7));
    o.connect(fl);fl.connect(g);g.connect(this.mus);o.start(t);o.stop(t+2);}
  sting(t){const c=this.ctx;[220,233.08,466.16].forEach(f=>{
    const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.026,t+0.5);
    g.gain.exponentialRampToValueAtTime(0.001,t+2.2);
    o.connect(g);g.connect(this.mus);o.start(t);o.stop(t+2.4);});}
  tone(f,d,o){
    if(!this.ok)return;o=o||{};
    const c=this.ctx,t=c.currentTime+(o.at||0);
    const os=c.createOscillator(),g=c.createGain();
    os.type=o.type||'square';os.frequency.setValueAtTime(f,t);
    if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t+d);
    g.gain.setValueAtTime(o.v||0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    os.connect(g);g.connect(this.sfxG);os.start(t);os.stop(t+d+0.02);
  }
  click(){this.tone(900,0.05,{v:0.07});this.tone(620,0.06,{v:0.05,at:0.02});}
  confirm(){this.tone(520,0.08,{v:0.1});this.tone(784,0.11,{v:0.1,at:0.07});}
  back(){this.tone(400,0.07,{v:0.09});this.tone(250,0.09,{v:0.09,at:0.06});}
  jumpS(){this.tone(170,0.14,{slide:330,v:0.09});}
  landS(){this.tone(95,0.06,{type:'triangle',v:0.08});}
  stepS(i){this.tone(i?1900:2200,0.015,{v:0.014});}
  keyS(){[660,880,1175,1570].forEach((f,i)=>this.tone(f,0.09,{type:'triangle',v:0.12,at:i*0.07}));}
  lockedS(){this.tone(120,0.1,{v:0.15});this.tone(90,0.13,{v:0.12,at:0.09});this.tone(300,0.03,{v:0.05,at:0.02});this.tone(280,0.03,{v:0.05,at:0.14});}
  openS(){this.tone(70,1.0,{type:'sawtooth',v:0.16,slide:42});[1500,1150,900].forEach((f,i)=>this.tone(f,0.04,{v:0.06,at:0.15+i*0.12}));this.tone(50,0.4,{type:'sine',v:0.18,at:0.9});}
  stingS(){[220,233.08,440].forEach(f=>this.tone(f,0.9,{type:'sawtooth',v:0.045}));this.tone(1200,0.4,{type:'sine',v:0.03,slide:850});}
  escapeS(){[392,494,587,784].forEach((f,i)=>this.tone(f,0.22,{type:'triangle',v:0.12,at:i*0.16}));this.tone(55,2,{type:'sine',v:0.1,at:0.7});}
  typeS(){this.tone(1300,0.012,{v:0.02});}
  /* novos (fase 2) */
  alertS(){this.tone(740,0.1,{v:0.1});this.tone(520,0.14,{v:0.1,at:0.09});}
  crackS(){this.tone(120,0.3,{type:'sawtooth',v:0.2,slide:40});this.tone(80,0.4,{v:0.18,at:0.08,slide:30});[2400,1900,1500].forEach((f,i)=>this.tone(f,0.03,{v:0.07,at:i*0.05}));}
  clackS(){[1800,1400,2100].forEach((f,i)=>this.tone(f,0.03,{v:0.05,at:i*0.04}));}
  invisOnS(){this.tone(1500,0.35,{type:'sine',v:0.1,slide:420});this.tone(2100,0.2,{type:'triangle',v:0.05,at:0.05,slide:900});}
  invisOffS(){this.tone(420,0.3,{type:'sine',v:0.09,slide:1300});}
  denyS(){this.tone(160,0.09,{v:0.12});this.tone(140,0.09,{v:0.1,at:0.08});}
  readyS(){this.tone(880,0.07,{type:'triangle',v:0.06});}
}

/* ================= FANTASMA KLIPZA (sprite em matriz) ================= */
class Ghost{
  constructor(){
    this.pal={'1':'#FFFFFF','2':'#AAAAAA','3':'#555555','4':'#000000'};
    this.base=[
      "0000000000000000","0000011111100000","0001111111111000","0011111111111100",
      "0111111111111110","0111111111111110","0111111111111110","0111111111111110",
      "0111111111111110","0111111111111110","0111111111111110","0111111111111110",
      "0111111111111110","0111111111111110"];
    this.frames={idle:[],walk:[],jump:[]};
    this.build();
  }
  compose(o){
    const rows=this.base.map(r=>r.split(''));
    const dx=o.dx||0,cols=[4+dx,5+dx,10+dx,11+dx];
    const put=(r,c,v)=>{if(c>=0&&c<16)rows[r][c]=v;};
    if(o.wide){[5,6,7].forEach(r=>cols.forEach(c=>put(r,c,'4')));}
    else if(o.blink){cols.forEach(c=>put(7,c,'4'));}
    else{[6,7].forEach(r=>cols.forEach(c=>put(r,c,'4')));}
    cols.forEach(c=>put(8,c,'3'));
    if(o.mouth==='o'){put(10,7,'4');put(10,8,'4');put(11,7,'4');put(11,8,'4');}
    else{put(10,7,'4');put(10,8,'4');}
    for(let r=4;r<=12;r++)put(r,13,'2');
    const out=rows.map(r=>r.join(''));
    out.push(o.tail);out.push(o.r15||"0000000000000000");
    return out;
  }
  mk(rows){
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    for(let y=0;y<16;y++){const r=rows[y];
      for(let x=0;x<16;x++){const ch=r[x];
        if(ch!=='0'){g.fillStyle=this.pal[ch];g.fillRect(x,y,1,1);}}}
    return c;
  }
  build(){
    const T1="0111011101110110",T2="0110111011101100",T3="0111011011101110";
    const TJ="0111111111111110",TJ2="0011001100110000";
    const m=o=>this.mk(this.compose(o));
    this.frames.idle=[m({tail:T1}),m({tail:T2}),m({tail:T3}),m({tail:T2})];
    this.blinkIdle=m({tail:T1,blink:true});
    this.frames.walk=[m({tail:T1,dx:1}),m({tail:T2,dx:1}),m({tail:T3,dx:1}),m({tail:T2,dx:1})];
    this.blinkWalk=m({tail:T2,dx:1,blink:true});
    this.frames.jump=[m({tail:TJ,mouth:'o',wide:true}),m({tail:TJ2,mouth:'o',wide:true}),
                      m({tail:TJ}),m({tail:TJ2})];
    const rows=this.compose({tail:T1});
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    for(let y=0;y<16;y++){const r=rows[y];
      for(let x=0;x<16;x++){const ch=r[x];
        if(ch==='1'||ch==='2'||ch==='3'){g.fillStyle='#000000';g.fillRect(x,y,1,1);}
        else if(ch==='4'){g.fillStyle='#FFFFFF';g.fillRect(x,y,1,1);}}}
    this.sil=c;
  }
}
function drawSpr(img,x,y,flip){
  x=Math.round(x);y=Math.round(y);
  if(!flip)ctx.drawImage(img,x,y);
  else{ctx.save();ctx.translate(x+16,y);ctx.scale(-1,1);ctx.drawImage(img,0,0);ctx.restore();}
}

/* ================= GOTAS (sangue pixel do título) ================= */
class Drips{
  constructor(){this.list=[];this.drops=[];}
  seed(srcs){
    this.list=[];this.drops=[];
    for(const s of srcs)if(Math.random()<0.6)
      this.list.push({x:s.x,y:s.y,len:0,max:8+Math.random()*26,sp:0.05+Math.random()*0.1,wait:(Math.random()*220)|0});
  }
  update(){
    for(const d of this.list){
      if(d.wait>0){d.wait--;continue;}
      d.len+=d.sp;
      if(d.len>=d.max){
        this.drops.push({x:d.x,y:d.y+d.len,vy:0.25+Math.random()*0.3});
        d.len=2+Math.random()*3;d.max=8+Math.random()*26;d.sp=0.04+Math.random()*0.09;
      }
    }
    for(const p of this.drops){p.vy=Math.min(p.vy+0.02,1);p.y+=p.vy;}
    this.drops=this.drops.filter(p=>p.y<184);
  }
  draw(col,w){
    ctx.fillStyle=col;
    for(const d of this.list){if(d.wait>0||d.len<=0)continue;ctx.fillRect(d.x,d.y,w,Math.ceil(d.len));}
    for(const p of this.drops)ctx.fillRect(p.x,p.y,w,w);
  }
}

/* ================= MAP (laboratório — FASE 1) ================= */
class Map{
  constructor(){
    this.mw=MW;
    this.g=new Uint8Array(MW*MH);
    this.door={x:820,y:130,w:20,h:40,open:0,opening:false,done:false};
    this.key={x:585,y:62,taken:false};
    this.build();
  }
  set(x,y,v){if(x>=0&&x<MW&&y>=0&&y<MH)this.g[y*MW+x]=v;}
  build(){
    const g=this.g;g.fill(0);
    for(let x=0;x<MW;x++){this.set(x,0,1);this.set(x,17,1);}
    for(let y=0;y<MH;y++){this.set(0,y,1);this.set(87,y,1);}
    for(let y=0;y<=12;y++){this.set(20,y,1);this.set(63,y,1);}
    this.set(33,16,3);
    this.set(34,15,3);this.set(34,16,3);
    this.set(35,14,3);this.set(35,15,3);this.set(35,16,3);
    for(let x=36;x<=40;x++)this.set(x,13,2);
    for(let x=42;x<=46;x++)this.set(x,10,2);
    for(let x=48;x<=60;x++)this.set(x,7,2);
    for(let x=22;x<=25;x++)this.set(x,14,2);
    for(let x=82;x<=83;x++)for(let y=13;y<=16;y++)this.set(x,y,4);
    const lx=[5,14,23,32,41,50,59,68,77,85];
    this.lamps=lx.map((tx,i)=>({tx:tx,broken:i===2,dead:i===7}));
    this.jars=[10,11,70,71,75];
    this.posters=[{tx:8,ty:9},{tx:26,ty:9},{tx:45,ty:3},{tx:66,ty:9}];
    this.machines=[{x:424,y:100,w:26,h:70},{x:456,y:88,w:20,h:82},{x:492,y:104,w:24,h:66}];
    this.appSpots=[140,260,470,610,740,800];
    this.acts=[
      {x:45,y:160,r:17,kind:'console',read:false,lines:["LAB-7 :: TERMINAL DE SEGURANCA","ENERGIA: FALHANDO. SUJEITOS: 9.","ATIVOS: 1 ... NAO ABRA O PORTAO."]},
      {x:165,y:163,r:17,kind:'note',read:false,lines:["DIARIO - DIA 402","OS GRITOS VEM DAS PAREDES.","A CHAVE ESTA NO ALTO. SUBA."]},
      {x:235,y:128,r:17,kind:'note',read:false,lines:["VI ALGO SE MOVENDO","LA EM CIMA, NAS PASSARELAS.","NAO OLHE NOS OLHOS DELE."]},
      {x:665,y:160,r:17,kind:'console',read:false,lines:["PORTAO PRINCIPAL","TRANCADO POR DENTRO.","QUEM TRANCOU? POR QUE?"]},

  solid(tx,ty){

/* ================= MAP 2 (cemitério — FASE 2) ================= */
class Map2{
  constructor(){
    this.mw=MW2;
    this.g=new Uint8Array(MW2*MH);

  set(x,y,v){if(x>=0&&x<MW2&&y>=0&&y<MH)this.g[y*MW2+x]=v;}
  build(){
    for(let x=0;x<MW2;x++){
      if(x>=64&&x<=84)continue; // buraco da ponte
      this.set(x,15,1);this.set(x,16,1);this.set(x,17,1);
    }
    for(let y=8;y<=17;y++){this.set(0,y,1);this.set(1,y,1);}
    for(let y=8;y<=17;y++){this.set(126,y,1);this.set(127,y,1);}
    this.crypts=[{x:18,w:2},{x:32,w:2},{x:48,w:2}];
    for(const c of this.crypts)for(let x=c.x;x<c.x+c.w;x++)for(let y=12;y<=14;y++)this.set(x,y,3);
    for(let x=118;x<=119;x++)for(let y=10;y<=14;y++)this.set(x,y,4);
    for(let x=64;x<=84;x++){this.set(x,15,5);this.planks.push({tx:x,falling:false,oy:0,vy:0,gone:false});}
    this.graves=[8,13,23,27,37,42,52,58,90,95,101,107,112];
    this.trees=[6,29,45,55,92,104,113];
    this.fences=[{x0:10,x1:16},{x0:24,x1:30},{x0:39,x1:46},{x0:51,x1:57},{x0:96,x1:103},{x0:108,x1:114}];
  }
  solid(tx,ty){
    if(tx<0||tx>=MW2)return true;
    if(ty<0)return false;
    if(ty>=MH)return false;
    const c=this.g[ty*MW2+tx];
    if(c===4)return this.gate.open<0.85;
    if(c===5){const p=this.planks[tx-64];return !!p&&!p.falling&&!p.gone;}
    return c>=1&&c<=3;
  }
  draw(cam,t){
    const g=ctx;
    const x0=Math.max(0,Math.floor(cam/TILE)-1),x1=Math.min(MW2-1,Math.floor((cam+W)/TILE)+1);

    for(const f of this.fences){

      g.fillRect(x+6,126,7,1);g.fillRect(x+12,122,1,4);

      const x=this.graves[i]*10;

      const v=hash(i,3)%3;
      if(v===0){
        g.fillStyle='#555555';g.fillRect(x+1,140,8,10);g.fillRect(x+2,138,6,2);

    g.restore();
    const lampOn=gt.open<1&&((t%30)<15);
    g.fillStyle='#555555';g.fillRect(1186,84,8,6);
    g.fillStyle=lampOn?'#FFFFFF':'#555555';g.fillRect(1189,86,2,2);
  }
}

/* ================= PLAYER ================= */
class Player{
  constructor(map,x,y){
    this.map=map;this.x=x;this.y=y;this.w=10;this.h=14;
    this.vx=0;this.vy=0;this.ground=false;this.face=1;
    this.frame=0;this.animMs=0;this.state='idle';
    this.blinkIn=1800+Math.random()*2000;this.blinking=0;
    this.coyote=0;this.jbuf=0;this.stepT=0;
  }
  get cx(){return this.x+this.w/2;}
  get cy(){return this.y+this.h/2;}
  hitV(px,pyTop){
    const tx=Math.floor(px/TILE);
    const a=Math.floor(pyTop/TILE),b=Math.floor((pyTop+this.h/2)/TILE),c=Math.floor((pyTop+this.h-0.01)/TILE);
    return this.map.solid(tx,a)||this.map.solid(tx,b)||this.map.solid(tx,c);
  }
  hitH(py,pxL){
    const ty=Math.floor(py/TILE);
    const a=Math.floor(pxL/TILE),b=Math.floor((pxL+this.w/2)/TILE),c=Math.floor((pxL+this.w-0.01)/TILE);
    return this.map.solid(a,ty)||this.map.solid(b,ty)||this.map.solid(c,ty);
  }
  update(inp,dt){
    const target=(inp.right?1:0)-(inp.left?1:0);
    this.vx+=(target*1.35-this.vx)*0.35;
    if(Math.abs(this.vx)<0.05)this.vx=0;
    if(target>0)this.face=1;if(target<0)this.face=-1;
    if(this.jbuf>0)this.jbuf--;
    if(this.coyote>0)this.coyote--;
    if(this.jbuf>0&&(this.ground||this.coyote>0)){
      this.vy=-4.45;this.ground=false;this.coyote=0;this.jbuf=0;
      game.sound.jumpS();game.puff(this.cx,this.y+this.h,3);
    }
    if(!inp.jump&&this.vy<-1.6)this.vy=-1.6;
    this.vy+=0.22;if(this.vy>5)this.vy=5;
    this.x+=this.vx;
    if(this.vx>0){if(this.hitV(this.x+this.w,this.y)){this.x=Math.floor((this.x+this.w)/TILE)*TILE-this.w-0.01;this.vx=0;}}
    else if(this.vx<0){if(this.hitV(this.x,this.y)){this.x=(Math.floor(this.x/TILE)+1)*TILE+0.01;this.vx=0;}}
    if(this.x<10)this.x=10;
    if(this.x>this.map.mw*TILE-10-this.w)this.x=this.map.mw*TILE-10-this.w;
    const wasAir=!this.ground;
    this.y+=this.vy;this.ground=false;
    if(this.vy>0){
      if(this.hitH(this.y+this.h,this.x)){
        this.y=Math.floor((this.y+this.h)/TILE)*TILE-this.h-0.01;this.vy=0;this.ground=true;
        if(wasAir){game.sound.landS();game.puff(this.cx,this.y+this.h,4);}
      }
    }else if(this.vy<0){
      if(this.hitH(this.y,this.x)){this.y=(Math.floor(this.y/TILE)+1)*TILE+0.01;this.vy=0;}
    }
    if(this.ground)this.coyote=7;
    this.animMs+=dt;
    if(this.animMs>=120){this.animMs-=120;this.frame=(this.frame+1)%4;}
    if(this.blinking>0)this.blinking-=dt;
    else{this.blinkIn-=dt;if(this.blinkIn<=0){this.blinking=140;this.blinkIn=2200+Math.random()*2600;}}
    this.state=!this.ground?'jump':(Math.abs(this.vx)>0.25?'walk':'idle');
    if(this.state==='walk'){this.stepT+=dt;if(this.stepT>230){this.stepT=0;game.sound.stepS(this.frame%2);}}
  }
  draw(){
    const g=game.ghost;let img;
    if(this.state==='jump'){
      const jf=this.vy<0?(this.frame%2):2+(this.frame%2);
      img=g.frames.jump[jf];
    }else if(this.state==='walk'){
      img=this.blinking>0?g.blinkWalk:g.frames.walk[this.frame];
    }else{
      img=this.blinking>0?g.blinkIdle:g.frames.idle[this.frame];
    }
    const bob=this.state==='idle'?[0,-1,-1,0][this.frame]:this.state==='walk'?[0,-1,0,-1][this.frame]:0;
    drawSpr(img,this.x-3,this.y-2+bob,this.face<0);
  }
}

/* ================= GAME ================= */
class Game{
  constructor(){
    this.sound=new Sound();
    this.ghost=new Ghost();
    this.menu=new Menu(this);
    this.isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
    this.state='intro';
    this.level=1;this.escTarget='menu';
    this.intro={phase:0,t:0,load:0,drips:new Drips(),seeded:false,eyes:{t:120,on:false,x:0,y:0}};
    this.keys={};this.pressedObj={};this.touches=[];
    this.prevJ=false;this.prevA=false;this.prevR2=false;
    this.t=0;this.acc=0;this.last=0;
    this.toastQ=[];this.toastCur=null;this.toastLines=[];
    this.dialog={active:false,pages:[],page:0,n:0};
    this.skels=[];this.invis={active:0,cd:0,denyT:0};
    this.cine={active:false,t:0,hold:0};
    this.graceT=0;this.alertSndT=0;
    this.vig=document.createElement('canvas');this.vig.width=W;this.vig.height=H;
    const vg=this.vig.getContext('2d');
    for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){
      const dx=(x-160)/160,dy=(y-90)/90,d=Math.sqrt(dx*dx+dy*dy);
      if(d>0.7&&Math.random()<(d-0.7)/0.3*0.6){vg.fillStyle='#000000';vg.fillRect(x,y,1,1);}
    }
    this.btns={l:{x:6,y:138,w:40,h:36},r:{x:50,y:138,w:40,h:36},a:{x:226,y:136,w:40,h:38},j:{x:270,y:130,w:44,h:46},r2:{x:138,y:138,w:42,h:36}};
    this.buildSkel();
    this.bindInput();
  }
  /* ---------- sprites de esqueleto ---------- */
  buildSkel(){
    const SK_A=[
    "...WWWWWW...","...WWWWWW...","...W0WW0W...","...W0W0W0...",
    "....WWWW....",".....WW.....","..WWWWWWWW..","..W.WWWW.W..",
    "..W.WWWW.W..","....WWWW....","....WWWW....","....W..W....",
    "....W..W....","...W....W...","...W....W...","..WW....WW.."];
    const SK_B=[
    "...WWWWWW...","...WWWWWW...","...W0WW0W...","...W0W0W0...",
    "....WWWW....",".....WW.....","..WWWWWWWW..","..W.WWWW.W..",
    "..W.WWWW.W..","....WWWW....","....WWWW....",".....WW.....",
    "....WWWW....","....W..W....","....W..W....","...WW..WW..."];
    const SK_F=[
    "...WWWWWW...","...WWWWWW...","...W0WW0W...","..W.WWWW.W..",
    "..W..WW..W..","..WWWWWWWW..","....WWWW....","....WWWW....",
    "....WWWW....","....WWWW....","....WWWW....","....W..W....",
    "...W....W...","...W....W...","..W......W..",".WW......WW."];
    const mk=(rows,col)=>{
      const c=document.createElement('canvas');c.width=12;c.height=16;
      const g=c.getContext('2d');
      for(let y=0;y<16;y++)for(let x=0;x<12;x++){
        const ch=rows[y][x];
        if(ch==='W'){g.fillStyle=col;g.fillRect(x,y,1,1);}
        else if(ch==='0'){g.fillStyle='#000000';g.fillRect(x,y,1,1);}
      }
      return c;
    };
    this.skel={w1:mk(SK_A,'#FFFFFF'),w2:mk(SK_B,'#FFFFFF'),wf:mk(SK_F,'#FFFFFF'),
               r1:mk(SK_A,'#FF3B3B'),r2:mk(SK_B,'#FF3B3B'),rf:mk(SK_F,'#FF3B3B')};
  }
  /* ---------- input ---------- */
  bindInput(){
    addEventListener('keydown',e=>{
      if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0)e.preventDefault();
      this.sound.unlock();
      if(e.repeat){this.keys[e.code]=true;return;}
      this.keys[e.code]=true;this.pressedObj[e.code]=true;
    });
    addEventListener('keyup',e=>{this.keys[e.code]=false;});
    addEventListener('blur',()=>{this.keys={};this.touches=[];});
    canvas.addEventListener('pointerdown',e=>{
      e.preventDefault();this.sound.unlock();
      const p=this.toXY(e);
      // mensagem persistente: qualquer toque fecha
      if(this.toastCur&&this.state==='game'){this.toastCur=null;return;}
      if(this.state==='intro'){this.skipIntro();return;}
      if(this.state==='game'){
        if(this.dialog&&this.dialog.active){this.advDialog();return;}
        if(this.isTouch&&p.x>290&&p.y<16){this.toMenu();return;}
        this.touches.push({id:e.pointerId,x:p.x,y:p.y});
        return;
      }
      if(this.state==='menu'){this.menuTap(p);return;}
      if(this.state==='settings'){this.setTap(p);return;}
      if(this.state==='director'){this.sound.back();this.toMenu();return;}
      if(this.state==='escaped'){this.sound.confirm();this.toMenu();return;}
    },{passive:false});
    canvas.addEventListener('pointermove',e=>{
      const p=this.toXY(e);
      for(const tch of this.touches)if(tch.id===e.pointerId){tch.x=p.x;tch.y=p.y;}
    });
    const up=e=>{this.touches=this.touches.filter(tt=>tt.id!==e.pointerId);};
    canvas.addEventListener('pointerup',up);
    canvas.addEventListener('pointercancel',up);
    canvas.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
    canvas.addEventListener('contextmenu',e=>e.preventDefault());
  }
  toXY(e){
    const r=canvas.getBoundingClientRect();
    return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
  }
  inRect(p,b){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;}
  menuTap(p){
    for(let i=0;i<3;i++){
      if(this.inRect(p,{x:90,y:88+i*22,w:140,h:18})){
        if(this.menu.sel!==i)this.sound.click();
        this.menu.sel=i;this.menuActivate();return;
      }
    }
  }
  setTap(p){
    for(let i=0;i<3;i++){
      if(this.inRect(p,{x:60,y:64+i*26,w:200,h:20})){
        this.menu.setSel=i;this.setActivate();return;
      }
    }
  }
  menuActivate(){
    this.sound.confirm();
    const s=this.menu.sel;
    if(s===0)this.startGame();
    else if(s===1){this.state='settings';this.menu.setSel=0;}
    else this.state='director';
  }
  setActivate(){
    const s=this.menu.setSel;
    if(s===0){this.sound.setMusic(!this.sound.musicOn);this.sound.click();}
    else if(s===1){this.sound.confirm();this.toggleFS();}
    else{this.sound.back();this.toMenu();}
  }
  toggleFS(){
    const d=document.documentElement;
    try{
      if(document.fullscreenElement)document.exitFullscreen();
      else(d.requestFullscreen||d.webkitRequestFullscreen).call(d);
    }catch(e){this.toast('NAO SUPORTADO');}
  }
  toMenu(){this.state='menu';this.menu.enter();this.sound.setIntense(false);this.toastCur=null;this.toastQ=[];}
  skipIntro(){if(this.state==='intro'){this.state='menu';this.menu.enter();}}
  /* ---------- mensagens persistentes ---------- */
  toast(txt){this.toastQ.push(txt);}
  openDialog(lines){
    const wrapped=[];
    for(const ln of lines)for(const w of wrapText(ln,28))wrapped.push(w);
    const pages=[];
    for(let i=0;i<wrapped.length;i+=3)pages.push(wrapped.slice(i,i+3));
    this.dialog={active:true,pages:pages,page:0,n:0};
  }
  advDialog(){
    const d=this.dialog;if(!d||!d.active)return;
    const pl=d.pages[d.page];
    const total=pl.reduce((a,l)=>a+l.length,0);
    if(d.n<total){d.n=total;this.sound.typeS();}
    else{
      d.page++;d.n=0;
      if(d.page>=d.pages.length){d.active=false;this.sound.click();}
      else this.sound.typeS();
    }
  }
  updDialog(P){
    if(!this.dialog.active)return false;
    const d=this.dialog,pl=d.pages[d.page];
    if(pl){
      const total=pl.reduce((a,l)=>a+l.length,0);
      if(d.n<total){d.n+=0.7;if(Math.floor(d.n)%4===0)this.sound.typeS();}
      if(P.ok||P.act)this.advDialog();
    }
    return true;
  }
  /* ---------- jogo: FASE 1 ---------- */
  startGame(){
    this.level=1;
    this.map=new Map();
    this.player=new Player(this.map,32,156);
    this.hasKey=false;this.time=0;this.introT=0;
    this.cam=0;this.shake=0;this.glitch=0;
    this.toastQ=[];this.toastCur=null;
    this.dialog={active:false,pages:[],page:0,n:0};
    this.parts=[];this.dust=[];
    for(let i=0;i<24;i++)this.dust.push({x:Math.random()*W,y:Math.random()*H,sp:0.08+Math.random()*0.2,ph:Math.random()*6});
    this.app={on:false,x:0,t:0,cd:500+Math.random()*400};
    this.bo={on:false,t:500+Math.random()*500};
    this.flick={brokenT:400,on:0};
    this.scarePending=0;
    this.skels=[];this.invis={active:0,cd:0,denyT:0};this.cine={active:false,t:0,hold:0};
    this.sound.setIntense(false);
    this.state='game';
  }
  puff(x,y,n){
    for(let i=0;i<n;i++)this.parts.push({x:x,y:y,vx:(Math.random()-0.5)*1.2,vy:-Math.random()*0.8,l:16+Math.random()*10,c:'#AAAAAA'});
  }
  burst(x,y){
    for(let i=0;i<14;i++)this.parts.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:-Math.random()*2.5,l:24+Math.random()*14,c:Math.random()<0.5?'#FFFFFF':'#AAAAAA'});
  }
  bones(x,y){
    for(let i=0;i<10;i++)this.parts.push({x:x,y:y,vx:(Math.random()-0.5)*2.4,vy:-Math.random()*2-0.5,l:26+Math.random()*12,c:Math.random()<0.7?'#FFFFFF':'#AAAAAA'});
  }
  sparkle(){
    const p=this.player;
    for(let i=0;i<10;i++)this.parts.push({x:p.x+Math.random()*p.w,y:p.y+Math.random()*p.h,vx:(Math.random()-0.5)*0.8,vy:-Math.random()*0.6,l:20,c:'#FFFFFF'});
  }
  openDoor(){
    const d=this.map.door;
    if(d.opening||d.open>=1)return;
    d.opening=true;this.sound.openS();this.shake=14;
    this.toast('O PORTAO SE ABRIU...');
  }
  doInteract(a){
    if(a.kind==='key'){
      this.map.key.taken=true;this.hasKey=true;
      this.sound.keyS();this.burst(a.x,a.y);
      this.toast('A CHAVE PULSA NA SUA MAO. FUJA.');
      this.sound.setIntense(true);this.glitch=14;
      this.app.cd=Math.min(this.app.cd,140);
    }else if(a.kind==='door'){
      if(!this.hasKey){this.openDialog(['TRANCADO.','PRECISO DA CHAVE.']);this.sound.lockedS();}
      else this.openDoor();
    }else{
      a.read=true;this.openDialog(a.lines);this.sound.typeS();
    }
  }
  consumePressed(){
    const p=this.pressedObj;
    const P={
      up:p.ArrowUp||p.KeyW,down:p.ArrowDown||p.KeyS,
      ok:p.Enter||p.Space,back:p.Escape,
      jump:p.Space||p.KeyW||p.ArrowUp,act:p.KeyE,
      invis:p.KeyR,
      any:Object.keys(p).length>0
    };
    this.pressedObj={};
    return P;
  }
  touchFlags(){
    const f={l:false,r:false,j:false,a:false,r2:false};
    for(const tch of this.touches){
      const p={x:tch.x,y:tch.y};
      if(this.inRect(p,this.btns.l))f.l=true;
      if(this.inRect(p,this.btns.r))f.r=true;
      if(this.inRect(p,this.btns.j))f.j=true;
      if(this.inRect(p,this.btns.a))f.a=true;
      if(this.inRect(p,this.btns.r2))f.r2=true;
    }
    return f;
  }
  /* ---------- update ---------- */
  stepF(dt){
    this.t++;
    this.sound.tick();
    const P=this.consumePressed();
    // mensagens: só somem ao apertar qualquer tecla
    if(this.state==='game'){
      if(this.toastCur&&P.any){
        this.toastCur=null;
        P.ok=false;P.act=false;P.jump=false;P.back=false;P.invis=false;
      }else if(!this.toastCur&&this.toastQ.length&&!(this.dialog&&this.dialog.active)&&!(this.cine&&this.cine.active)){
        const m=this.toastQ.shift();
        this.toastCur=m;this.toastLines=wrapText(m,30);
      }
    }
    switch(this.state){
      case 'intro':this.updIntro(P);break;
      case 'menu':
        this.menu.update();
        if(P.up){this.menu.sel=(this.menu.sel+2)%3;this.sound.click();}
        if(P.down){this.menu.sel=(this.menu.sel+1)%3;this.sound.click();}
        if(P.ok)this.menuActivate();
        break;
      case 'settings':
        this.menu.update();
        if(P.up){this.menu.setSel=(this.menu.setSel+2)%3;this.sound.click();}
        if(P.down){this.menu.setSel=(this.menu.setSel+1)%3;this.sound.click();}
        if(P.ok)this.setActivate();
        if(P.back){this.sound.back();this.toMenu();}
        break;
      case 'director':
        this.menu.update();
        if(P.ok||P.back){this.sound.back();this.toMenu();}
        break;
      case 'game':
        if(this.level===2)this.updGame2(P,dt);else this.updGame(P,dt);
        break;
      case 'escapeAnim':
        this.escT++;this.updAmbient(dt);
        if(this.escT>62){
          if(this.escTarget==='level2')this.startLevel2();
          else{this.state='escaped';this.escSeed=false;}
        }
        break;
      case 'escaped':
        this.updEscaped(P);
        break;
    }
  }
  updIntro(P){
    const it=this.intro;it.t++;
    if(it.phase===0&&it.t>40){it.phase=1;it.t=0;}
    else if(it.phase===1){
      if(it.t>132){it.phase=2;it.t=0;}
      if(P.any&&it.t>30){this.skipIntro();return;}
    }else if(it.phase===2){
      if(!it.seeded){it.drips.seed(textSources('OTHER SIDE',5,37,44));it.seeded=true;}
      it.drips.update();
      if(it.load<66)it.load+=0.7;
      else if(it.load<70)it.load+=(Math.random()<0.2)?0.5:0;
      else it.load+=0.9;
      it.eyes.t--;
      if(it.eyes.t<=0){
        if(it.eyes.on){it.eyes.on=false;it.eyes.t=140+Math.random()*260;}
        else{it.eyes.on=true;it.eyes.x=30+Math.random()*260;it.eyes.y=90+Math.random()*60;it.eyes.t=22;}
      }
      if(it.load>=100){it.phase=3;it.t=0;it.load=100;}
      if(P.any&&it.t>40){this.skipIntro();return;}
    }else if(it.phase===3&&it.t>34){this.state='menu';this.menu.enter();}
  }
  updAmbient(dt){
    for(const p of this.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.l--;}
    this.parts=this.parts.filter(p=>p.l>0);
    for(const d of this.dust){
      d.y+=d.sp;d.x+=Math.sin((this.t+d.ph*60)*0.01)*0.08;
      if(d.y>H){d.y=-2;d.x=Math.random()*W;}
    }
  }
  updGame(P,dt){
    const tb=this.touchFlags();
    if(tb.j&&!this.prevJ)P.jump=true;
    if(tb.a&&!this.prevA)P.act=true;
    this.prevJ=tb.j;this.prevA=tb.a;
    this.updAmbient(dt);
    const d=this.map.door;
    if(d.opening&&d.open<1){
      d.open+=1/90;
      if(Math.random()<0.3)this.parts.push({x:820+Math.random()*20,y:130,vx:(Math.random()-0.5),vy:Math.random(),l:20,c:'#AAAAAA'});
      if(d.open>=1){
        d.open=1;d.opening=false;d.done=true;
        this.scarePending=40;
      }
    }
    if(this.scarePending>0){
      this.scarePending--;
      if(this.scarePending===0){
        this.spawnApp(clamp(this.player.cx-100,30,840));
      }
    }
    this.updHorror();
    if(this.updDialog(P))return;
    if(this.introT<220)this.introT++;
    if(P.back){this.sound.back();this.toMenu();return;}
    const inp={
      left:this.keys.ArrowLeft||this.keys.KeyA||tb.l,
      right:this.keys.ArrowRight||this.keys.KeyD||tb.r,
      jump:this.keys.Space||this.keys.KeyW||this.keys.ArrowUp||tb.j
    };
    if(P.jump)this.player.jbuf=7;
    this.player.update(inp,dt);
    this.time++;
    const tgt=clamp(this.player.cx-160+this.player.face*24,0,MW*TILE-W);
    this.cam+=(tgt-this.cam)*0.1;
    this.prompt=null;
    for(const a of this.map.acts){
      if(a.kind==='key'&&this.map.key.taken)continue;
      if(a.kind==='door'&&(d.opening||d.open>=1))continue;
      const dist=Math.hypot(a.x-this.player.cx,a.y-this.player.cy);
      if(dist<a.r){this.prompt=a;break;}
    }
    if(this.hasKey&&!d.opening&&d.open<1&&this.player.x+this.player.w>796)this.openDoor();
    if(P.act&&this.prompt)this.doInteract(this.prompt);
    if(d.open>=1&&this.player.x>838)this.startEscape();
  }
  updHorror(){
    this.bo.t--;
    if(this.bo.t<=0){
      if(this.bo.on){this.bo.on=false;this.bo.t=650+Math.random()*800;}
      else{
        this.bo.on=true;this.bo.t=42+Math.random()*50;
        if(Math.random()<0.4)this.app.cd=Math.min(this.app.cd,20);
      }
    }
    this.flick.brokenT--;
    if(this.flick.brokenT<=0){
      if(this.flick.on>0){this.flick.on=0;this.flick.brokenT=140+Math.random()*340;}
      else{this.flick.on=8+Math.random()*12;this.flick.brokenT=this.flick.on;}
    }
    if(!this.app.on){
      this.app.cd--;
      if(this.app.cd<=0)this.spawnApp();
    }else{
      this.app.t--;
      if(Math.abs(this.app.x-this.player.cx)<34)this.app.t=Math.min(this.app.t,8);
      if(this.app.t<=0){
        this.app.on=false;
        this.app.cd=(this.sound.intense?320:620)+Math.random()*520;
      }
    }
    if(this.sound.intense&&Math.random()<0.006)this.glitch=3;
    if(this.shake>0)this.shake--;
    if(this.glitch>0)this.glitch--;
  }
  spawnApp(forceX){
    let best=null;
    for(const sx of this.map.appSpots){
      const dist=Math.abs(sx-this.player.cx);
      if(dist>60&&dist<270){if(!best||Math.random()<0.5)best=sx;}
    }
    if(best===null)best=clamp(this.player.cx+130,30,840);
    if(forceX!==undefined)best=forceX;
    this.app.on=true;this.app.x=best;this.app.t=46+Math.random()*40;
    this.sound.stingS();this.glitch=6;
  }
  startEscape(){
    this.state='escapeAnim';this.escT=0;this.escTarget='level2';
    this.sound.escapeS();this.sound.setIntense(false);
  }
  updEscaped(P){
    if(!this.escSeed){
      this.escDrips=new Drips();
      this.escDrips.seed(textSources('YOU ESCAPED',3,79,44));
      this.escSeed=true;
    }
    this.escDrips.update();
    if(P.ok){this.sound.confirm();this.toMenu();}
  }
  /* ---------- FASE 2: CEMITÉRIO ---------- */
  startLevel2(){
    this.level=2;
    this.map=new Map2();
    this.player=new Player(this.map,28,136);
    this.cam=0;this.shake=0;this.glitch=0;
    this.toastQ=[];this.toastCur=null;
    this.dialog={active:false,pages:[],page:0,n:0};
    this.parts=[];this.dust=[];
    for(let i=0;i<30;i++)this.dust.push({x:Math.random()*W,y:Math.random()*H,sp:0.05+Math.random()*0.15,ph:Math.random()*6});
    this.skels=this.mkSkels();
    this.invis={active:0,cd:0,denyT:0};
    this.cine={active:false,t:0,hold:0};
    this.checkX=28;this.cp2=false;
    this.graceT=90;this.alertSndT=0;
    this.obj2='SAIA PELO PORTAO DO CEMITERIO';
    this.introT=0;
    this.sound.setIntense(false);
    this.state='game';
    ['VOCE SAIU DO LABORATORIO...',
     'MAS OS GUARDAS DO SUBMUNDO PATRULHAM AQUI.',
     'VOCE APRENDEU: INVISIBILIDADE.',
     'APERTE R: FICA INVISIVEL POR 5 SEGUNDOS.',
     'A ENERGIA DEMORA PARA RECARREGAR.',
     'ESCONDA-SE. CHEGUE AO PORTAO.'].forEach(m=>this.toast(m));
  }
  mkSkels(){
    return [this.mkSkel(90,168,120),this.mkSkel(208,308,250),this.mkSkel(348,468,420),
            this.mkSkel(506,628,560),this.mkSkel(892,1002,950)];
  }
  mkSkel(minX,maxX,x){
    return{x:x,y:150,dir:1,minX:minX,maxX:maxX,state:'patrol',loseT:0,searchT:0,lastSeen:x,
      bubbleTxt:'',bubbleT:0,bubbleDelay:0,bubblePool:'alert',animT:Math.random()*2,
      falling:false,vy:0,dead:false};
  }
  setBubble(s,pool){
    const pools={
      alert:['O FUGITIVO! ALI!','PEGUEM ELE!','NAO O DEIXEM SAIR!','O SUBMUNDO TEM FOME.'],
      search:['ONDE ESTA O FUGITIVO?','SUMIU...','PROCUREM NO PORTAO.','EU OUVI ALGO...','ESPALHEM-SE.'],
      crack:['A PONTE! PEGUEM ELE!','O FUGITIVO! CORRAM!','NAO O DEIXEM CAIR!']
    };
    const arr=pools[pool]||pools.alert;
    s.bubbleTxt=arr[(Math.random()*arr.length)|0];s.bubbleT=110;
  }
  alertWave(x){
    let i=0;
    for(const s of this.skels){
      if(Math.abs(s.x-x)<320){
        if(s.state!=='alert'){s.state='alert';s.loseT=0;s.bubbleDelay=i*45;s.bubblePool='alert';i++;}
        s.lastSeen=this.player.cx;
      }
    }
    if(i>0&&this.alertSndT<=0){this.sound.alertS();this.alertSndT=60;}
  }
  wallAhead(s){
    const tx=Math.floor((s.x+s.dir*8)/TILE);
    return this.map.solid(tx,13)||this.map.solid(tx,14);
  }
  skelSees(s){
    if(this.invis.active>0)return false;
    const p=this.player;
    if(Math.abs((s.y-9)-p.cy)>26)return false;
    const dx=p.cx-s.x,dist=Math.abs(dx);
    if(dist<3)return false;
    const range=s.state==='alert'?150:84;
    if(dist>range)return false;
    if(s.state!=='alert'&&dx*s.dir<=0)return false;
    const step=dx>0?6:-6;
    for(let px=s.x+step;(dx>0?px<p.cx-4:px>p.cx+4);px+=step){
      if(this.map.solid(Math.floor(px/TILE),14))return false;
    }
    return true;
  }
  updSkeletons(){
    if(this.graceT>0){this.graceT--;this.skels=this.skels.filter(s=>!s.dead);return;}
    const P2=this.player;let caught=false;
    for(const s of this.skels){
      if(s.dead)continue;
      if(s.falling){
        s.vy+=0.3;s.y+=s.vy;s.x+=s.dir*0.3;
        if(s.y>188){this.bones(s.x,176);this.sound.clackS();s.dead=true;}
        continue;
      }
      if(!this.map.solid(Math.floor(s.x/TILE),15)){s.falling=true;s.vy=0;continue;}
      const sees=this.skelSees(s);
      if(sees){
        if(s.state!=='alert')this.alertWave(s.x);
        s.state='alert';s.loseT=0;s.lastSeen=P2.cx;
      }
      if(s.state==='patrol'){
        s.x+=s.dir*0.32;s.animT+=0.06;
        if(s.x<=s.minX){s.x=s.minX;s.dir=1;}
        if(s.x>=s.maxX){s.x=s.maxX;s.dir=-1;}
        if(this.wallAhead(s))s.dir*=-1;
      }else if(s.state==='alert'){
        s.dir=P2.cx>=s.x?1:-1;
        if(!this.wallAhead(s))s.x+=s.dir*0.92;
        s.animT+=0.13;
        if(!sees){
          s.loseT++;
          if(s.loseT>150){s.state='search';s.searchT=260;this.setBubble(s,'search');}
        }else if(s.bubbleT<=0&&Math.random()<0.006)this.setBubble(s,'alert');
      }else{
        s.searchT--;
        const dd=s.lastSeen-s.x;
        if(Math.abs(dd)>8){
          s.dir=dd>0?1:-1;
          if(!this.wallAhead(s))s.x+=s.dir*0.5;
          else{s.dir*=-1;s.lastSeen=s.x+s.dir*40;}
          s.animT+=0.09;
        }else if(Math.random()<0.02)s.dir*=-1;
        if(Math.random()<0.005)this.setBubble(s,'search');
        if(s.searchT<=0){s.state='patrol';s.bubbleT=Math.min(s.bubbleT,20);}
      }
      s.x=clamp(s.x,14,MW2*TILE-14);
      if(s.bubbleDelay>0){s.bubbleDelay--;if(s.bubbleDelay===0)this.setBubble(s,s.bubblePool);}
      if(s.bubbleT>0)s.bubbleT--;
      if(this.invis.active<=0&&Math.abs(s.x-P2.cx)<8&&Math.abs((s.y-9)-P2.cy)<13){caught=true;break;}
    }
    if(caught){this.respawn('OS ESQUELETOS TE PEGARAM...');return;}
    this.skels=this.skels.filter(s=>!s.dead);
    const anyAlert=this.skels.some(s=>s.state==='alert');
    this.sound.setIntense(anyAlert);
  }
  respawn(msg){
    this.sound.stingS();this.shake=12;this.glitch=8;
    const p=this.player;p.x=this.checkX;p.y=136;p.vx=0;p.vy=0;p.face=1;
    this.skels=this.mkSkels();
    this.graceT=120;
    const m=this.map;
    if(m.cracked&&!m.bridgeDone){
      for(const pl of m.planks){pl.falling=false;pl.gone=false;pl.oy=0;pl.vy=0;}
      m.cracked=false;
      this.obj2='SAIA PELO PORTAO DO CEMITERIO';
    }
    this.cam=clamp(p.cx-160,0,MW2*TILE-W);
    this.toast(msg);
  }
  crackBridge(){
    const m=this.map;m.cracked=true;
    this.sound.crackS();this.shake=10;this.glitch=8;
    this.obj2='CORRA PELO RESTO DA PONTE!';
    this.toast('A PONTE RACHOU! OS ESQUELETOS OUVIRAM!');
    for(const s of this.skels){
      s.state='alert';s.loseT=0;s.lastSeen=this.player.cx;
      s.bubbleDelay=(Math.random()*60)|0;s.bubblePool='crack';
    }
    this.sound.alertS();this.sound.setIntense(true);
  }
  startCine(){
    this.cine={active:true,t:0,hold:0};
    this.sound.tone(40,1.4,{type:'sawtooth',v:0.2,slide:25});
    this.sound.setIntense(true);
  }
  updCine(){
    const c=this.cine,m=this.map;
    c.t++;this.time++;
    if(c.t%7===0)this.shake=Math.max(this.shake,3);
    if(c.t%18===0)this.sound.tone(50,0.3,{type:'sawtooth',v:0.18,slide:35});
    const order=[10,9,11,8,12,7,13,6,14,5,15,4,16,3,17,2,18,1,19,0,20];
    if(c.t>=26&&(c.t-26)%6===0){
      const idx=order[Math.floor((c.t-26)/6)];
      if(idx!==undefined){
        const p=m.planks[idx];
        if(p&&!p.falling&&!p.gone){p.falling=true;p.vy=0;this.sound.tone(120+Math.random()*80,0.12,{v:0.08});}
      }
    }
    for(const p of m.planks){
      if(p.falling&&!p.gone){
        p.vy+=0.28;p.oy+=p.vy;
        if(p.oy>34){p.gone=true;this.bones(p.tx*10+5,176);if(Math.random()<0.5)this.sound.clackS();}
      }
    }
    for(const s of this.skels){
      if(s.falling){
        s.vy+=0.3;s.y+=s.vy;
        if(s.y>188){this.bones(s.x,176);this.sound.clackS();s.dead=true;}
        continue;
      }
      if(!m.solid(Math.floor(s.x/TILE),15)){s.falling=true;s.vy=0;continue;}
      s.dir=(740>s.x)?1:-1;
      s.x+=s.dir*1.15;s.animT+=0.15;
      if(s.bubbleT<=0&&Math.random()<0.012){s.bubbleTxt='AAAAH!';s.bubbleT=60;}
      if(s.bubbleT>0)s.bubbleT--;
    }
    this.skels=this.skels.filter(s=>!s.dead);
    const tgt=clamp(740-160,0,MW2*TILE-W);
    this.cam+=(tgt-this.cam)*0.08;
    const allGone=m.planks.every(p=>p.gone);
    if(allGone&&c.t>150)c.hold++;
    if((allGone&&c.hold>60)||c.t>460)this.endCine();
  }
  endCine(){
    this.cine.active=false;
    const m=this.map;m.bridgeDone=true;
    for(const s of this.skels){
      s.state='patrol';s.bubbleT=0;s.falling=false;
      s.x=clamp(s.x,s.minX,s.maxX);
    }
    this.sound.setIntense(false);
    this.obj2='O PORTAO ESTA ABERTO. FUJA!';
    this.toast('A PONTE DESABOU. OS ESQUELETOS FORAM DESTRUIDOS.');
    this.toast('O PORTAO DO CEMITERIO ESTA ABERTO.');
    this.sound.escapeS();
  }
  updGame2(P,dt){
    const tb=this.touchFlags();
    if(tb.j&&!this.prevJ)P.jump=true;
    if(tb.r2&&!this.prevR2)P.invis=true;
    this.prevJ=tb.j;this.prevR2=tb.r2;
    this.updAmbient(dt);
    if(this.alertSndT>0)this.alertSndT--;
    if(this.shake>0)this.shake--;
    if(this.glitch>0)this.glitch--;
    if(this.cine.active){this.updCine();return;}
    if(this.updDialog(P))return;
    if(this.introT<220)this.introT++;
    if(P.back){this.sound.back();this.toMenu();return;}
    // invisibilidade
    const iv=this.invis;
    if(iv.active>0){
      iv.active--;
      if(iv.active===0){iv.cd=900;this.sound.invisOffS();}
    }else if(iv.cd>0){
      iv.cd--;
      if(iv.cd===0)this.sound.readyS();
    }
    if(iv.denyT>0)iv.denyT--;
    if(P.invis){
      if(iv.active<=0){
        if(iv.cd>0){iv.denyT=24;this.sound.denyS();}
        else{iv.active=300;this.sound.invisOnS();this.sparkle();}
      }
    }
    const inp={
      left:this.keys.ArrowLeft||this.keys.KeyA||tb.l,
      right:this.keys.ArrowRight||this.keys.KeyD||tb.r,
      jump:this.keys.Space||this.keys.KeyW||this.keys.ArrowUp||tb.j
    };
    if(P.jump)this.player.jbuf=7;
    this.player.update(inp,dt);
    this.time++;
    // caiu no abismo
    if(this.player.y>186){this.respawn('VOCE CAIU NO ABISMO...');return;}
    // checkpoint antes da ponte
    if(!this.cp2&&this.player.x>505){
      this.cp2=true;this.checkX=512;
      this.toast('PONTO DE SEGURANCA ALCANCADO.');
    }
    const m=this.map;
    // rachadura da ponte
    if(!m.cracked&&!m.bridgeDone&&this.player.ground&&
       Math.abs(this.player.y+this.player.h-150)<2&&
       this.player.cx>660&&this.player.cx<830){
      this.crackBridge();
    }
    // cena da ponte
    if(m.cracked&&!m.bridgeDone&&!this.cine.active&&this.player.x>852&&this.player.ground){
      this.startCine();return;
    }
    // portão final
    const gate=m.gate;
    if(m.bridgeDone&&!gate.opening&&gate.open<1&&this.player.x>1100){
      gate.opening=true;this.sound.openS();this.shake=8;
      this.toast('O PORTAO DO CEMITERIO SE ABRE...');
    }
    if(gate.opening&&gate.open<1){
      gate.open+=1/90;
      if(gate.open>=1){gate.open=1;gate.opening=false;}
    }
    if(this.player.x>1208){
      this.finalTime=this.time;this.escTarget='end';
      this.state='escapeAnim';this.escT=0;
      this.sound.escapeS();this.sound.setIntense(false);
      return;
    }
    this.updSkeletons();
    const tgt=clamp(this.player.cx-160+this.player.face*24,0,MW2*TILE-W);
    this.cam+=(tgt-this.cam)*0.1;
  }
  /* ---------- draw ---------- */
  draw(){
    switch(this.state){
      case 'intro':this.drawIntro();break;
      case 'menu':this.menu.draw(this.t);break;
      case 'settings':this.menu.drawSettings(this.t);break;
      case 'director':this.menu.drawDirector(this.t);break;
      case 'game':case 'escapeAnim':
        if(this.level===2)this.drawGame2();else this.drawGame1();
        break;
      case 'escaped':this.drawEscaped();break;
    }
  }
  drawIntro(){
    const it=this.intro;
    ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);
    if(it.phase===1){
      const tt=it.t;
      const on=(tt<42)||(tt>66&&tt<108);
      if(on)drawText('KLIPZASTUDIO APRESENTA',W/2,86,2,'#FFFFFF','center');
    }else if(it.phase>=2){
      const jx=((this.t%120)<3)?(Math.random()<0.5?1:-1):0;
      drawTextSh('OTHER SIDE',37+jx,44,5,'#FFFFFF');
      it.drips.draw('#FFFFFF',2);
      const bx=90,by=118,bw=140;
      ctx.fillStyle='#555555';
      ctx.fillRect(bx-2,by-2,bw+4,1);ctx.fillRect(bx-2,by+9,bw+4,1);
      ctx.fillRect(bx-2,by-2,1,12);ctx.fillRect(bx+bw+1,by-2,1,12);
      const fill=Math.floor(bw*it.load/100);
      for(let x=0;x<fill;x+=6){
        ctx.fillStyle=(x%12===0)?'#FFFFFF':'#AAAAAA';
        ctx.fillRect(bx+x,by,5,8);
      }
      if(((this.t>>4)%2)===0)drawText('CARREGANDO',W/2,134,1,'#AAAAAA','center');
      if(it.eyes.on){
        ctx.fillStyle='#FFFFFF';
        ctx.fillRect(it.eyes.x,it.eyes.y,1,1);ctx.fillRect(it.eyes.x+3,it.eyes.y,1,1);
      }
      if(((this.t>>4)%2)===0)drawText('TOQUE PARA PULAR',W/2,164,1,'#555555','center');
    }
  }
  whiteout(){
    if(this.state!=='escapeAnim')return;
    const dens=Math.min(1,this.escT/48);
    ctx.fillStyle='#FFFFFF';
    for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2)if(Math.random()<dens)ctx.fillRect(x,y,2,2);
  }
  drawToast(){
    if(!this.toastCur)return;
    const lines=this.toastLines.length?this.toastLines:[this.toastCur];
    let wMax=0;for(const l of lines)wMax=Math.max(wMax,textW(l,2));
    const bw=wMax+18,bh=lines.length*13+12;
    const bx=Math.round((W-bw)/2),by=112-bh;
    ctx.fillStyle='#000000';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#FFFFFF';
    ctx.fillRect(bx,by,bw,1);ctx.fillRect(bx,by+bh-1,bw,1);
    ctx.fillRect(bx,by,1,bh);ctx.fillRect(bx+bw-1,by,1,bh);
    ctx.fillStyle='#555555';
    ctx.fillRect(bx+2,by+2,bw-4,1);ctx.fillRect(bx+2,by+bh-3,bw-4,1);
    for(let i=0;i<lines.length;i++)drawText(lines[i],W/2,by+8+i*13,2,'#FFFFFF','center');
    if(((this.t>>4)%2)===0)
      drawText(this.isTouch?'TOQUE PARA CONTINUAR':'APERTE QUALQUER TECLA',W/2,by+bh+4,1,'#AAAAAA','center');
  }
  drawDialog(){
    const d=this.dialog;if(!d.active)return;
    const pl=d.pages[d.page];if(!pl)return;
    ctx.fillStyle='#000000';ctx.fillRect(12,44,296,54);
    ctx.fillStyle='#AAAAAA';
    ctx.fillRect(12,44,296,1);ctx.fillRect(12,97,296,1);
    ctx.fillRect(12,44,1,54);ctx.fillRect(307,44,1,54);
    let left=Math.floor(d.n);
    for(let i=0;i<pl.length;i++){
      const take=Math.max(0,Math.min(pl[i].length,left));
      if(take>0)drawText(pl[i].substring(0,take),20,52+i*14,2,'#FFFFFF');
      left-=pl[i].length;
    }
    const total=pl.reduce((a,l)=>a+l.length,0);
    if(d.n>=total&&((this.t>>3)%2)===0)drawText('E: OK',298,86,1,'#AAAAAA','right');
    if(d.pages.length>1)drawText((d.page+1)+'/'+d.pages.length,298,48,1,'#555555','right');
  }
  drawLevelIntro(){
    const tt=this.introT,dens=Math.max(0,1-tt/120);
    ctx.fillStyle='#000000';
    if(dens>0){
      for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2)if(hash(x,y)%100<dens*100)ctx.fillRect(x,y,2,2);
    }
    if(tt>40){
      if(this.level===2){
        drawTextSh('CEMITERIO DO SUBMUNDO',W/2,52,2,'#FFFFFF','center');
        drawText('SETOR EXTERNO - NEVOA ETERNA',W/2,70,1,'#AAAAAA','center');
        drawText('ESCONDA-SE DOS ESQUELETOS. CHEGUE AO PORTAO.',W/2,84,1,'#AAAAAA','center');
        drawText(this.isTouch?'BOTOES NA TELA - R: INVISIVEL':'MOVER: SETAS/AD - PULAR: W/ESPACO - R: INVISIVEL',W/2,100,1,'#555555','center');
      }else{
        drawTextSh('LABORATORIO 7',W/2,52,2,'#FFFFFF','center');
        drawText('SUBSOLO 3 - SETOR DE CONTENCAO',W/2,70,1,'#AAAAAA','center');
        drawTextSh('ENCONTRE A CHAVE.',W/2,84,2,'#FFFFFF','center');
        drawTextSh('ABRA O PORTAO. FUJA.',W/2,98,2,'#FFFFFF','center');
        drawText(this.isTouch?'USE OS BOTOES NA TELA':'SETAS/AD: MOVER   W/ESPACO: PULAR   E: INTERAGIR',W/2,114,1,'#555555','center');
      }
    }
  }
  drawTouch(){
    const t=this.t,f=this.touchFlags();
    const B=this.btns;
    const box=(b,pr)=>{
      ctx.fillStyle=pr?'#AAAAAA':'#000000';ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle=pr?'#000000':'#AAAAAA';
      ctx.fillRect(b.x,b.y,b.w,1);ctx.fillRect(b.x,b.y+b.h-1,b.w,1);
      ctx.fillRect(b.x,b.y,1,b.h);ctx.fillRect(b.x+b.w-1,b.y,1,b.h);
    };
    const arrow=(x,y,dir,col)=>{
      ctx.fillStyle=col;
      for(let r=0;r<9;r++){
        const wd=9-Math.abs(4-r);
        if(dir<0)ctx.fillRect(x+Math.abs(4-r),y+r,wd,1);
        else ctx.fillRect(x,y+r,wd,1);
      }
    };
    const triUp=(x,y,col)=>{
      ctx.fillStyle=col;
      for(let r=0;r<9;r++){
        const wd=Math.max(1,Math.round((r/8)*11));
        ctx.fillRect(x+Math.floor((11-wd)/2),y+r,wd,1);
      }
    };
    box(B.l,f.l);arrow(B.l.x+15,B.l.y+13,-1,f.l?'#000000':'#FFFFFF');
    box(B.r,f.r);arrow(B.r.x+16,B.r.y+13,1,f.r?'#000000':'#FFFFFF');
    box(B.a,f.a);drawText('E',B.a.x+B.a.w/2,B.a.y+14,2,f.a?'#000000':'#FFFFFF','center');
    box(B.j,f.j);triUp(B.j.x+16,B.j.y+12,f.j?'#000000':'#FFFFFF');
    if(this.level===2){
      box(B.r2,f.r2);drawText('R',B.r2.x+B.r2.w/2,B.r2.y+13,2,f.r2?'#000000':'#FFFFFF','center');
    }
    ctx.fillStyle='#555555';ctx.fillRect(292,2,26,12);
    ctx.fillStyle='#000000';ctx.fillRect(293,3,24,10);
    drawText('MENU',296,5,1,'#AAAAAA');
  }
  glitchFx(){
    if(this.glitch>0){
      for(let i=0;i<3;i++){
        const gy=(Math.random()*168)|0,gh=2+((Math.random()*6)|0),off=((Math.random()*12)|0)-6;
        try{ctx.drawImage(canvas,0,gy*RK,W*RK,gh*RK,off,gy,W,gh);}catch(e){}
      }
    }
  }
  /* ---------- FASE 1 draw ---------- */
  drawGame1(){
    const t=this.t;
    ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);
    let shx=0,shy=0;
    if(this.shake>0){shx=(Math.random()-0.5)*this.shake*0.8;shy=(Math.random()-0.5)*this.shake*0.8;}
    ctx.save();
    ctx.translate(Math.round(-this.cam+shx),Math.round(shy));
    this.map.draw(this.cam,t);
    this.player.draw();
    if(this.app.on)this.drawApp();
    for(const p of this.parts){ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
    this.drawLamps();
    ctx.restore();
    for(const dd of this.dust){
      ctx.fillStyle='#AAAAAA';ctx.fillRect(Math.round(dd.x),Math.round(dd.y),1,1);
    }
    ctx.drawImage(this.vig,0,0);
    if(this.bo.on&&!((t%7)===0)){
      const px=clamp(this.player.cx-this.cam,0,W),py=clamp(this.player.cy,0,H),r=26;
      ctx.fillStyle='#000000';
      ctx.fillRect(0,0,W,Math.max(0,py-r));
      ctx.fillRect(0,py+r,W,H-(py+r));
      ctx.fillRect(0,py-r,Math.max(0,px-r),r*2);
      ctx.fillRect(px+r,py-r,W-(px+r),r*2);
    }
    if(this.prompt&&!this.dialog.active){
      const bx=clamp(this.prompt.x-this.cam,10,W-14),by=this.prompt.kind==='door'?96:Math.max(14,this.prompt.y-26);
      ctx.fillStyle='#000000';ctx.fillRect(bx-5,by-6,14,13);
      ctx.fillStyle='#AAAAAA';
      ctx.fillRect(bx-5,by-6,14,1);ctx.fillRect(bx-5,by+6,14,1);ctx.fillRect(bx-5,by-6,1,13);ctx.fillRect(bx+8,by-6,1,13);
      drawText('E',bx,by-3+((t>>4)%2),1,'#FFFFFF');
    }
    const obj=this.hasKey?'ABRA O PORTAO E FUJA!':'ENCONTRE A CHAVE';
    drawTextSh(obj,W/2,3,2,(this.hasKey&&((t>>4)%2)===0)?'#FFFFFF':'#AAAAAA','center');
    if(this.hasKey){
      ctx.fillStyle='#FFFFFF';
      ctx.fillRect(4,16,4,4);ctx.fillStyle='#000000';ctx.fillRect(5,17,2,2);
      ctx.fillStyle='#FFFFFF';ctx.fillRect(8,17,4,2);ctx.fillRect(10,19,1,2);
    }
    this.drawDialog();
    this.drawToast();
    if(this.introT<200)this.drawLevelIntro();
    ctx.drawImage(this.vig,0,0);
    this.glitchFx();
    this.whiteout();
    if(this.isTouch&&!this.dialog.active)this.drawTouch();
  }
  drawApp(){
    const a=this.app,jx=(Math.random()<0.5)?0:1;
    const x=Math.round(a.x)+jx,y=140;
    ctx.fillStyle='#FFFFFF';
    for(let yy=0;yy<30;yy++){
      const w2=yy<7?(yy<2?2:4):(6+((yy%7<3)?1:0));
      for(let xx=-Math.floor(w2/2);xx<=Math.floor(w2/2);xx++){
        if(((xx+yy)&1)===0)ctx.fillRect(x+xx,y+yy,1,1);
      }
    }
    ctx.fillStyle='#000000';
    ctx.fillRect(x-1,y+3,1,2);ctx.fillRect(x+1,y+3,1,2);
  }
  drawLamps(){
    const t=this.t;
    for(const L of this.map.lamps){
      const sx=L.tx*10+5;
      if(sx<this.cam-30||sx>this.cam+W+30)continue;
      ctx.fillStyle='#555555';ctx.fillRect(sx-2,10,4,3);
      let lit=false;
      if(L.dead)lit=false;
      else if(L.broken)lit=this.flick.on>0&&Math.random()<0.7;
      else lit=!this.bo.on;
      ctx.fillStyle=lit?'#FFFFFF':'#555555';
      ctx.fillRect(sx-1,13,2,2);
      if(lit){
        ctx.fillStyle='#FFFFFF';
        for(let i=0;i<15;i++){
          const dy=5+Math.random()*44,spread=2+dy*0.5;
          ctx.fillRect(sx+(Math.random()-0.5)*spread,15+dy,1,1);
        }
        for(let i=0;i<4;i++)ctx.fillRect(sx-10+Math.random()*20,168+Math.random()*2,1,1);
      }
    }
  }
  /* ---------- FASE 2 draw ---------- */
  drawGame2(){
    const t=this.t,m=this.map;
    ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);
    // estrelas
    for(let i=0;i<46;i++){
      const sxr=((hash(i,11)%640)-this.cam*0.25)%W;
      const sx=((sxr%W)+W)%W;
      const sy=(hash(i,29)%72)+2;
      if(((t+i*13)%140)<10)continue;
      ctx.fillStyle=(i%4===0)?'#AAAAAA':'#FFFFFF';
      ctx.fillRect(sx|0,sy,1,1);
    }
    // lua
    const mx=Math.round(252-this.cam*0.05);
    ctx.fillStyle='#FFFFFF';
    for(let yy=-11;yy<=11;yy++){
      const ww=Math.floor(Math.sqrt(121-yy*yy));
      ctx.fillRect(mx-ww,26+yy,ww*2,1);
    }
    ctx.fillStyle='#AAAAAA';
    ctx.fillRect(mx-4,22,3,2);ctx.fillRect(mx+3,29,2,3);ctx.fillRect(mx-1,33,2,2);
    // colinas distantes
    for(let x=0;x<W;x+=2){
      const wx=x+this.cam*0.4;
      const h2=Math.floor(7+5*Math.sin(wx*0.017)+3*Math.sin(wx*0.009+2));
      ctx.fillStyle='#555555';ctx.fillRect(x,112-h2,2,1);
    }
    let shx=0,shy=0;
    if(this.shake>0){shx=(Math.random()-0.5)*this.shake*0.8;shy=(Math.random()-0.5)*this.shake*0.8;}
    ctx.save();
    ctx.translate(Math.round(-this.cam+shx),Math.round(shy));
    m.draw(this.cam,t);
    for(const s of this.skels)this.drawSkel(s);
    for(const s of this.skels)this.drawBubble(s);
    // jogador (com invisibilidade)
    if(this.invis.active>0){
      const p=this.player;
      ctx.globalAlpha=0.16;this.player.draw();ctx.globalAlpha=1;
      ctx.fillStyle='#FFFFFF';
      for(let i=0;i<3;i++){
        ctx.fillRect(Math.round(p.x-3+Math.random()*16),Math.round(p.y-2+Math.random()*16),1,1);
      }
    }else this.player.draw();
    for(const p of this.parts){ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
    ctx.restore();
    // névoa
    for(let i=0;i<10;i++){
      const fx=((i*67+t*(0.2+(i%3)*0.1))%(W+60))-30;
      const fy=132+(i%4)*5;
      ctx.fillStyle='#555555';ctx.fillRect(fx|0,fy,22,1);
      if(i%2)ctx.fillRect((fx+6)|0,fy+1,14,1);
    }
    for(const dd of this.dust){
      ctx.fillStyle='#AAAAAA';ctx.fillRect(Math.round(dd.x),Math.round(dd.y),1,1);
    }
    ctx.drawImage(this.vig,0,0);
    // HUD
    const blink=m.gate.open>=1&&((t>>4)%2)===0;
    drawTextSh(this.obj2,W/2,3,2,blink?'#FFFFFF':'#AAAAAA','center');
    this.drawInvisHUD();
    this.drawDialog();
    this.drawToast();
    if(this.introT<200)this.drawLevelIntro();
    this.glitchFx();
    // cena cinematográfica da ponte
    if(this.cine.active)this.drawCine();
    this.whiteout();
    if(this.isTouch&&!this.dialog.active&&!this.cine.active)this.drawTouch();
  }
  drawSkel(s){
    const red=s.state!=='patrol';
    let img;
    if(s.falling)img=red?this.skel.rf:this.skel.wf;
    else img=(Math.floor(s.animT)%2===0)?(red?this.skel.r1:this.skel.w1):(red?this.skel.r2:this.skel.w2);
    const x=Math.round(s.x-6),y=Math.round(s.y-16);
    if(s.dir<0){ctx.save();ctx.translate(x+12,y);ctx.scale(-1,1);ctx.drawImage(img,0,0);ctx.restore();}
    else ctx.drawImage(img,x,y);
  }
  drawBubble(s){
    if(s.bubbleT<=0||!s.bubbleTxt)return;
    const txt=s.bubbleTxt,w=textW(txt,1)+8;
    const bx=clamp(Math.round(s.x-w/2),Math.round(this.cam)+2,Math.round(this.cam)+W-w-2);
    const by=Math.round(s.y)-32;
    ctx.fillStyle='#000000';ctx.fillRect(bx,by,w,12);
    ctx.fillStyle='#FFFFFF';
    ctx.fillRect(bx,by,w,1);ctx.fillRect(bx,by+11,w,1);
    ctx.fillRect(bx,by,1,12);ctx.fillRect(bx+w-1,by,1,12);
    ctx.fillRect(clamp(Math.round(s.x),bx+3,bx+w-4),by+12,1,2);
    drawText(txt,bx+4,by+4,1,'#FFFFFF');
  }
  drawInvisHUD(){
    const iv=this.invis,t=this.t;
    const ready=iv.cd<=0&&iv.active<=0;
    ctx.fillStyle='#000000';ctx.fillRect(4,14,66,12);
    ctx.fillStyle=(iv.denyT>0&&((t>>2)%2))?'#FFFFFF':(ready&&((t>>4)%2)?'#FFFFFF':'#555555');
    ctx.fillRect(4,14,66,1);ctx.fillRect(4,25,66,1);
    ctx.fillRect(4,14,1,12);ctx.fillRect(69,14,1,12);
    drawText('R',9,18,1,ready?'#FFFFFF':'#555555');
    const bx=18,bw=46,by=17,bh=6;
    ctx.fillStyle='#555555';
    ctx.fillRect(bx,by,bw,1);ctx.fillRect(bx,by+bh-1,bw,1);
    ctx.fillRect(bx,by,1,bh);ctx.fillRect(bx+bw-1,by,1,bh);
    let fill=0,col='#555555';
    if(iv.active>0){fill=iv.active/300;col='#FFFFFF';}
    else{fill=1-iv.cd/900;col=ready?'#FFFFFF':'#AAAAAA';}
    ctx.fillStyle=col;
    ctx.fillRect(bx+1,by+1,Math.floor((bw-2)*clamp(fill,0,1)),bh-2);
  }
  drawCine(){
    const c=this.cine;
    const allGone=this.map.planks.every(p=>p.gone);
    let bh=Math.min(20,Math.floor(c.t*1.5));
    if(allGone)bh=Math.max(0,Math.min(bh,20-Math.floor((c.hold||0)*0.4)));
    if(bh>0){
      ctx.fillStyle='#000000';
      ctx.fillRect(0,0,W,bh);ctx.fillRect(0,H-bh,W,bh);
    }
    if(c.t>30&&c.t<110)
      drawTextSh('A PONTE ESTA DESABANDO!',W/2,H-bh+5,2,'#FFFFFF','center');
    if(c.t>120&&c.t<210)
      drawTextSh('OS ESQUELETOS CAEM NO ABISMO.',W/2,H-bh+5,2,'#FFFFFF','center');
  }
  drawEscaped(){
    const t=this.t;
    ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);
    drawText('YOU ESCAPED',79,44,3,'#000000');
    if(this.escDrips)this.escDrips.draw('#000000',2);
    const gy=96+Math.sin(t*0.06)*2;
    ctx.drawImage(this.ghost.sil,144,gy,32,32);
    drawText('TEMPO '+this.fmt(this.finalTime),W/2,130,1,'#000000','center');
    drawText('O LABORATORIO E O CEMITERIO FICARAM PARA TRAS.',W/2,142,1,'#555555','center');
    if(t%400>150)drawText('MAS ALGO SAIU COM VOCE...',W/2,154,1,'#000000','center');
    if(((t>>4)%2)===0)drawText(this.isTouch?'TOQUE: MENU':'ENTER: MENU',W/2,166,1,'#000000','center');
  }
  fmt(frames){
    const s=Math.floor(frames/60),m=Math.floor(s/60);
    return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }
  /* ---------- loop ---------- */
  start(){
    this.last=performance.now();
    const loop=ts=>{
      requestAnimationFrame(loop);
      let dt=ts-this.last;this.last=ts;
      if(dt>200)dt=200;
      this.acc+=dt;
      let n=0;
      while(this.acc>=16.6667&&n<5){this.stepF(16.6667);this.acc-=16.6667;n++;}
      this.draw();
    };
    requestAnimationFrame(loop);
  }
}

let game;
game=new Game();
game.start();
</script>
