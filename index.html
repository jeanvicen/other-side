<script>
"use strict";
const W=320,H=180,TILE=10,MW=88,MH=18,MW2=128;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let RK=1;

function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  const cssW=Math.max(1,Math.floor(W*s)),cssH=Math.max(1,Math.floor(H*s));
  RK=Math.max(1,Math.min(4,Math.ceil(s*(window.devicePixelRatio||1))));
  canvas.width=W*RK;canvas.height=H*RK;
  ctx.setTransform(RK,0,0,RK,0,0);
  ctx.imageSmoothingEnabled=false;
  canvas.style.width=cssW+'px';
  canvas.style.height=cssH+'px';
}
addEventListener('resize',fit);
document.addEventListener('fullscreenchange',fit);
fit();

function hash(x,y){let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);n=Math.imul(n^(n>>>13),1274126177);return(n^(n>>>16))>>>0;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function wrapText(str,max){
  const words=String(str).split(' '),out=[];let cur='';
  for(let w of words){
    const t=cur?cur+' '+w:w;
    if(t.length<=max)cur=t;
    else{
      if(cur)out.push(cur);
      if(w.length>max){while(w.length>max){out.push(w.slice(0,max));w=w.slice(max);}cur=w;}
      else cur=w;
    }
  }
  out.push(cur);return out;
}

const FONT={
'A':["0110","1001","1111","1001","1001"],'B':["1110","1001","1110","1001","1110"],
'C':["0111","1000","1000","1000","0111"],'D':["1110","1001","1001","1001","1110"],
'E':["1111","1000","1110","1000","1111"],'F':["1111","1000","1110","1000","1000"],
'G':["0111","1000","1011","1001","0111"],'H':["1001","1001","1111","1001","1001"],
'I':["1110","0100","0100","0100","1110"],'J':["0111","0010","0010","1010","0100"],
'K':["1001","1010","1100","1010","1001"],'L':["1000","1000","1000","1000","1111"],
'M':["1001","1111","1111","1001","1001"],'N':["1001","1101","1011","1001","1001"],
'O':["0110","1001","1001","1001","0110"],'P':["1110","1001","1110","1000","1000"],
'Q':["0110","1001","1001","1010","0101"],'R':["1110","1001","1110","1010","1001"],
'S':["0111","1000","0110","0001","1110"],'T':["1111","0110","0110","0110","0110"],
'U':["1001","1001","1001","1001","0110"],'V':["1001","1001","1001","1010","0100"],
'W':["1001","1001","1111","1111","1001"],'X':["1001","1001","0110","1001","1001"],
'Y':["1010","1010","0100","0100","0100"],'Z':["1111","0001","0110","1000","1111"],
'0':["0110","1001","1001","1001","0110"],'1':["0100","1100","0100","0100","1110"],
'2':["1110","0001","0110","1000","1111"],'3':["1110","0001","0110","0001","1110"],
'4':["1001","1001","1111","0001","0001"],'5':["1111","1000","1110","0001","1110"],
'6':["0110","1000","1110","1001","0110"],'7':["1111","0001","0010","0100","0100"],
'8':["0110","1001","0110","1001","0110"],'9':["0110","1001","0111","0001","0110"],
' ':["0000","0000","0000","0000","0000"],':':["0000","0100","0000","0100","0000"],
'!':["0100","0100","0100","0000","0100"],'.':["0000","0000","0000","0000","0100"],
'-':["0000","0000","1110","0000","0000"],'>':["1000","0100","0010","0100","1000"],
'<':["0010","0100","1000","0100","0010"],'/':["0001","0010","0100","1000","0000"],
'?':["1110","0001","0110","0000","0100"],'+':["0000","0100","1110","0100","0000"]
};
function textW(s,sc){return s.length?(s.length*5-1)*sc:0;}
function drawText(s,x,y,sc,col,align,g){
  g=g||ctx;
  if(align==='center')x-=textW(s,sc)/2;else if(align==='right')x-=textW(s,sc);
  x=Math.round(x);y=Math.round(y);
  g.fillStyle=col;
  for(let i=0;i<s.length;i++){
    const gl=FONT[s[i]];if(!gl)continue;
    for(let r=0;r<5;r++){const bits=gl[r];
      for(let b=0;b<4;b++)if(bits.charCodeAt(b)===49)g.fillRect(x+i*5*sc+b*sc,y+r*sc,sc,sc);
    }
  }
}
function drawTextSh(s,x,y,sc,col,align){
  drawText(s,x+sc,y+sc,sc,'#000000',align);
  drawText(s,x,y,sc,col,align);
}
function textSources(text,sc,x,y){
  const w=textW(text,sc),h=5*sc;
  const oc=document.createElement('canvas');oc.width=w;oc.height=h;
  const o=oc.getContext('2d');
  drawText(text,0,0,sc,'#FFFFFF','left',o);
  const d=o.getImageData(0,0,w,h).data,out=[];
  for(let cx=0;cx<w;cx++){
    for(let cy=h-1;cy>=0;cy--){
      if(d[(cy*w+cx)*4+3]>0){if(Math.random()<0.16)out.push({x:x+cx,y:y+cy+1});break;}
    }
  }
  return out;
}

class ParticleSystem{
  constructor(){this.particles=[];this.maxParticles=400;}
  add(p){if(this.particles.length<this.maxParticles)this.particles.push(p);}
  puff(x,y,n,col){
    for(let i=0;i<n;i++){
      const angle=Math.random()*Math.PI*2;
      const speed=0.5+Math.random()*2;
      this.add({
        x:x,y:y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed-(0.5+Math.random()*2),
        life:20+Math.random()*25,maxLife:45,
        size:1+Math.random()*2,
        col:col||'#AAAAAA',
        gravity:0.04,
        type:'puff'
      });
    }
  }
  burst(x,y,n,col){
    for(let i=0;i<n;i++){
      const angle=Math.random()*Math.PI*2;
      const speed=1+Math.random()*3;
      this.add({
        x:x,y:y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed-(1+Math.random()*2),
        life:25+Math.random()*30,maxLife:55,
        size:1+Math.random()*2,
        col:col||(Math.random()<0.5?'#FFFFFF':'#AAAAAA'),
        gravity:0.06,
        type:'burst'
      });
    }
  }
  bones(x,y,n){
    for(let i=0;i<n;i++){
      this.add({
        x:x,y:y,
        vx:(Math.random()-0.5)*2.5,
        vy:-(1+Math.random()*3),
        life:30+Math.random()*30,maxLife:60,
        size:1+Math.random(),
        col:Math.random()<0.7?'#FFFFFF':'#AAAAAA',
        gravity:0.12,
        rotation:Math.random()*Math.PI*2,
        rotSpeed:(Math.random()-0.5)*0.2,
        type:'bone'
      });
    }
  }
  sparkle(x,y,n){
    for(let i=0;i<n;i++){
      this.add({
        x:x+(Math.random()-0.5)*16,y:y+(Math.random()-0.5)*16,
        vx:(Math.random()-0.5)*0.8,
        vy:-(0.3+Math.random()*1.2),
        life:15+Math.random()*20,maxLife:35,
        size:1+Math.random(),
        col:'#FFFFFF',
        gravity:-0.02,
        type:'sparkle',
        pulse:Math.random()*Math.PI*2
      });
    }
  }
  dust(x,y,n){
    for(let i=0;i<n;i++){
      this.add({
        x:x+(Math.random()-0.5)*10,y:y+(Math.random()-0.5)*4,
        vx:(Math.random()-0.5)*0.3,
        vy:-(0.1+Math.random()*0.4),
        life:40+Math.random()*40,maxLife:80,
        size:1,
        col:'#555555',
        gravity:-0.01,
        type:'dust'
      });
    }
  }
  blood(x,y,n){
    for(let i=0;i<n;i++){
      const angle=-Math.PI*0.8+Math.random()*Math.PI*0.6;
      this.add({
        x:x,y:y,
        vx:Math.cos(angle)*(1+Math.random()*2),
        vy:Math.sin(angle)*(1+Math.random()*2),
        life:30+Math.random()*40,maxLife:70,
        size:1+Math.random()*2,
        col:'#AA0000',
        gravity:0.15,
        type:'blood'
      });
    }
  }
  smoke(x,y,n){
    for(let i=0;i<n;i++){
      this.add({
        x:x+(Math.random()-0.5)*6,y:y,
        vx:(Math.random()-0.5)*0.3,
        vy:-(0.4+Math.random()*0.6),
        life:50+Math.random()*50,maxLife:100,
        size:2+Math.random()*3,
        col:'#333333',
        gravity:-0.02,
        type:'smoke',
        alpha:0.6
      });
    }
  }
  update(){
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];
      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=p.gravity||0;
      p.life--;
      if(p.rotation!==undefined)p.rotation+=p.rotSpeed||0;
      if(p.pulse!==undefined)p.pulse+=0.2;
      if(p.type==='smoke')p.alpha*=0.97;
      if(p.life<=0)this.particles.splice(i,1);
    }
  }
  draw(cam){
    for(const p of this.particles){
      const alpha=clamp(p.life/p.maxLife,0,1);
      const sx=Math.round(p.x-cam);
      const sy=Math.round(p.y);
      if(sx<-10||sx>W+10)continue;
      ctx.globalAlpha=alpha*(p.alpha||1);
      ctx.fillStyle=p.col;
      const sz=Math.ceil(p.size*alpha);
      if(p.type==='sparkle'){
        const pulse=0.5+0.5*Math.sin(p.pulse||0);
        ctx.globalAlpha=alpha*pulse;
        ctx.fillRect(sx,sy,sz,sz);
        if(sz>1){ctx.fillRect(sx-1,sy+Math.floor(sz/2),1,1);ctx.fillRect(sx+sz,sy+Math.floor(sz/2),1,1);}
      }else if(p.type==='bone'&&p.rotation!==undefined){
        ctx.save();ctx.translate(sx,sy);ctx.rotate(p.rotation);
        ctx.fillRect(-sz/2,-1,sz,2);ctx.restore();
      }else{
        ctx.fillRect(sx,sy,sz,sz);
      }
    }
    ctx.globalAlpha=1;
  }
}

class Sound{
  constructor(){this.ctx=null;this.ok=false;this.musicOn=true;this.intense=false;this.step=0;this.nextT=0;this.drone=null;this.ambT=0;this.tryLoad();}
  tryLoad(){try{const v=localStorage.getItem('os_music');if(v!==null)this.musicOn=v==='1';}catch(e){}}
  unlock(){
    if(this.ok){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return;}
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    try{this.ctx=new A();}catch(e){return;}
    const c=this.ctx;
    this.master=c.createGain();this.master.gain.value=0.7;this.master.connect(c.destination);
    this.mus=c.createGain();this.mus.gain.value=this.musicOn?1:0;this.mus.connect(this.master);
    this.sfxG=c.createGain();this.sfxG.gain.value=0.9;this.sfxG.connect(this.master);
    this.ambG=c.createGain();this.ambG.gain.value=0.4;this.ambG.connect(this.master);
    this.ok=true;this.startDrone();this.nextT=c.currentTime+0.15;
  }
  startDrone(){
    if(!this.ok||this.drone)return;const c=this.ctx;
    // ROCK + TERROR: Power chords distorcidos
    const o1=c.createOscillator();o1.type='sawtooth';o1.frequency.value=82.41; // E2
    const o2=c.createOscillator();o2.type='square';o2.frequency.value=82.41;
    const o3=c.createOscillator();o3.type='sawtooth';o3.frequency.value=110; // A2
    
    const dist=c.createWaveShaper();
    const curve=new Float32Array(256);
    for(let i=0;i<256;i++){const x=i*2/256-1;curve[i]=x*Math.abs(x);}
    dist.curve=curve;
    
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=800;f.Q.value=2;
    const g=c.createGain();g.gain.value=0;
    
    o1.connect(dist);o2.connect(dist);o3.connect(dist);
    dist.connect(f);f.connect(g);g.connect(this.mus);
    
    const lfo=c.createOscillator();lfo.frequency.value=0.1;
    const lg=c.createGain();lg.gain.value=100;lfo.connect(lg);lg.connect(f.frequency);
    
    o1.start();o2.start();o3.start();lfo.start();
    g.gain.setTargetAtTime(0.18,c.currentTime,1.5);
    this.drone={g:g,tens:null,tensG:null,amb:null,dist:dist};
  }
  setIntense(v){
    if(this.intense===v)return;this.intense=v;if(!this.ok)return;
    const c=this.ctx,d=this.drone;if(!d)return;
    if(v&&!d.tens){
      // Riff mais agressivo
      const o=c.createOscillator();o.type='sawtooth';o.frequency.value=110;
      const o2=c.createOscillator();o2.type='square';o2.frequency.value=164.81; // E3
      const dist2=c.createWaveShaper();
      const curve=new Float32Array(256);
      for(let i=0;i<256;i++){const x=i*2/256-1;curve[i]=Math.tanh(x*3);}
      dist2.curve=curve;
      const g2=c.createGain();g2.gain.value=0;g2.gain.setTargetAtTime(0.12,c.currentTime,2);
      o.connect(dist2);o2.connect(dist2);dist2.connect(g2);g2.connect(this.mus);
      o.start();o2.start();
      d.tens=[o,o2];d.tensG=g2;
    }
    if(!v&&d.tens){
      d.tensG.gain.setTargetAtTime(0,c.currentTime,1);
      const oo=d.tens;setTimeout(()=>{try{oo.forEach(o=>o.stop());}catch(e){}},3000);d.tens=null;
    }
  }
  setMusic(v){
    this.musicOn=v;
    try{localStorage.setItem('os_music',v?'1':'0');}catch(e){}
    if(this.ok){this.mus.gain.setTargetAtTime(v?1:0,this.ctx.currentTime,0.15);
      if(v)this.nextT=Math.max(this.nextT,this.ctx.currentTime+0.1);}
  }
  tick(){
    if(!this.ok||!this.musicOn)return;
    const c=this.ctx;if(c.state!=='running')return;
    const sd=this.intense?0.35:0.48; // Mais rápido = rock
    if(this.nextT<c.currentTime-0.5)this.nextT=c.currentTime+0.1;
    while(this.nextT<c.currentTime+0.7){
      this.schedStep(this.step,this.nextT);
      this.step=(this.step+1)%32;this.nextT+=sd;
    }
    this.ambT--;
    if(this.ambT<=0){
      this.ambT=120+Math.random()*240;
      if(Math.random()<0.3)this.ambientCreak();
      if(Math.random()<0.15)this.ambientWhisper();
    }
  }
  schedStep(s,t){
    // Bateria rock
    if(s%8===0){this.kick(t);this.kick(t+0.3);}
    if(s%4===2)this.snare(t);
    if(s%2===1)this.hihat(t);
    
    if(this.intense&&s%8===4)this.kick(t+0.1);
    
    // Riffs de guitarra
    if(Math.random()<(this.intense?0.5:0.28)){
      const sc=[82.41,110,123.47,146.83,164.81,220]; // E minor pentatonic
      const f=sc[(Math.random()*sc.length)|0]*(Math.random()<0.3?2:1);
      this.guitar(f,t);
    }
    if(s===20&&Math.random()<(this.intense?0.6:0.25))this.sting(t);
    
    // Melodia sombria
    if(s%16===8&&Math.random()<0.4){
      const mel=[164.81,196,220,261.63];
      this.guitar(mel[(Math.random()*mel.length)|0],t);
    }
  }
  kick(t){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(100,t);o.frequency.exponentialRampToValueAtTime(40,t+0.15);
    g.gain.setValueAtTime(0.6,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    o.connect(g);g.connect(this.mus);o.start(t);o.stop(t+0.4);
  }
  snare(t){
    const c=this.ctx;
    const bufSize=c.sampleRate*0.15;
    const buf=c.createBuffer(1,bufSize,c.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/bufSize*8);
    const src=c.createBufferSource();src.buffer=buf;
    const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=2000;
    const g=c.createGain();g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    src.connect(f);f.connect(g);g.connect(this.mus);src.start(t);src.stop(t+0.2);
  }
  hihat(t){
    const c=this.ctx;
    const bufSize=c.sampleRate*0.05;
    const buf=c.createBuffer(1,bufSize,c.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/bufSize*12);
    const src=c.createBufferSource();src.buffer=buf;
    const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=8000;
    const g=c.createGain();g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    src.connect(f);f.connect(g);g.connect(this.mus);src.start(t);src.stop(t+0.06);
  }
  guitar(f,t){
    const c=this.ctx,o=c.createOscillator(),o2=c.createOscillator(),fl=c.createBiquadFilter(),g=c.createGain();
    o.type='sawtooth';o.frequency.value=f;
    o2.type='square';o2.frequency.value=f*1.01;
    const dist=c.createWaveShaper();
    const curve=new Float32Array(256);
    for(let i=0;i<256;i++){const x=i*2/256-1;curve[i]=Math.tanh(x*4);}
    dist.curve=curve;
    fl.type='lowpass';fl.frequency.value=1200;fl.Q.value=3;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.08,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+(this.intense?0.6:1.2));
    o.connect(dist);o2.connect(dist);dist.connect(fl);fl.connect(g);g.connect(this.mus);
    o.start(t);o2.start(t);o.stop(t+1.5);o2.stop(t+1.5);
  }
  sting(t){
    const c=this.ctx;[220,233.08,466.16].forEach(f=>{
      const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.03,t+0.5);
      g.gain.exponentialRampToValueAtTime(0.001,t+2.2);
      o.connect(g);g.connect(this.mus);o.start(t);o.stop(t+2.4);
    });
  }
  tone(f,d,o){
    if(!this.ok)return;o=o||{};
    const c=this.ctx,t=c.currentTime+(o.at||0);
    const os=c.createOscillator(),g=c.createGain();
    os.type=o.type||'square';os.frequency.setValueAtTime(f,t);
    if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t+d);
    g.gain.setValueAtTime(o.v||0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    os.connect(g);g.connect(this.sfxG);os.start(t);os.stop(t+d+0.02);
  }
  ambientCreak(){
    if(!this.ok)return;
    const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
    o.type='sawtooth';o.frequency.setValueAtTime(180+Math.random()*60,t);
    o.frequency.linearRampToValueAtTime(120+Math.random()*40,t+0.8);
    f.type='bandpass';f.frequency.value=800;f.Q.value=8;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.03,t+0.1);
    g.gain.exponentialRampToValueAtTime(0.001,t+1.2);
    o.connect(f);f.connect(g);g.connect(this.ambG);o.start(t);o.stop(t+1.3);
  }
  ambientWhisper(){
    if(!this.ok)return;
    const c=this.ctx,t=c.currentTime;
    const bufSize=c.sampleRate*0.8;
    const buf=c.createBuffer(1,bufSize,c.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*0.3;
    const src=c.createBufferSource();src.buffer=buf;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=2000+Math.random()*1000;f.Q.value=12;
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.04,t+0.1);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.7);
    src.connect(f);f.connect(g);g.connect(this.ambG);src.start(t);src.stop(t+0.8);
  }
  click(){this.tone(900,0.05,{v:0.07});this.tone(620,0.06,{v:0.05,at:0.02});}
  confirm(){this.tone(520,0.08,{v:0.1});this.tone(784,0.11,{v:0.1,at:0.07});}
  back(){this.tone(400,0.07,{v:0.09});this.tone(250,0.09,{v:0.09,at:0.06});}
  jumpS(){this.tone(170,0.14,{slide:330,v:0.09});}
  landS(){this.tone(95,0.06,{type:'triangle',v:0.08});}

class Ghost{
  constructor(){
    this.pal={'1':'#FFFFFF','2':'#AAAAAA','3':'#555555','4':'#000000'};
    this.base=[
      "0000000000000000","0000011111100000","0001111111111000","0011111111111100",
      "0111111111111110","0111111111111110","0111111111111110","0111111111111110",
      "0111111111111110","0111111111111110","0111111111111110","0111111111111110",
      "0111111111111110","0111111111111110"];
    this.frames={idle:[],walk:[],jump:[],hide:[]};
    this.build();
  }
  compose(o){
    const rows=this.base.map(r=>r.split(''));
    const dx=o.dx||0,cols=[4+dx,5+dx,10+dx,11+dx];
    const put=(r,c,v)=>{if(c>=0&&c<16)rows[r][c]=v;};
    if(o.wide){[5,6,7].forEach(r=>cols.forEach(c=>put(r,c,'4')));}
    else if(o.blink){cols.forEach(c=>put(7,c,'4'));}
    else{[6,7].forEach(r=>cols.forEach(c=>put(r,c,'4')));}
    cols.forEach(c=>put(8,c,'3'));
    if(o.mouth==='o'){put(10,7,'4');put(10,8,'4');put(11,7,'4');put(11,8,'4');}
    else{put(10,7,'4');put(10,8,'4');}
    for(let r=4;r<=12;r++)put(r,13,'2');
    const out=rows.map(r=>r.join(''));
    out.push(o.tail);out.push(o.r15||"0000000000000000");
    return out;
  }
  mk(rows){
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    for(let y=0;y<16;y++){const r=rows[y];
      for(let x=0;x<16;x++){const ch=r[x];
        if(ch!=='0'){g.fillStyle=this.pal[ch];g.fillRect(x,y,1,1);}}}
    return c;
  }
  build(){
    const T1="0111011101110110",T2="0110111011101100",T3="0111011011101110",T4="0101101101101010";
    const TJ="0111111111111110",TJ2="0011001100110000",TJ3="0101010101010101";
    const TW1="0110111011101110",TW2="0101011101110101",TW3="0111011011010111";
    const m=o=>this.mk(this.compose(o));
    this.frames.idle=[
      m({tail:T1}),m({tail:T2}),m({tail:T3}),m({tail:T2}),m({tail:T4}),m({tail:T1})
    ];
    this.blinkIdle=m({tail:T1,blink:true});
    this.frames.walk=[
      m({tail:T1,dx:1}),m({tail:T2,dx:0}),m({tail:T3,dx:-1}),m({tail:T2,dx:0}),
      m({tail:T1,dx:-1}),m({tail:TW1,dx:0}),m({tail:TW2,dx:1}),m({tail:TW3,dx:0})
    ];
    this.blinkWalk=m({tail:T2,dx:1,blink:true});
    this.frames.jump=[
      m({tail:TJ,mouth:'o',wide:true}),m({tail:TJ2,mouth:'o',wide:true}),
      m({tail:TJ3,mouth:'o'}),m({tail:TJ}),m({tail:TJ2}),m({tail:T1})
    ];
    this.frames.hide=[this.mkHide(0),this.mkHide(1),this.mkHide(2)];
    const rows=this.compose({tail:T1});
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    for(let y=0;y<16;y++){const r=rows[y];
      for(let x=0;x<16;x++){const ch=r[x];
        if(ch==='1'||ch==='2'||ch==='3'){g.fillStyle='#000000';g.fillRect(x,y,1,1);}
        else if(ch==='4'){g.fillStyle='#FFFFFF';g.fillRect(x,y,1,1);}}}
    this.sil=c;
  }
  mkHide(phase){
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    g.fillStyle='#FFFFFF';
    const yOff=phase===1?-1:0;
    for(let yy=6;yy<=13;yy++){
      for(let xx=4;xx<=12;xx++){
        const dist=Math.abs(xx-8)+Math.abs(yy-9.5+yOff);
        if(dist<5)g.fillRect(xx,yy,1,1);
      }
    }
    g.fillStyle='#000000';
    g.fillRect(6,8+yOff,1,1);g.fillRect(9,8+yOff,1,1);
    return c;
  }
}

}

class Drips{
  constructor(){this.list=[];this.drops=[];}
  seed(srcs){
    this.list=[];this.drops=[];
    for(const s of srcs)if(Math.random()<0.6)
      this.list.push({x:s.x,y:s.y,len:0,max:8+Math.random()*26,sp:0.05+Math.random()*0.1,wait:(Math.random()*220)|0});
  }
  update(){
    for(const d of this.list){
      if(d.wait>0){d.wait--;continue;}
      d.len+=d.sp;
      if(d.len>=d.max){
        this.drops.push({x:d.x,y:d.y+d.len,vy:0.25+Math.random()*0.3});
        d.len=2+Math.random()*3;d.max=8+Math.random()*26;d.sp=0.04+Math.random()*0.09;
      }
    }
    for(const p of this.drops){p.vy=Math.min(p.vy+0.02,1);p.y+=p.vy;}
    this.drops=this.drops.filter(p=>p.y<184);
  }
  draw(col,w){
    ctx.fillStyle=col;
    for(const d of this.list){if(d.wait>0||d.len<=0)continue;ctx.fillRect(d.x,d.y,w,Math.ceil(d.len));}
    for(const p of this.drops)ctx.fillRect(p.x,p.y,w,w);
  }
}

    g.fillStyle='#555555';g.fillRect(d.x,py,d.w,d.h);

    }
  }
}

class Map2{
  constructor(){
    this.mw=MW2;
    this.g=new Uint8Array(MW2*MH);

    this.planks=[];

    this.closets=[];

  }
  set(x,y,v){if(x>=0&&x<MW2&&y>=0&&y<MH)this.g[y*MW2+x]=v;}
  build(){
    for(let x=0;x<MW2;x++){
      if(x>=64&&x<=84)continue;
      this.set(x,15,1);this.set(x,16,1);this.set(x,17,1);
    }
    for(let y=8;y<=17;y++){this.set(0,y,1);this.set(1,y,1);}
    for(let y=8;y<=17;y++){this.set(126,y,1);this.set(127,y,1);}
    this.crypts=[{x:18,w:2},{x:32,w:2},{x:48,w:2}];
    for(const c of this.crypts)for(let x=c.x;x<c.x+c.w;x++)for(let y=12;y<=14;y++)this.set(x,y,3);
    for(let x=118;x<=119;x++)for(let y=10;y<=14;y++)this.set(x,y,4);
    for(let x=64;x<=84;x++){this.set(x,15,5);this.planks.push({tx:x,falling:false,oy:0,vy:0,gone:false});}
    this.graves=[8,13,23,27,37,42,52,58,90,95,101,107,112];
    this.trees=[6,29,45,55,92,104,113];
    this.fences=[{x0:10,x1:16},{x0:24,x1:30},{x0:39,x1:46},{x0:51,x1:57},{x0:96,x1:103},{x0:108,x1:114}];
    // Armários espalhados
    this.closets=[
      {x:120,y:130,w:16,h:30,occupied:false},
      {x:240,y:130,w:16,h:30,occupied:false},
      {x:380,y:130,w:16,h:30,occupied:false},
      {x:500,y:130,w:16,h:30,occupied:false},
      {x:600,y:130,w:16,h:30,occupied:false},
      {x:900,y:130,w:16,h:30,occupied:false},

  solid(tx,ty){
    if(tx<0||tx>=MW2)return true;
    if(ty<0)return false;
    if(ty>=MH)return false;
    const c=this.g[ty*MW2+tx];
    if(c===4)return this.gate.open<0.85;
    if(c===5){const p=this.planks[tx-64];return !!p&&!p.falling&&!p.gone;}

  getClosetAt(px,py){
    for(const c of this.closets){

class Player{
  constructor(map,x,y){
    this.map=map;this.x=x;this.y=y;this.w=10;this.h=14;
    this.vx=0;this.vy=0;this.ground=false;this.face=1;
    this.frame=0;this.animMs=0;this.state='idle';
    this.blinkIn=1800+Math.random()*2000;this.blinking=0;
    this.coyote=0;this.jbuf=0;this.stepT=0;
    this.hiding=false;this.hideCloset=null;
    this.breathT=0;
    this.health=3;this.maxHealth=3;
    this.invulnT=0;
  }
  get cx(){return this.x+this.w/2;}
  get cy(){return this.y+this.h/2;}
  hitV(px,pyTop){
    const tx=Math.floor(px/TILE);
    const a=Math.floor(pyTop/TILE),b=Math.floor((pyTop+this.h/2)/TILE),c=Math.floor((pyTop+this.h-0.01)/TILE);
    return this.map.solid(tx,a)||this.map.solid(tx,b)||this.map.solid(tx,c);
  }
  hitH(py,pxL){
    const ty=Math.floor(py/TILE);
    const a=Math.floor(pxL/TILE),b=Math.floor((pxL+this.w/2)/TILE),c=Math.floor((pxL+this.w-0.01)/TILE);
    return this.map.solid(a,ty)||this.map.solid(b,ty)||this.map.solid(c,ty);
  }
  hideIn(closet){
    this.hiding=true;this.hideCloset=closet;closet.occupied=true;
    this.x=closet.x+closet.w/2-this.w/2;
    this.y=closet.y+closet.h-this.h-2;
    this.vx=0;this.vy=0;
  }
  unhide(){
    if(this.hideCloset){this.hideCloset.occupied=false;this.hideCloset=null;}
    this.hiding=false;
  }
  takeDamage(amount){
    if(this.invulnT>0)return false;
    this.health-=amount;
    this.invulnT=60;
    game.particles.blood(this.cx,this.cy,8);
    game.shake=10;
    game.sound.attackS();
    if(this.health<=0){
      return true;
    }
    return false;
  }
  update(inp,dt){
    if(this.invulnT>0)this.invulnT--;
    if(this.hiding)return;
    const target=(inp.right?1:0)-(inp.left?1:0);
    this.vx+=(target*1.35-this.vx)*0.35;
    if(Math.abs(this.vx)<0.05)this.vx=0;
    if(target>0)this.face=1;if(target<0)this.face=-1;
    if(this.jbuf>0)this.jbuf--;
    if(this.coyote>0)this.coyote--;
    if(this.jbuf>0&&(this.ground||this.coyote>0)){
      this.vy=-4.45;this.ground=false;this.coyote=0;this.jbuf=0;
      game.sound.jumpS();game.particles.puff(this.cx,this.y+this.h,4);
    }
    if(!inp.jump&&this.vy<-1.6)this.vy=-1.6;
    this.vy+=0.22;if(this.vy>5)this.vy=5;
    this.x+=this.vx;
    if(this.vx>0){if(this.hitV(this.x+this.w,this.y)){this.x=Math.floor((this.x+this.w)/TILE)*TILE-this.w-0.01;this.vx=0;}}
    else if(this.vx<0){if(this.hitV(this.x,this.y)){this.x=(Math.floor(this.x/TILE)+1)*TILE+0.01;this.vx=0;}}
    if(this.x<10)this.x=10;
    if(this.x>this.map.mw*TILE-10-this.w)this.x=this.map.mw*TILE-10-this.w;
    const wasAir=!this.ground;
    this.y+=this.vy;this.ground=false;
    if(this.vy>0){
      if(this.hitH(this.y+this.h,this.x)){
        this.y=Math.floor((this.y+this.h)/TILE)*TILE-this.h-0.01;this.vy=0;this.ground=true;
        if(wasAir){game.sound.landS();game.particles.puff(this.cx,this.y+this.h,5);game.particles.dust(this.cx,this.y+this.h,3);}
      }
    }else if(this.vy<0){
      if(this.hitH(this.y,this.x)){this.y=(Math.floor(this.y/TILE)+1)*TILE+0.01;this.vy=0;}
    }
    if(this.ground)this.coyote=7;
    this.animMs+=dt;
    if(this.animMs>=100){this.animMs-=100;this.frame=(this.frame+1)%8;}
    if(this.blinking>0)this.blinking-=dt;
    else{this.blinkIn-=dt;if(this.blinkIn<=0){this.blinking=140;this.blinkIn=2200+Math.random()*2600;}}
    this.state=!this.ground?'jump':(Math.abs(this.vx)>0.25?'walk':'idle');
    if(this.state==='walk'){this.stepT+=dt;if(this.stepT>230){this.stepT=0;game.sound.stepS(this.frame%2);game.particles.dust(this.cx,this.y+this.h,1);}}
    this.breathT+=dt;
  }
  draw(){
    const g=game.ghost;let img;
    if(this.hiding){
      img=g.frames.hide[Math.floor(this.breathT/300)%3];
      drawSpr(img,this.x-3,this.y-4,this.face<0);
      return;
    }
    // Piscar quando invulnerável
    if(this.invulnT>0&&Math.floor(this.invulnT/4)%2===0)return;
    
    if(this.state==='jump'){
      const jf=this.vy<0?(this.frame%3):3+(this.frame%3);
      img=g.frames.jump[Math.min(jf,g.frames.jump.length-1)];
    }else if(this.state==='walk'){
      img=this.blinking>0?g.blinkWalk:g.frames.walk[this.frame%g.frames.walk.length];
    }else{
      img=this.blinking>0?g.blinkIdle:g.frames.idle[this.frame%g.frames.idle.length];
    }
    const bob=this.state==='idle'?[0,-1,-1,0,0,-1][this.frame%6]:this.state==='walk'?[0,-1,0,-1,0,-1,0,-1][this.frame%8]:0;
    drawSpr(img,this.x-3,this.y-2+bob,this.face<0);
  }
}

class Game{
  constructor(){
    this.sound=new Sound();
    this.ghost=new Ghost();
    this.menu=new Menu(this);
    this.isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
    this.state='intro';
    this.level=1;this.escTarget='menu';
    this.intro={phase:0,t:0,load:0,drips:new Drips(),seeded:false,eyes:{t:120,on:false,x:0,y:0}};
    this.keys={};this.pressedObj={};this.touches=[];
    this.prevJ=false;this.prevA=false;this.prevR2=false;this.prevE=false;
    this.t=0;this.acc=0;this.last=0;
    this.toastQ=[];this.toastCur=null;this.toastLines=[];
    this.dialog={active:false,pages:[],page:0,n:0};
    this.skels=[];this.invis={active:0,cd:0,denyT:0};
    this.cine={active:false,t:0,hold:0};
    this.graceT=0;this.alertSndT=0;
    this.particles=new ParticleSystem();
    this.heartbeatT=0;this.windT=0;
    this.gameOverT=0;
    this.vig=document.createElement('canvas');this.vig.width=W;this.vig.height=H;
    const vg=this.vig.getContext('2d');
    for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){
      const dx=(x-160)/160,dy=(y-90)/90,d=Math.sqrt(dx*dx+dy*dy);
      if(d>0.7&&Math.random()<(d-0.7)/0.3*0.6){vg.fillStyle='#000000';vg.fillRect(x,y,1,1);}
    }
    this.btns={l:{x:6,y:138,w:40,h:36},r:{x:50,y:138,w:40,h:36},a:{x:226,y:136,w:40,h:38},j:{x:270,y:130,w:44,h:46},r2:{x:138,y:138,w:42,h:36}};
    this.buildSkel();
    this.bindInput();
  }
  buildSkel(){
    const SK_A=[
    "...WWWWWW...","...WWWWWW...","...W0WW0W...","...W0W0W0...",
    "....WWWW....",".....WW.....","..WWWWWWWW..","..W.WWWW.W..",
    "..W.WWWW.W..","....WWWW....","....WWWW....","....W..W....",
    "....W..W....","...W....W...","...W....W...","..WW....WW.."];
    const SK_B=[
    "...WWWWWW...","...WWWWWW...","...W0WW0W...","...W0W0W0...",
    "....WWWW....",".....WW.....","..WWWWWWWW..","..W.WWWW.W..",
    "..W.WWWW.W..","....WWWW....","....WWWW....",".....WW.....",
    "....WWWW....","....W..W....","....W..W....","...WW..WW..."];
    const SK_F=[
    "...WWWWWW...","...WWWWWW...","...W0WW0W...","..W.WWWW.W..",
    "..W..WW..W..","..WWWWWWWW..","....WWWW....","....WWWW....",
    "....WWWW....","....WWWW....","....WWWW....","....W..W....",
    "...W....W...","...W....W...","..W......W..",".WW......WW."];
    const mk=(rows,col)=>{
      const c=document.createElement('canvas');c.width=12;c.height=16;
      const g=c.getContext('2d');
      for(let y=0;y<16;y++)for(let x=0;x<12;x++){
        const ch=rows[y][x];
        if(ch==='W'){g.fillStyle=col;g.fillRect(x,y,1,1);}
        else if(ch==='0'){g.fillStyle='#000000';g.fillRect(x,y,1,1);}
      }
      return c;
    };
    this.skel={w1:mk(SK_A,'#FFFFFF'),w2:mk(SK_B,'#FFFFFF'),wf:mk(SK_F,'#FFFFFF'),
               r1:mk(SK_A,'#FF3B3B'),r2:mk(SK_B,'#FF3B3B'),rf:mk(SK_F,'#FF3B3B')};
  }
  bindInput(){
    addEventListener('keydown',e=>{
      if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0)e.preventDefault();
      this.sound.unlock();
      if(e.repeat){this.keys[e.code]=true;return;}
      this.keys[e.code]=true;this.pressedObj[e.code]=true;
    });
    addEventListener('keyup',e=>{this.keys[e.code]=false;});
    addEventListener('blur',()=>{this.keys={};this.touches=[];});
    canvas.addEventListener('pointerdown',e=>{
      e.preventDefault();this.sound.unlock();
      const p=this.toXY(e);
      if(this.state==='gameover'){this.toMenu();return;}
      if(this.toastCur&&this.state==='game'){this.toastCur=null;return;}
      if(this.state==='intro'){this.skipIntro();return;}
      if(this.state==='game'){
        if(this.dialog&&this.dialog.active){this.advDialog();return;}
        if(this.isTouch&&p.x>290&&p.y<16){this.toMenu();return;}
        this.touches.push({id:e.pointerId,x:p.x,y:p.y});
        return;
      }
      if(this.state==='menu'){this.menuTap(p);return;}
      if(this.state==='settings'){this.setTap(p);return;}
      if(this.state==='director'){this.sound.back();this.toMenu();return;}
      if(this.state==='escaped'){this.sound.confirm();this.toMenu();return;}
    },{passive:false});
    canvas.addEventListener('pointermove',e=>{
      const p=this.toXY(e);
      for(const tch of this.touches)if(tch.id===e.pointerId){tch.x=p.x;tch.y=p.y;}
    });
    const up=e=>{this.touches=this.touches.filter(tt=>tt.id!==e.pointerId);};
    canvas.addEventListener('pointerup',up);
    canvas.addEventListener('pointercancel',up);
    canvas.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
    canvas.addEventListener('contextmenu',e=>e.preventDefault());
  }
  toXY(e){
    const r=canvas.getBoundingClientRect();
    return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
  }
  inRect(p,b){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;}
  menuTap(p){
    for(let i=0;i<3;i++){
      if(this.inRect(p,{x:90,y:88+i*22,w:140,h:18})){
        if(this.menu.sel!==i)this.sound.click();
        this.menu.sel=i;this.menuActivate();return;
      }
    }
  }
  setTap(p){
    for(let i=0;i<3;i++){
      if(this.inRect(p,{x:60,y:64+i*26,w:200,h:20})){
        this.menu.setSel=i;this.setActivate();return;
      }
    }
  }
  menuActivate(){
    this.sound.confirm();
    const s=this.menu.sel;
    if(s===0)this.startGame();
    else if(s===1){this.state='settings';this.menu.setSel=0;}
    else this.state='director';
  }
  setActivate(){
    const s=this.menu.setSel;
    if(s===0){this.sound.setMusic(!this.sound.musicOn);this.sound.click();}
    else if(s===1){this.sound.confirm();this.toggleFS();}
    else{this.sound.back();this.toMenu();}
  }
  toggleFS(){
    const d=document.documentElement;
    try{
      if(document.fullscreenElement)document.exitFullscreen();
      else(d.requestFullscreen||d.webkitRequestFullscreen).call(d);
    }catch(e){this.toast('NAO SUPORTADO');}
  }
  toMenu(){this.state='menu';this.menu.enter();this.sound.setIntense(false);this.toastCur=null;this.toastQ=[];}
  skipIntro(){if(this.state==='intro'){this.state='menu';this.menu.enter();}}
  toast(txt){this.toastQ.push(txt);}
  openDialog(lines){
    const wrapped=[];
    for(const ln of lines)for(const w of wrapText(ln,28))wrapped.push(w);
    const pages=[];
    for(let i=0;i<wrapped.length;i+=3)pages.push(wrapped.slice(i,i+3));
    this.dialog={active:true,pages:pages,page:0,n:0};
  }
  advDialog(){
    const d=this.dialog;if(!d||!d.active)return;
    const pl=d.pages[d.page];
    const total=pl.reduce((a,l)=>a+l.length,0);
    if(d.n<total){d.n=total;this.sound.typeS();}
    else{
      d.page++;d.n=0;
      if(d.page>=d.pages.length){d.active=false;this.sound.click();}
      else this.sound.typeS();
    }
  }
  updDialog(P){
    if(!this.dialog.active)return false;
    const d=this.dialog,pl=d.pages[d.page];
    if(pl){
      const total=pl.reduce((a,l)=>a+l.length,0);
      if(d.n<total){d.n+=0.7;if(Math.floor(d.n)%4===0)this.sound.typeS();}
      if(P.ok||P.act)this.advDialog();
    }
    return true;
  }
  startGame(){
    this.level=1;
    this.map=new Map();
    this.player=new Player(this.map,32,156);
    this.hasKey=false;this.time=0;this.introT=0;
    this.cam=0;this.shake=0;this.glitch=0;
    this.toastQ=[];this.toastCur=null;
    this.dialog={active:false,pages:[],page:0,n:0};
    this.particles.particles=[];
    this.dust=[];
    for(let i=0;i<24;i++)this.dust.push({x:Math.random()*W,y:Math.random()*H,sp:0.08+Math.random()*0.2,ph:Math.random()*6});
    this.app={on:false,x:0,t:0,cd:500+Math.random()*400};
    this.bo={on:false,t:500+Math.random()*500};
    this.flick={brokenT:400,on:0};
    this.scarePending=0;
    this.skels=[];this.invis={active:0,cd:0,denyT:0};this.cine={active:false,t:0,hold:0};
    this.sound.setIntense(false);
    this.state='game';
  }
  puff(x,y,n){this.particles.puff(x,y,n);}
  burst(x,y){this.particles.burst(x,y,14);}
  bones(x,y){this.particles.bones(x,y,10);}
  sparkle(){this.particles.sparkle(this.player.cx,this.player.cy,12);}
  openDoor(){
    const d=this.map.door;
    if(d.opening||d.open>=1)return;
    d.opening=true;this.sound.openS();this.shake=14;
    this.particles.smoke(d.x+d.w/2,d.y+10,6);
    this.toast('O PORTAO SE ABRIU...');
  }
  doInteract(a){
    if(a.kind==='key'){
      this.map.key.taken=true;this.hasKey=true;
      this.sound.keyS();this.particles.burst(a.x,a.y,16);
      this.toast('A CHAVE PULSA NA SUA MAO. FUJA.');
      this.sound.setIntense(true);this.glitch=14;
      this.app.cd=Math.min(this.app.cd,140);
    }else if(a.kind==='door'){
      if(!this.hasKey){this.openDialog(['TRANCADO.','PRECISO DA CHAVE.']);this.sound.lockedS();}
      else this.openDoor();
    }else{
      a.read=true;this.openDialog(a.lines);this.sound.typeS();
    }
  }
  doInteract2(){
    if(this.player.hiding){
      this.player.unhide();
      this.sound.unhideS();
      this.particles.dust(this.player.cx,this.player.cy,5);
      return;
    }
    const cl=this.map.getClosetAt(this.player.cx,this.player.cy);
    if(cl&&!cl.occupied){
      this.player.hideIn(cl);
      this.sound.hideS();
      this.particles.dust(cl.x+cl.w/2,cl.y+cl.h,4);
    }
  }
  consumePressed(){
    const p=this.pressedObj;
    const P={
      up:p.ArrowUp||p.KeyW,down:p.ArrowDown||p.KeyS,
      ok:p.Enter||p.Space,back:p.Escape,
      jump:p.Space||p.KeyW||p.ArrowUp,act:p.KeyE,
      invis:p.KeyR,
      any:Object.keys(p).length>0
    };
    this.pressedObj={};
    return P;
  }
  touchFlags(){
    const f={l:false,r:false,j:false,a:false,r2:false};
    for(const tch of this.touches){
      const p={x:tch.x,y:tch.y};
      if(this.inRect(p,this.btns.l))f.l=true;
      if(this.inRect(p,this.btns.r))f.r=true;
      if(this.inRect(p,this.btns.j))f.j=true;
      if(this.inRect(p,this.btns.a))f.a=true;
      if(this.inRect(p,this.btns.r2))f.r2=true;
    }
    return f;
  }
  stepF(dt){
    this.t++;
    this.sound.tick();
    this.particles.update();
    const P=this.consumePressed();
    if(this.state==='game'){
      if(this.toastCur&&P.any){
        this.toastCur=null;
        P.ok=false;P.act=false;P.jump=false;P.back=false;P.invis=false;
      }else if(!this.toastCur&&this.toastQ.length&&!(this.dialog&&this.dialog.active)&&!(this.cine&&this.cine.active)){
        const m=this.toastQ.shift();
        this.toastCur=m;this.toastLines=wrapText(m,30);
      }
    }
    switch(this.state){
      case 'intro':this.updIntro(P);break;
      case 'menu':
        this.menu.update();
        if(P.up){this.menu.sel=(this.menu.sel+2)%3;this.sound.click();}
        if(P.down){this.menu.sel=(this.menu.sel+1)%3;this.sound.click();}
        if(P.ok)this.menuActivate();
        break;
      case 'settings':
        this.menu.update();
        if(P.up){this.menu.setSel=(this.menu.setSel+2)%3;this.sound.click();}
        if(P.down){this.menu.setSel=(this.menu.setSel+1)%3;this.sound.click();}
        if(P.ok)this.setActivate();
        if(P.back){this.sound.back();this.toMenu();}
        break;
      case 'director':
        this.menu.update();
        if(P.ok||P.back){this.sound.back();this.toMenu();}
        break;
      case 'game':
        if(this.level===2)this.updGame2(P,dt);else this.updGame(P,dt);
        break;
      case 'escapeAnim':
        this.escT++;this.updAmbient(dt);
        if(this.escT>62){
          if(this.escTarget==='level2')this.startLevel2();
          else{this.state='escaped';this.escSeed=false;}
        }
        break;
      case 'escaped':
        this.updEscaped(P);
        break;
      case 'gameover':
        this.gameOverT++;
        if(P.any&&this.gameOverT>60){this.toMenu();}
        break;
    }
  }
  updIntro(P){
    const it=this.intro;it.t++;
    if(it.phase===0&&it.t>40){it.phase=1;it.t=0;}
    else if(it.phase===1){
      if(it.t>132){it.phase=2;it.t=0;}
      if(P.any&&it.t>30){this.skipIntro();return;}
    }else if(it.phase===2){
      if(!it.seeded){it.drips.seed(textSources('OTHER SIDE',5,37,44));it.seeded=true;}
      it.drips.update();
      if(it.load<66)it.load+=0.7;
      else if(it.load<70)it.load+=(Math.random()<0.2)?0.5:0;
      else it.load+=0.9;
      it.eyes.t--;
      if(it.eyes.t<=0){
        if(it.eyes.on){it.eyes.on=false;it.eyes.t=140+Math.random()*260;}

function textSources(text,sc,x,y){
  const w=textW(text,sc),h=5*sc;
  const oc=document.createElement('canvas');oc.width=w;oc.height=h;
  const o=oc.getContext('2d');
  drawText(text,0,0,sc,'#FFFFFF','left',o);
  const d=o.getImageData(0,0,w,h).data,out=[];
  for(let cx=0;cx<w;cx++){
    for(let cy=h-1;cy>=0;cy--){
      if(d[(cy*w+cx)*4+3]>0){if(Math.random()<0.16)out.push({x:x+cx,y:y+cy+1});break;}
    }
  }
  return out;
}

/* ================= PARTICLE SYSTEM ================= */
class ParticleSystem{
  constructor(){this.particles=[];this.maxParticles=300;}
  add(p){if(this.particles.length<this.maxParticles)this.particles.push(p);}
  puff(x,y,n,col){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,s=rng(0.5,2.5);
      this.add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rng(0.5,2),
        life:rng(20,45),maxLife:45,size:rng(1,3),col:col||'#AAAAAA',gravity:0.04,type:'puff'});
    }
  }
  burst(x,y,n,col){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,s=rng(1,4);
      this.add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rng(1,3),
        life:rng(25,55),maxLife:55,size:rng(1,3),
        col:col||(Math.random()<0.5?'#FFFFFF':'#AAAAAA'),gravity:0.06,type:'burst'});
    }
  }
  bones(x,y,n){
    for(let i=0;i<n;i++){
      this.add({x,y,vx:rng(-2.5,2.5),vy:rng(-4,-1),life:rng(30,60),maxLife:60,
        size:rng(1,2),col:Math.random()<0.7?'#FFFFFF':'#AAAAAA',
        gravity:0.12,rotation:Math.random()*Math.PI*2,rotSpeed:rng(-0.2,0.2),type:'bone'});
    }
  }
  sparkle(x,y,n){
    for(let i=0;i<n;i++){
      this.add({x:x+rng(-8,8),y:y+rng(-8,8),vx:rng(-0.8,0.8),vy:rng(-1.5,-0.3),
        life:rng(15,35),maxLife:35,size:rng(1,2),col:'#FFFFFF',gravity:-0.02,
        type:'sparkle',pulse:Math.random()*Math.PI*2});
    }
  }
  dust(x,y,n){
    for(let i=0;i<n;i++){
      this.add({x:x+rng(-5,5),y:y+rng(-2,2),vx:rng(-0.3,0.3),vy:rng(-0.5,-0.1),
        life:rng(40,80),maxLife:80,size:1,col:'#555555',gravity:-0.01,type:'dust'});
    }
  }
  blood(x,y,n){
    for(let i=0;i<n;i++){
      const a=rng(-Math.PI*0.8,-Math.PI*0.2);
      this.add({x,y,vx:Math.cos(a)*rng(1,3),vy:Math.sin(a)*rng(1,3),
        life:rng(30,70),maxLife:70,size:rng(1,3),col:'#AA0000',gravity:0.15,type:'blood'});
    }
  }
  smoke(x,y,n){
    for(let i=0;i<n;i++){
      this.add({x:x+rng(-3,3),y,vx:rng(-0.3,0.3),vy:rng(-1,-0.4),
        life:rng(50,100),maxLife:100,size:rng(2,5),col:'#333333',
        gravity:-0.02,type:'smoke',alpha:0.6});
    }
  }
  deathBurst(x,y){
    // Explosão dramática de morte
    for(let i=0;i<30;i++){
      const a=Math.random()*Math.PI*2,s=rng(2,5);
      this.add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rng(2,4),
        life:rng(40,80),maxLife:80,size:rng(1,4),
        col:i%3===0?'#AA0000':(i%3===1?'#FFFFFF':'#555555'),
        gravity:0.1,type:'death'});
    }
  }
  update(){
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity||0;p.life--;
      if(p.rotation!==undefined)p.rotation+=p.rotSpeed||0;
      if(p.pulse!==undefined)p.pulse+=0.2;
      if(p.type==='smoke')p.alpha*=0.97;
      if(p.life<=0)this.particles.splice(i,1);
    }
  }
  draw(cam){
    for(const p of this.particles){
      const alpha=clamp(p.life/p.maxLife,0,1);
      const sx=Math.round(p.x-cam),sy=Math.round(p.y);
      if(sx<-10||sx>W+10)continue;
      ctx.globalAlpha=alpha*(p.alpha||1);
      ctx.fillStyle=p.col;
      const sz=Math.ceil(p.size*alpha);
      if(p.type==='sparkle'){
        const pulse=0.5+0.5*Math.sin(p.pulse||0);
        ctx.globalAlpha=alpha*pulse;
        ctx.fillRect(sx,sy,sz,sz);
        if(sz>1){ctx.fillRect(sx-1,sy+Math.floor(sz/2),1,1);ctx.fillRect(sx+sz,sy+Math.floor(sz/2),1,1);}
      }else if(p.type==='bone'&&p.rotation!==undefined){
        ctx.save();ctx.translate(sx,sy);ctx.rotate(p.rotation);
        ctx.fillRect(-sz/2,-1,sz,2);ctx.restore();
      }else{
        ctx.fillRect(sx,sy,sz,sz);
      }
    }
    ctx.globalAlpha=1;
  }
}

/* ================= SOUND — ROCK HORROR SOUNDTRACK ================= */
class Sound{
  constructor(){
    this.ctx=null;this.ok=false;this.musicOn=true;this.intense=false;
    this.step=0;this.nextT=0;this.bar=0;this.bpm=110;
    this.tryLoad();
  }
  tryLoad(){try{const v=localStorage.getItem('os_music');if(v!==null)this.musicOn=v==='1';}catch(e){}}
  unlock(){
    if(this.ok){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return;}
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    try{this.ctx=new A();}catch(e){return;}
    const c=this.ctx;
    this.master=c.createGain();this.master.gain.value=0.6;this.master.connect(c.destination);
    // Compressor para dar peso ao rock
    this.comp=c.createDynamicsCompressor();
    this.comp.threshold.value=-18;this.comp.knee.value=20;
    this.comp.ratio.value=4;this.comp.attack.value=0.003;this.comp.release.value=0.15;
    this.comp.connect(this.master);
    this.mus=c.createGain();this.mus.gain.value=this.musicOn?0.9:0;
    this.mus.connect(this.comp);
    this.drums=c.createGain();this.drums.gain.value=1.1;this.drums.connect(this.comp);
    this.bass=c.createGain();this.bass.gain.value=1.0;this.bass.connect(this.comp);
    this.guit=c.createGain();this.guit.gain.value=0.7;this.guit.connect(this.comp);
    this.sfxG=c.createGain();this.sfxG.gain.value=0.9;this.sfxG.connect(this.master);
    this.ok=true;this.nextT=c.currentTime+0.15;
  }
  setMusic(v){
    this.musicOn=v;
    try{localStorage.setItem('os_music',v?'1':'0');}catch(e){}
    if(this.ok){
      this.mus.gain.setTargetAtTime(v?0.9:0,this.ctx.currentTime,0.15);
      this.drums.gain.setTargetAtTime(v?1.1:0,this.ctx.currentTime,0.15);
      this.bass.gain.setTargetAtTime(v?1.0:0,this.ctx.currentTime,0.15);
      this.guit.gain.setTargetAtTime(v?0.7:0,this.ctx.currentTime,0.15);
    }
  }
  setIntense(v){this.intense=v;}
  tick(){
    if(!this.ok||!this.musicOn)return;
    const c=this.ctx;if(c.state!=='running')return;
    const beatLen=60/this.bpm;
    const sixteenth=beatLen/4;
    if(this.nextT<c.currentTime-0.5)this.nextT=c.currentTime+0.1;
    while(this.nextT<c.currentTime+0.8){
      this.schedBeat(this.step,this.nextT);
      this.step=(this.step+1)%64;
      if(this.step===0)this.bar++;
      this.nextT+=sixteenth;
    }
  }
  schedBeat(s,t){
    // ROCK DRUMS — padrão agressivo
    // Kick: beats 1, 3 + variações
    if(s%16===0||s%16===8)this.kick(t);
    if(this.intense&&(s%16===6||s%16===14))this.kick(t); // double kick
    // Snare: backbeat em 2 e 4
    if(s%16===4||s%16===12)this.snare(t);
    // Hi-hat: colcheias
    if(s%2===0)this.hihat(t,s%4===2);
    // Ride em refrão
    if(this.intense&&s%2===1)this.ride(t);
    // BASS — linha pulsante em Em
    const bassNotes=[82.41,82.41,98.00,110.00]; // E2, E2, G2, A2
    if(s%4===0){
      const note=bassNotes[Math.floor(s/16)%bassNotes.length];
      this.rockBass(note,t,this.intense?0.3:0.4);
    }
    if(this.intense&&s%2===0){
      const note=bassNotes[Math.floor(s/16)%bassNotes.length];
      this.rockBass(note,t,0.15);
    }
    // GUITAR — power chord a cada compasso
    if(s%16===0){
      const chordProg=[
        [82.41,123.47],  // Em (E2 + B2)
        [65.41,98.00],   // C (C2 + G2)
        [98.00,146.83],  // G (G2 + D3)
        [73.42,110.00]   // D (D2 + A2)
      ];
      const chord=chordProg[this.bar%4];
      this.powerChord(chord,t,this.intense?0.5:0.7);
    }
    // Guitar lead melódico ocasional
    if(this.intense&&s%8===6&&Math.random()<0.3){
      const lead=[329.63,392.00,440.00,493.88,587.33];
      this.leadGuitar(lead[(Math.random()*lead.length)|0],t);
    }
    // Sting de horror a cada compasso
    if(s===48&&Math.random()<0.2)this.horrorSting(t);
    // Ambient horror drone
    if(s===0&&this.bar%2===0)this.ambientDrone(t);
  }
  kick(t){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(120,t);
    o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.9,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
    o.connect(g);g.connect(this.drums);o.start(t);o.stop(t+0.3);
    // Click transient
    const o2=c.createOscillator(),g2=c.createGain();
    o2.type='square';o2.frequency.setValueAtTime(1200,t);
    o2.frequency.exponentialRampToValueAtTime(80,t+0.01);
    g2.gain.setValueAtTime(0.15,t);
    g2.gain.exponentialRampToValueAtTime(0.001,t+0.02);
    o2.connect(g2);g2.connect(this.drums);o2.start(t);o2.stop(t+0.03);
  }
  snare(t){
    const c=this.ctx;
    // Tone
    const o=c.createOscillator(),g=c.createGain();
    o.type='triangle';o.frequency.setValueAtTime(220,t);
    o.frequency.exponentialRampToValueAtTime(120,t+0.08);
    g.gain.setValueAtTime(0.4,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    o.connect(g);g.connect(this.drums);o.start(t);o.stop(t+0.2);
    // Noise
    const buf=c.createBuffer(1,c.sampleRate*0.2,c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.6;
    const n=c.createBufferSource();n.buffer=buf;
    const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=1500;
    const gn=c.createGain();gn.gain.setValueAtTime(0.5,t);
    gn.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    n.connect(f);f.connect(gn);gn.connect(this.drums);
    n.start(t);n.stop(t+0.2);
  }
  hihat(t,open){
    const c=this.ctx;
    const buf=c.createBuffer(1,c.sampleRate*(open?0.15:0.04),c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    const n=c.createBufferSource();n.buffer=buf;
    const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
    const g=c.createGain();g.gain.setValueAtTime(open?0.2:0.15,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+(open?0.15:0.04));
    n.connect(f);f.connect(g);g.connect(this.drums);
    n.start(t);n.stop(t+0.2);
  }
  ride(t){
    const c=this.ctx;
    const buf=c.createBuffer(1,c.sampleRate*0.3,c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;
    const n=c.createBufferSource();n.buffer=buf;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=8500;f.Q.value=3;
    const g=c.createGain();g.gain.setValueAtTime(0.12,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    n.connect(f);f.connect(g);g.connect(this.drums);
    n.start(t);n.stop(t+0.35);
  }
  rockBass(f,t,dur){
    const c=this.ctx;
    const o=c.createOscillator(),o2=c.createOscillator();
    const g=c.createGain();
    const dist=c.createWaveShaper();
    const flt=c.createBiquadFilter();
    o.type='sawtooth';o.frequency.value=f;
    o2.type='square';o2.frequency.value=f*0.5;
    // Distorção leve
    const curve=new Float32Array(256);
    for(let i=0;i<256;i++){const x=(i/128)-1;curve[i]=Math.tanh(x*3);}
    dist.curve=curve;
    flt.type='lowpass';flt.frequency.value=800;
    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(0.5,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(dist);o2.connect(dist);dist.connect(flt);flt.connect(g);g.connect(this.bass);
    o.start(t);o2.start(t);o.stop(t+dur+0.05);o2.stop(t+dur+0.05);
  }
  powerChord(notes,t,dur){
    const c=this.ctx;
    // Distorção de guitarra
    const curve=new Float32Array(512);
    for(let i=0;i<512;i++){const x=(i/256)-1;curve[i]=Math.tanh(x*5);}
    for(const f of notes){
      const o1=c.createOscillator(),o2=c.createOscillator();
      o1.type='sawtooth';o1.frequency.value=f;
      o2.type='sawtooth';o2.frequency.value=f*1.005; // desafinado
      const dist=c.createWaveShaper();dist.curve=curve;
      const flt=c.createBiquadFilter();flt.type='lowpass';
      flt.frequency.setValueAtTime(2800,t);
      flt.frequency.exponentialRampToValueAtTime(900,t+dur);
      const g=c.createGain();
      g.gain.setValueAtTime(0.001,t);
      g.gain.linearRampToValueAtTime(0.18,t+0.02);
      g.gain.setValueAtTime(0.18,t+dur-0.1);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o1.connect(dist);o2.connect(dist);dist.connect(flt);flt.connect(g);g.connect(this.guit);
      o1.start(t);o2.start(t);o1.stop(t+dur+0.05);o2.stop(t+dur+0.05);
    }
  }
  leadGuitar(f,t){
    const c=this.ctx;
    const o=c.createOscillator(),o2=c.createOscillator();
    o.type='sawtooth';o.frequency.value=f;
    o2.type='square';o2.frequency.value=f*2;
    const vib=c.createOscillator(),vg=c.createGain();
    vib.frequency.value=5;vg.gain.value=4;
    vib.connect(vg);vg.connect(o.frequency);
    const flt=c.createBiquadFilter();flt.type='lowpass';flt.frequency.value=3000;flt.Q.value=4;
    const g=c.createGain();
    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(0.1,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    o.connect(flt);o2.connect(flt);flt.connect(g);g.connect(this.guit);
    o.start(t);o2.start(t);vib.start(t);
    o.stop(t+0.45);o2.stop(t+0.45);vib.stop(t+0.45);
  }
  horrorSting(t){
    const c=this.ctx;
    [196,233.08,311.13].forEach(f=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='sawtooth';o.frequency.value=f;
      const flt=c.createBiquadFilter();flt.type='bandpass';flt.frequency.value=800;flt.Q.value=8;
      g.gain.setValueAtTime(0.001,t);
      g.gain.linearRampToValueAtTime(0.08,t+0.1);
      g.gain.exponentialRampToValueAtTime(0.001,t+1.5);
      o.connect(flt);flt.connect(g);g.connect(this.mus);
      o.start(t);o.stop(t+1.6);
    });
  }
  ambientDrone(t){
    const c=this.ctx;
    const o=c.createOscillator();o.type='sawtooth';o.frequency.value=41.2;
    const lfo=c.createOscillator();lfo.frequency.value=0.2;
    const lg=c.createGain();lg.gain.value=8;lfo.connect(lg);lg.connect(o.frequency);
    const flt=c.createBiquadFilter();flt.type='lowpass';flt.frequency.value=300;flt.Q.value=6;
    const g=c.createGain();g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.1,t+0.5);
    g.gain.exponentialRampToValueAtTime(0.001,t+3);
    o.connect(flt);flt.connect(g);g.connect(this.mus);
    o.start(t);lfo.start(t);o.stop(t+3.1);lfo.stop(t+3.1);
  }
  /* SFX */
  tone(f,d,o){
    if(!this.ok)return;o=o||{};
    const c=this.ctx,t=c.currentTime+(o.at||0);
    const os=c.createOscillator(),g=c.createGain();
    os.type=o.type||'square';os.frequency.setValueAtTime(f,t);
    if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t+d);
    g.gain.setValueAtTime(o.v||0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    os.connect(g);g.connect(this.sfxG);os.start(t);os.stop(t+d+0.02);
  }
  click(){this.tone(900,0.05,{v:0.07});this.tone(620,0.06,{v:0.05,at:0.02});}
  confirm(){this.tone(520,0.08,{v:0.1});this.tone(784,0.11,{v:0.1,at:0.07});}
  back(){this.tone(400,0.07,{v:0.09});this.tone(250,0.09,{v:0.09,at:0.06});}
  jumpS(){this.tone(170,0.14,{slide:330,v:0.09});}
  landS(){this.tone(95,0.06,{type:'triangle',v:0.08});}

  lockedS(){this.tone(120,0.1,{v:0.15});this.tone(90,0.13,{v:0.12,at:0.09});}
  openS(){this.tone(70,1.0,{type:'sawtooth',v:0.16,slide:42});[1500,1150,900].forEach((f,i)=>this.tone(f,0.04,{v:0.06,at:0.15+i*0.12}));}
  stingS(){[220,233.08,440].forEach(f=>this.tone(f,0.9,{type:'sawtooth',v:0.045}));this.tone(1200,0.4,{type:'sine',v:0.03,slide:850});}
  escapeS(){[392,494,587,784].forEach((f,i)=>this.tone(f,0.22,{type:'triangle',v:0.12,at:i*0.16}));this.tone(55,2,{type:'sine',v:0.1,at:0.7});}
  typeS(){this.tone(1300,0.012,{v:0.02});}
  alertS(){this.tone(740,0.1,{v:0.1});this.tone(520,0.14,{v:0.1,at:0.09});}
  crackS(){this.tone(120,0.3,{type:'sawtooth',v:0.2,slide:40});[2400,1900,1500].forEach((f,i)=>this.tone(f,0.03,{v:0.07,at:i*0.05}));}

  denyS(){this.tone(160,0.09,{v:0.12});this.tone(140,0.09,{v:0.1,at:0.08});}

  unhideS(){this.tone(400,0.1,{type:'triangle',v:0.1});this.tone(350,0.15,{type:'sine',v:0.08,at:0.05});}
  skelStep(){this.tone(80+Math.random()*40,0.08,{type:'square',v:0.06});}
  skelRattle(){[1200,1500,1800,900].forEach((f,i)=>this.tone(f,0.04,{type:'triangle',v:0.04,at:i*0.03}));}
  heartBeat(){this.tone(60,0.15,{type:'sine',v:0.2});this.tone(55,0.12,{type:'sine',v:0.15,at:0.2});}
  deathS(){

class Ghost{
  constructor(){
    this.pal={'1':'#FFFFFF','2':'#AAAAAA','3':'#555555','4':'#000000'};
    this.base=[
      "0000000000000000","0000011111100000","0001111111111000","0011111111111100",
      "0111111111111110","0111111111111110","0111111111111110","0111111111111110",
      "0111111111111110","0111111111111110","0111111111111110","0111111111111110",
      "0111111111111110","0111111111111110"];
    this.frames={idle:[],walk:[],jump:[],hide:[]};
    this.build();
  }
  compose(o){
    const rows=this.base.map(r=>r.split(''));
    const dx=o.dx||0,cols=[4+dx,5+dx,10+dx,11+dx];
    const put=(r,c,v)=>{if(c>=0&&c<16)rows[r][c]=v;};
    if(o.wide){[5,6,7].forEach(r=>cols.forEach(c=>put(r,c,'4')));}
    else if(o.blink){cols.forEach(c=>put(7,c,'4'));}
    else{[6,7].forEach(r=>cols.forEach(c=>put(r,c,'4')));}
    cols.forEach(c=>put(8,c,'3'));
    if(o.mouth==='o'){put(10,7,'4');put(10,8,'4');put(11,7,'4');put(11,8,'4');}
    else{put(10,7,'4');put(10,8,'4');}
    for(let r=4;r<=12;r++)put(r,13,'2');
    const out=rows.map(r=>r.join(''));
    out.push(o.tail);out.push(o.r15||"0000000000000000");
    return out;
  }
  mk(rows){
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    for(let y=0;y<16;y++){const r=rows[y];
      for(let x=0;x<16;x++){const ch=r[x];
        if(ch!=='0'){g.fillStyle=this.pal[ch];g.fillRect(x,y,1,1);}}}
    return c;
  }
  build(){
    const T1="0111011101110110",T2="0110111011101100",T3="0111011011101110",T4="0101101101101010";
    const TJ="0111111111111110",TJ2="0011001100110000",TJ3="0101010101010101";
    const TW1="0110111011101110",TW2="0101011101110101",TW3="0111011011010111";
    const m=o=>this.mk(this.compose(o));
    this.frames.idle=[m({tail:T1}),m({tail:T2}),m({tail:T3}),m({tail:T2}),m({tail:T4}),m({tail:T1})];
    this.blinkIdle=m({tail:T1,blink:true});
    this.frames.walk=[
      m({tail:T1,dx:1}),m({tail:T2,dx:0}),m({tail:T3,dx:-1}),m({tail:T2,dx:0}),
      m({tail:T1,dx:-1}),m({tail:TW1,dx:0}),m({tail:TW2,dx:1}),m({tail:TW3,dx:0})
    ];
    this.blinkWalk=m({tail:T2,dx:1,blink:true});
    this.frames.jump=[
      m({tail:TJ,mouth:'o',wide:true}),m({tail:TJ2,mouth:'o',wide:true}),
      m({tail:TJ3,mouth:'o'}),m({tail:TJ}),m({tail:TJ2}),m({tail:T1})
    ];
    this.frames.hide=[this.mkHide(0),this.mkHide(1),this.mkHide(2)];
    const rows=this.compose({tail:T1});
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    for(let y=0;y<16;y++){const r=rows[y];
      for(let x=0;x<16;x++){const ch=r[x];
        if(ch==='1'||ch==='2'||ch==='3'){g.fillStyle='#000000';g.fillRect(x,y,1,1);}
        else if(ch==='4'){g.fillStyle='#FFFFFF';g.fillRect(x,y,1,1);}}}
    this.sil=c;
  }
  mkHide(phase){
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    g.fillStyle='#FFFFFF';
    const yOff=phase===1?-1:0;
    for(let yy=6;yy<=13;yy++){
      for(let xx=4;xx<=12;xx++){
        const dist=Math.abs(xx-8)+Math.abs(yy-9.5+yOff);
        if(dist<5)g.fillRect(xx,yy,1,1);
      }
    }
    g.fillStyle='#000000';
    g.fillRect(6,8+yOff,1,1);g.fillRect(9,8+yOff,1,1);
    return c;
  }
}

class Drips{
  constructor(){this.list=[];this.drops=[];}
  seed(srcs){
    this.list=[];this.drops=[];
    for(const s of srcs)if(Math.random()<0.6)
      this.list.push({x:s.x,y:s.y,len:0,max:8+Math.random()*26,sp:0.05+Math.random()*0.1,wait:(Math.random()*220)|0});
  }
  update(){
    for(const d of this.list){
      if(d.wait>0){d.wait--;continue;}
      d.len+=d.sp;
      if(d.len>=d.max){
        this.drops.push({x:d.x,y:d.y+d.len,vy:0.25+Math.random()*0.3});
        d.len=2+Math.random()*3;d.max=8+Math.random()*26;d.sp=0.04+Math.random()*0.09;
      }
    }
    for(const p of this.drops){p.vy=Math.min(p.vy+0.02,1);p.y+=p.vy;}
    this.drops=this.drops.filter(p=>p.y<184);
  }
  draw(col,w){
    ctx.fillStyle=col;
    for(const d of this.list){if(d.wait>0||d.len<=0)continue;ctx.fillRect(d.x,d.y,w,Math.ceil(d.len));}
    for(const p of this.drops)ctx.fillRect(p.x,p.y,w,w);
  }
}

      const x=this.graves[i]*10;
      if(x<cam-20||x>cam+W+20)continue;
      const v=hash(i,3)%3;
      if(v===0){
        g.fillStyle='#555555';g.fillRect(x+1,140,8,10);g.fillRect(x+2,138,6,2);

      }else{

      }
    }
    this.drawMausoleum(t);

    }

  drawDirt(tx,ty){
    const x=tx*10,y=ty*10,h=hash(tx,ty),g=ctx;
    g.fillStyle='#555555';g.fillRect(x,y,10,10);

  drawCryptTile(tx,ty){

  drawCloset(cl,t){
    const g=ctx,x=cl.x,y=cl.y;

    g.fillStyle='#000000';g.globalAlpha=0.4;
    g.fillRect(x-2,y+cl.h,cl.w+4,2);

    // Corpo principal - madeira escura

    // Gradiente vertical (mais claro em cima)
    g.fillStyle='#3a2a1a';g.fillRect(x+1,y+1,cl.w-2,4);
    // Moldura externa - mais elaborada
    g.fillStyle='#1a0a00';
    g.fillRect(x-1,y-1,cl.w+2,1);
    g.fillRect(x-1,y+cl.h,cl.w+2,1);
    g.fillRect(x-1,y-1,1,cl.h+2);
    g.fillRect(x+cl.w,y-1,1,cl.h+2);
    // Cornija em cima
    g.fillStyle='#3a2a1a';
    g.fillRect(x-2,y-3,cl.w+4,3);
    g.fillStyle='#4a3a2a';
    g.fillRect(x-2,y-3,cl.w+4,1);
    // Detalhes da porta dupla
    const mid=x+cl.w/2;
    // Porta esquerda
    g.fillStyle='#3a2510';g.fillRect(x+2,y+2,mid-x-2,cl.h-4);
    g.fillStyle='#4a3520';g.fillRect(x+3,y+3,mid-x-4,cl.h-6);
    // Painéis decorativos
    g.fillStyle='#2a1a0a';
    g.fillRect(x+4,y+4,mid-x-6,10);
    g.fillRect(x+4,y+cl.h-14,mid-x-6,10);
    // Porta direita
    g.fillStyle='#3a2510';g.fillRect(mid,y+2,cl.w-mid-2,cl.h-4);
    g.fillStyle='#4a3520';g.fillRect(mid+1,y+3,cl.w-mid-4,cl.h-6);
    g.fillStyle='#2a1a0a';
    g.fillRect(mid+2,y+4,cl.w-mid-6,10);
    g.fillRect(mid+2,y+cl.h-14,cl.w-mid-6,10);
    // Linha central
    g.fillStyle='#0a0500';g.fillRect(mid-1,y,2,cl.h);
    // Maçanetas douradas
    g.fillStyle='#aa8844';
    g.fillRect(mid-3,y+cl.h/2-1,2,3);
    g.fillRect(mid+1,y+cl.h/2-1,2,3);
    g.fillStyle='#ffdd88';
    g.fillRect(mid-3,y+cl.h/2-1,1,1);
    g.fillRect(mid+1,y+cl.h/2-1,1,1);
    // Sinal de ocupado
    if(cl.occupied){
      // Luz interna vazando pelas frestas
      g.fillStyle='#ffaa44';g.globalAlpha=0.4+0.2*Math.sin(t*0.15);
      g.fillRect(x+2,y+2,1,cl.h-4);
      g.fillRect(x+cl.w-3,y+2,1,cl.h-4);
      g.fillRect(mid-1,y+2,1,cl.h-4);
      g.globalAlpha=1;
      // Ícone de olho brilhante
      g.fillStyle='#FFFFFF';
      const pulse=Math.sin(t*0.2)*0.5+0.5;
      g.globalAlpha=pulse;
      g.fillRect(mid-3,y-10,2,2);
      g.fillRect(mid+1,y-10,2,2);

    }
    // Prompt de interação E
    if(game&&game.player&&!cl.occupied&&game.level===2){
      const dist=Math.hypot((x+cl.w/2)-game.player.cx,(y+cl.h/2)-game.player.cy);

  drawMausoleum(t){

    g.fillRect(gt.x,py+12,gt.w,2);g.fillRect(gt.x,py+36,gt.w,2);

    g.fillStyle='#555555';g.fillRect(1186,84,8,6);
    g.fillStyle=lampOn?'#FFFFFF':'#555555';g.fillRect(1189,86,2,2);
  }
}

/* ================= PLAYER ================= */
class Player{
  constructor(map,x,y){
    this.map=map;this.x=x;this.y=y;this.w=10;this.h=14;
    this.vx=0;this.vy=0;this.ground=false;this.face=1;
    this.frame=0;this.animMs=0;this.state='idle';
    this.blinkIn=1800+Math.random()*2000;this.blinking=0;
    this.coyote=0;this.jbuf=0;this.stepT=0;
    this.hiding=false;this.hideCloset=null;
    this.breathT=0;this.hurtT=0;
  }
  get cx(){return this.x+this.w/2;}
  get cy(){return this.y+this.h/2;}
  hitV(px,pyTop){
    const tx=Math.floor(px/TILE);
    const a=Math.floor(pyTop/TILE),b=Math.floor((pyTop+this.h/2)/TILE),c=Math.floor((pyTop+this.h-0.01)/TILE);
    return this.map.solid(tx,a)||this.map.solid(tx,b)||this.map.solid(tx,c);
  }
  hitH(py,pxL){
    const ty=Math.floor(py/TILE);
    const a=Math.floor(pxL/TILE),b=Math.floor((pxL+this.w/2)/TILE),c=Math.floor((pxL+this.w-0.01)/TILE);
    return this.map.solid(a,ty)||this.map.solid(b,ty)||this.map.solid(c,ty);
  }
  hideIn(closet){
    this.hiding=true;this.hideCloset=closet;closet.occupied=true;
    this.x=closet.x+closet.w/2-this.w/2;
    this.y=closet.y+closet.h-this.h-2;
    this.vx=0;this.vy=0;
  }
  unhide(){
    if(this.hideCloset){this.hideCloset.occupied=false;this.hideCloset=null;}
    this.hiding=false;
  }
  update(inp,dt){
    this.breathT+=dt;
    if(this.hurtT>0)this.hurtT-=dt;
    if(this.hiding){
      // Permite sair mas não movimento
      return;
    }
    const target=(inp.right?1:0)-(inp.left?1:0);
    this.vx+=(target*1.35-this.vx)*0.35;
    if(Math.abs(this.vx)<0.05)this.vx=0;
    if(target>0)this.face=1;if(target<0)this.face=-1;
    if(this.jbuf>0)this.jbuf--;
    if(this.coyote>0)this.coyote--;
    if(this.jbuf>0&&(this.ground||this.coyote>0)){
      this.vy=-4.45;this.ground=false;this.coyote=0;this.jbuf=0;
      game.sound.jumpS();game.particles.puff(this.cx,this.y+this.h,4);
    }
    if(!inp.jump&&this.vy<-1.6)this.vy=-1.6;
    this.vy+=0.22;if(this.vy>5)this.vy=5;
    this.x+=this.vx;
    if(this.vx>0){if(this.hitV(this.x+this.w,this.y)){this.x=Math.floor((this.x+this.w)/TILE)*TILE-this.w-0.01;this.vx=0;}}
    else if(this.vx<0){if(this.hitV(this.x,this.y)){this.x=(Math.floor(this.x/TILE)+1)*TILE+0.01;this.vx=0;}}
    if(this.x<10)this.x=10;
    if(this.x>this.map.mw*TILE-10-this.w)this.x=this.map.mw*TILE-10-this.w;
    const wasAir=!this.ground;
    this.y+=this.vy;this.ground=false;
    if(this.vy>0){
      if(this.hitH(this.y+this.h,this.x)){
        this.y=Math.floor((this.y+this.h)/TILE)*TILE-this.h-0.01;this.vy=0;this.ground=true;
        if(wasAir){game.sound.landS();game.particles.puff(this.cx,this.y+this.h,5);game.particles.dust(this.cx,this.y+this.h,3);}
      }
    }else if(this.vy<0){
      if(this.hitH(this.y,this.x)){this.y=(Math.floor(this.y/TILE)+1)*TILE+0.01;this.vy=0;}
    }
    if(this.ground)this.coyote=7;
    this.animMs+=dt;
    if(this.animMs>=100){this.animMs-=100;this.frame=(this.frame+1)%8;}
    if(this.blinking>0)this.blinking-=dt;
    else{this.blinkIn-=dt;if(this.blinkIn<=0){this.blinking=140;this.blinkIn=2200+Math.random()*2600;}}
    this.state=!this.ground?'jump':(Math.abs(this.vx)>0.25?'walk':'idle');
    if(this.state==='walk'){this.stepT+=dt;if(this.stepT>230){this.stepT=0;game.sound.stepS(this.frame%2);game.particles.dust(this.cx,this.y+this.h,1);}}
  }
  draw(){
    const g=game.ghost;let img;
    if(this.hiding){
      img=g.frames.hide[Math.floor(this.breathT/300)%3];
      drawSpr(img,this.x-3,this.y-4,this.face<0);
      return;
    }
    if(this.state==='jump'){
      const jf=this.vy<0?(this.frame%3):3+(this.frame%3);
      img=g.frames.jump[Math.min(jf,g.frames.jump.length-1)];
    }else if(this.state==='walk'){
      img=this.blinking>0?g.blinkWalk:g.frames.walk[this.frame%g.frames.walk.length];
    }else{
      img=this.blinking>0?g.blinkIdle:g.frames.idle[this.frame%g.frames.idle.length];
    }
    const bob=this.state==='idle'?[0,-1,-1,0,0,-1][this.frame%6]:this.state==='walk'?[0,-1,0,-1,0,-1,0,-1][this.frame%8]:0;
    // Sombra
    ctx.fillStyle='#000000';ctx.globalAlpha=0.4;
    ctx.fillRect(this.x-1,this.y+this.h,this.w+2,2);
    ctx.globalAlpha=1;
    // Flash quando machucado
    if(this.hurtT>0 && Math.floor(this.hurtT/50)%2===0){
      ctx.globalAlpha=0.5;
    }
    drawSpr(img,this.x-3,this.y-2+bob,this.face<0);
    ctx.globalAlpha=1;
  }
}

class Menu{

    this.g=g;this.sel=0;this.setSel=0;this.seeded=false;
    this.drips=new Drips();this.parts=[];
    for(let i=0;i<45;i++)this.parts.push({x:Math.random()*W,y:Math.random()*H,sp:0.12+Math.random()*0.28,c:Math.random()<0.5?'#AAAAAA':'#FFFFFF',dr:Math.random()*6});
