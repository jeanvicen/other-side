            3
        );

        g.fillStyle="#ffff88";

        g.fillRect(
            kx+1,
            ky-1,
            6,
            2
        );

        g.fillRect(
            kx+4,
            ky+1,
            1,
            2
        );

        g.fillRect(
            kx+6,
            ky+1,
            1,
            2
        );
    }

    drawDoor(t){
        const d=this.door;
        const g=ctx;

        g.fillStyle="#111122";

        g.fillRect(
            d.x,
            d.y,
            d.w,
            d.h
        );

        const off=d.open*d.h;
        const py=d.y-off;

        g.save();

        g.beginPath();

        g.rect(
            d.x,
            d.y,
            d.w,
            d.h
        );

        g.clip();

        g.fillStyle="#665544";

        g.fillRect(
            d.x,
            py,
            d.w,
            d.h
        );

        g.fillStyle="#222233";

        g.fillRect(
            d.x+9,
            py,
            2,
            d.h
        );

        g.restore();

        g.fillStyle="#887766";

        g.fillRect(
            d.x-2,
            d.y-4,
            d.w+4,
            3
        );

        g.fillRect(
            d.x-2,
            d.y-4,
            2,
            d.h+4
        );

        g.fillRect(
            d.x+d.w,
            d.y-4,
            2,
            d.h+4
        );

        const period=
            game.hasKey
            ?8
            :30;

        const lampOn=
            d.open<1&&
            ((t%period)<period/2);

        g.fillStyle=
            lampOn
            ?"#ff4444"
            :"#444455";

        g.fillRect(
            d.x+9,
            d.y-8,
            2,
            2
        );
    }

    draw(cam,t){
        const g=ctx;

        const x0=
            Math.max(
                0,
                Math.floor(cam/TILE)-1
            );

        const x1=
            Math.min(
                MW-1,
                Math.floor((cam+W)/TILE)+1
            );

        const bgGrad=
            ctx.createLinearGradient(
                0,
                0,
                0,
                H
            );

        bgGrad.addColorStop(
            0,
            "#0f1022"
        );

        bgGrad.addColorStop(
            .45,
            "#171a30"
        );

        bgGrad.addColorStop(
            1,
            "#0c1020"
        );

        ctx.fillStyle=bgGrad;

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        /* teto industrial */
        g.fillStyle="#252534";

        g.fillRect(
            x0*10,
            0,
            (x1-x0+1)*10,
            3
        );

        g.fillStyle="#1b1b27";

        g.fillRect(
            x0*10,
            22,
            (x1-x0+1)*10,
            2
        );

        /* placas do teto */
        for(let tx=x0;tx<=x1;tx+=6){
            const x=tx*10;

            g.fillStyle="#29293a";

            g.fillRect(
                x,
                4,
                10,
                2
            );

            g.fillStyle="#3d3d50";

            g.fillRect(
                x+2,
                5,
                6,
                1
            );
        }

        /* tubos */
        g.fillStyle="#303041";

        g.fillRect(
            x0*10,
            8,
            (x1-x0+1)*10,
            2
        );

        g.fillStyle="#4a4a5c";

        for(let tx=x0;tx<=x1;tx+=8){
            const x=tx*10+4;

            g.fillRect(
                x,
                6,
                2,
                5
            );
        }

        /* detalhes de fundo */
        g.fillStyle="#4a4a5a";

        for(let tx=x0;tx<=x1;tx++){
            for(let ty=1;ty<17;ty++){
                const c=
                    this.g[
                        ty*MW+tx
                    ];

                if(c!==0)
                    continue;

                const h=
                    hash(tx,ty);

                if(h%7===0){
                    g.fillRect(
                        tx*10+(h%8),
                        ty*10+((h>>3)%8),
                        1,
                        1
                    );
                }

                if(h%13===0){
                    g.fillRect(
                        tx*10+((h>>5)%9),
                        ty*10+((h>>2)%9),
                        2,
                        1
                    );
                }
            }
        }

        /* faixa superior */
        g.fillStyle="#3a3a4a";

        g.fillRect(
            x0*10,
            11,
            (x1-x0+1)*10,
            2
        );

        g.fillStyle="#000";

        for(let tx=x0;tx<=x1;tx++){
            if(tx%4===0){
                g.fillRect(
                    tx*10+4,
                    11,
                    2,
                    2
                );
            }
        }

        /* painéis das paredes */
        for(let tx=x0;tx<=x1;tx+=7){
            const x=tx*10;

            g.fillStyle="#252536";

            g.fillRect(
                x,
                35,
                2,
                70
            );

            g.fillStyle="#3d3d50";

            g.fillRect(
                x+2,
                35,
                1,
                70
            );
        }

        /* faixa técnica */
        for(let tx=x0;tx<=x1;tx++){
            const x=tx*10;

            if(tx%5===0){
                g.fillStyle="#514527";

                g.fillRect(
                    x,
                    70,
                    10,
                    2
                );

                g.fillStyle="#80672f";

                g.fillRect(
                    x,
                    70,
                    5,
                    1
                );
            }
        }

        /* caixas elétricas */
        for(let tx=x0;tx<=x1;tx+=12){
            const x=tx*10+2;

            g.fillStyle="#343447";

            g.fillRect(
                x,
                42,
                7,
                9
            );

            g.fillStyle="#161621";

            g.fillRect(
                x+1,
                44,
                5,
                4
            );

            g.fillStyle=
                ((t+tx*4)%60<30)
                ?"#66ff88"
                :"#34443a";

            g.fillRect(
                x+2,
                45,
                1,
                1
            );

            g.fillRect(
                x+4,
                45,
                1,
                1
            );
        }

        /* paredes reais */
        for(let tx=x0;tx<=x1;tx++){
            for(let ty=0;ty<MH;ty++){
                const c=
                    this.g[
                        ty*MW+tx
                    ];

                if(c===1)
                    this.drawWall(
                        tx,
                        ty
                    );
                else if(c===2)
                    this.drawCat(
                        tx,
                        ty
                    );
                else if(c===3)
                    this.drawCrate(
                        tx,
                        ty
                    );
            }
        }

        /* pequenos danos industriais */
        this.drawDamagedLabDetails(
            cam,
            t
        );

        /* piso */
        for(let tx=x0;tx<=x1;tx++){
            const x=tx*10;

            if(tx%4===0){
                g.fillStyle="#343445";

                g.fillRect(
                    x,
                    164,
                    10,
                    1
                );
            }

            const h=hash(tx,77);

            g.fillStyle="#262636";

            if(h%3===0){
                g.fillRect(
                    x+(h%8),
                    168,
                    3,
                    1
                );
            }

            if(h%5===0){
                g.fillRect(
                    x+((h>>3)%9),
                    173,
                    1,
                    1
                );
            }

            if(h%9===0){
                g.fillRect(
                    x+2,
                    171,
                    5,
                    1
                );

                g.fillRect(
                    x+4,
                    172,
                    3,
                    1
                );
            }
        }

        /* faixa de segurança */
        for(let tx=x0;tx<=x1;tx++){
            if(tx%8<4){
                g.fillStyle="#463922";

                g.fillRect(
                    tx*10,
                    176,
                    10,
                    1
                );
            }
        }

        /* posters */
        for(const p of this.posters){
            const px=p.tx*10;
            const py=p.ty*10;

            if(
                px<cam-20||
                px>cam+W+20
            )continue;

            g.fillStyle="#665544";

            g.fillRect(
                px-1,
                py-1,
                11,
                13
            );

            g.fillStyle="#9999bb";

            g.fillRect(
                px,
                py,
                9,
                11
            );

            g.fillStyle="#222";

            g.fillRect(
                px+2,
                py+2,
                5,
                1
            );

            g.fillRect(
                px+2,
                py+4,
                6,
                1
            );

            g.fillRect(
                px+2,
                py+6,
                4,
                1
            );
        }

        /* máquinas */
        for(const m of this.machines){
            if(
                m.x+m.w<cam-10||
                m.x>cam+W+10
            )continue;

            g.fillStyle="#555566";

            g.fillRect(
                m.x,
                m.y,
                m.w,
                2
            );

            g.fillRect(
                m.x,
                m.y,
                2,
                m.h
            );

            g.fillRect(
                m.x+m.w-2,
                m.y,
                2,
                m.h
            );

            g.fillRect(
                m.x,
                m.y+m.h-2,
                m.w,
                2
            );

            const on=
                ((t+m.x)%60)<30;

            g.fillStyle=
                on
                ?"#88ff88"
                :"#444455";

            g.fillRect(
                m.x+m.w-6,
                m.y+4,
                2,
                2
            );

            g.fillStyle="#8888aa";

            g.fillRect(
                m.x+5,
                m.y+10,
                6,
                6
            );

            g.fillStyle="#000";

            g.fillRect(
                m.x+6,
                m.y+11,
                4,
                4
            );
        }

        /* potes */
        for(const jx of this.jars){
            this.drawJar(
                jx,
                t
            );
        }

        /* elementos interativos */
        for(const a of this.acts){
            if(a.kind==="console")
                this.drawConsole(
                    a,
                    t
                );

            if(a.kind==="note")
                this.drawNote(
                    a,
                    t
                );
        }

        this.drawKey(t);
        this.drawDoor(t);
    }
}


/* =========================================================
   MAP 2 — CEMITÉRIO
========================================================= */

class Map2{
    constructor(){
        this.mw=MW2;

        this.g=
            new Uint8Array(
                MW2*MH
            );

        this.gate={
            x:1480,
            y:100,
            w:20,
            h:50,
            open:0,
            opening:false
        };

        this.planks=[];
        this.cracked=false;
        this.bridgeDone=false;
        this.closets=[];

        this.build();
    }

    set(x,y,v){
        if(
            x>=0&&
            x<MW2&&
            y>=0&&
            y<MH
        ){
            this.g[
                y*MW2+x
            ]=v;
        }
    }

    build(){
        for(let x=0;x<MW2;x++){
            if(x>=74&&x<=94)
                continue;

            this.set(x,15,1);
            this.set(x,16,1);
            this.set(x,17,1);
        }

        for(let y=8;y<=17;y++){
            this.set(0,y,1);
            this.set(1,y,1);
            this.set(158,y,1);
            this.set(159,y,1);
        }

        this.crypts=[
            {x:18,w:2},
            {x:32,w:2},
            {x:48,w:2},
            {x:110,w:2},
            {x:130,w:2}
        ];

        for(const c of this.crypts){
            for(let x=c.x;x<c.x+c.w;x++){
                for(let y=12;y<=14;y++){
                    this.set(x,y,3);
                }
            }
        }

        for(let x=148;x<=149;x++){
            for(let y=10;y<=14;y++){
                this.set(x,y,4);
            }
        }

        for(let x=74;x<=94;x++){
            this.set(x,15,5);

            this.planks.push({
                tx:x,
                falling:false,
                oy:0,
                vy:0,
                gone:false
            });
        }

        this.graves=[];

        for(let i=0;i<30;i++){
            const gx=
                6+
                i*5+
                Math.floor(
                    Math.random()*3
                );

            if(gx>=72&&gx<=96)
                continue;

            this.graves.push({
                tx:gx,
                type:hash(i,7)%5,
                lean:
                    (hash(i,13)%7-3)*.5,
                crack:
                    hash(i,17)%3===0,
                buried:
                    hash(i,23)%5===0,
                h:
                    8+
                    hash(i,29)%6
            });
        }

        this.trees=[];

        for(let i=0;i<12;i++){
            const tx=5+i*13;

            if(tx>=70&&tx<=98)
                continue;

            this.trees.push({
                tx,
                sway:Math.random()*6.28,
                h:
                    30+
                    hash(i,37)%20,
                branches:
                    3+
                    hash(i,41)%3
            });
        }

        this.fences=[
            {x0:10,x1:16},
            {x0:24,x1:30},
            {x0:39,x1:46},
            {x0:55,x1:62},
            {x0:100,x1:108},
            {x0:115,x1:125},
            {x0:135,x1:145}
        ];

        this.closets=[
            {x:110,y:130,w:18,h:30,occupied:false},
            {x:250,y:130,w:18,h:30,occupied:false},
            {x:400,y:130,w:18,h:30,occupied:false},
            {x:550,y:130,w:18,h:30,occupied:false},
            {x:680,y:130,w:18,h:30,occupied:false},
            {x:1000,y:130,w:18,h:30,occupied:false},
            {x:1150,y:130,w:18,h:30,occupied:false},
            {x:1350,y:130,w:18,h:30,occupied:false}
        ];

        this.candles=[];

        for(let i=0;i<20;i++){
            const cx=10+i*8;

            if(cx>=70&&cx<=98)
                continue;

            this.candles.push({
                x:cx*TILE+3,
                y:148,
                lit:Math.random()>.2,
                flicker:Math.random()*6.28
            });
        }

        this.crows=[];

        for(let i=0;i<7;i++){
            this.crows.push({
                x:Math.random()*MW2*TILE,
                y:
                    20+
                    Math.random()*30,
                dir:
                    Math.random()<.5
                    ?1
                    :-1,
                flapT:0,
                frame:0,
                perched:
                    Math.random()<.3,
                perchX:0,
                perchT:0
            });
        }
    }

    solid(tx,ty){
        if(tx<0||tx>=MW2)
            return true;

        if(ty<0)
            return false;

        if(ty>=MH)
            return false;

        const c=
            this.g[
                ty*MW2+tx
            ];

        if(c===4)
            return this.gate.open<.85;

        if(c===5){
            const p=
                this.planks[
                    tx-74
                ];

            return !!p&&
                !p.falling&&
                !p.gone;
        }

        return c>=1&&c<=3;
    }

    getClosetAt(px,py){
        for(const c of this.closets){
            const cx=c.x+c.w/2;
            const cy=c.y+c.h/2;

            if(
                Math.abs(px-cx)<
                    c.w/2+20&&
                Math.abs(py-cy)<
                    c.h/2+14
            ){
                return c;
            }
        }

        return null;
    }

    drawDirt(tx,ty,h){
        const x=tx*10;
        const y=ty*10;
        const g=ctx;

        g.fillStyle="#2a1a0e";

        g.fillRect(
            x,
            y,
            10,
            10
        );

        g.fillStyle="#1a0e06";

        if(h%5===0){
            g.fillRect(
                x+(h%8),
                y+((h>>2)%8),
                1,
                1
            );
        }

        if(ty===15){
            g.fillStyle="#3a2818";

            g.fillRect(
                x,
                y,
                10,
                1
            );

            if(h%3===0){
                g.fillRect(
                    x+(h%8),
                    y-1,
                    1,
                    1
                );
            }
        }
    }

    drawGrave(x,gr,t){
        const g=ctx;
        const lean=gr.lean;
        const h=gr.h;

        const y=
            150-h+
            (gr.buried?3:0);

        g.save();

        g.translate(
            x+5,
            150
        );

        g.rotate(
            lean*.02
        );

        g.translate(
            -(x+5),
            -150
        );

        if(gr.type===0){
            g.fillStyle="#4a4a5a";

            g.fillRect(
                x+2,
                y,
                6,
                h
            );

            g.fillRect(
                x+3,
                y-2,
                4,
                2
            );

            g.fillStyle="#5a5a6a";

            g.fillRect(
                x+2,
                y,
                6,
                1
            );

            g.fillStyle="#222";

            g.fillRect(
                x+3,
                y+3,
                4,
                1
            );

            g.fillRect(
                x+4,
                y+5,
                2,
                1
            );
        }else if(gr.type===1){
            g.fillStyle="#4a4a5a";

            g.fillRect(
                x+4,
                y,
                2,
                h
            );

            g.fillRect(
                x+2,
                y+3,
                6,
                2
            );

            g.fillStyle="#5a5a6a";

            g.fillRect(
                x+4,
                y,
                2,
                1
            );
        }else if(gr.type===2){
            g.fillStyle="#3a3a4a";

            g.fillRect(
                x+1,
                y+2,
                8,
                h-2
            );

            g.fillStyle="#4a4a5a";

            g.fillRect(
                x+1,
                y+2,
                8,
                1
            );

            g.fillStyle="#222";

            g.fillRect(
                x+3,
                y+4,
                4,
                1
            );

            g.fillRect(
                x+3,
                y+6,
                3,
                1
            );
        }else if(gr.type===3){
            g.fillStyle="#4a4a5a";

            g.fillRect(
                x+3,
                y,
                4,
                h
            );

            g.fillRect(
                x+2,
                y-1,
                6,
                2
            );

            g.fillStyle="#222";

            g.fillRect(
                x+4,
                y+3,
                2,
                3
            );
        }else{
            g.fillStyle="#3a3a4a";

            g.fillRect(
                x+2,
                y+1,
                6,
                h-1
            );

            g.fillStyle="#4a4a5a";

            g.fillRect(
                x+2,
                y+1,
                6,
                1
            );

            g.fillStyle="#222";

            g.fillRect(
                x+3,
                y+2,
                4,
                1
            );

            g.fillRect(
                x+3,
                y+4,
                3,
                1
            );

            g.fillRect(
                x+3,
                y+6,
                4,
                1
            );
        }

        if(gr.crack){
            g.fillStyle="#111";

            g.fillRect(
                x+4,
                y+2,
                1,
                h-4
            );
        }

        g.restore();
    }

    drawTree(x,tr,t){
        const g=ctx;

        const sway=
            Math.sin(
                t*.02+tr.sway
            )*1.5;

        const h=tr.h;

        g.fillStyle="#1a0e05";

        g.fillRect(
            x+4,
            150-h,
            3,
            h
        );

        g.fillStyle="#2a1810";

        g.fillRect(
            x+5,
            150-h,
            1,
            h
        );

        for(let b=0;b<tr.branches;b++){
            const by=
                150-h+
                8+
                b*8;

            const blen=
                6+b*3;

            const bsway=
                sway*(b+1)*.3;

            g.fillStyle="#1a0e05";

            g.fillRect(
                x+4-blen+
                    Math.round(bsway),
                by,
                blen,
                1
            );

            g.fillRect(
                x+7+
                    Math.round(bsway*.5),
                by-2,
                blen-2,
                1
            );

            if(b%2===0){
                g.fillRect(
                    x+4-blen-2+
                        Math.round(bsway),
                    by-1,
                    2,
                    1
                );
            }else{
                g.fillRect(
                    x+7+blen-3+
                        Math.round(bsway*.5),
                    by-3,
                    2,
                    1
                );
            }
        }

        g.fillRect(
            x+2,
            148,
            2,
            3
        );

        g.fillRect(
            x+7,
            149,
            2,
            2
        );
    }

    drawCandle(c,t){
        const g=ctx;

        g.fillStyle="#ddc";

        g.fillRect(
            c.x,
            c.y,
            2,
            4
        );

        if(c.lit){
            c.flicker+=.1;

            const fh=
                2+
                Math.round(
                    Math.sin(c.flicker)*.5
                );

            g.fillStyle="#ff8";

            g.fillRect(
                c.x,
                c.y-fh,
                2,
                fh
            );

            g.fillStyle="#f60";

            g.fillRect(
                c.x,
                c.y-fh-1,
                2,
                1
            );

            g.fillStyle="#fa0";
            g.globalAlpha=.12;

            g.fillRect(
                c.x-3,
                c.y-5,
                8,
                7
            );

            g.globalAlpha=1;
        }else if(Math.random()<.001){
            c.lit=true;
        }
    }

    drawCryptTile(tx,ty){
        const x=tx*10;
        const y=ty*10;
        const g=ctx;

        g.fillStyle="#555566";

        g.fillRect(
            x,
            y,
            10,
            10
        );

        g.fillStyle="#222";

        g.fillRect(
            x,
            y+9,
            10,
            1
        );

        if(!this.solid(tx,ty-1)){
            g.fillStyle="#777";

            g.fillRect(
                x,
                y,
                10,
                1
            );
        }

        if(ty===14){
            g.fillStyle="#222";

            g.fillRect(
                x+4,
                y+3,
                2,
                4
            );

            g.fillRect(
                x+3,
                y+4,
                4,
                1
            );
        }
    }

    drawCloset(cl,t){
        const g=ctx;
        const x=cl.x;
        const y=cl.y;

        g.fillStyle="#000";
        g.globalAlpha=.4;

        g.fillRect(
            x-2,
            y+cl.h,
            cl.w+4,
            2
        );

        g.globalAlpha=1;

        g.fillStyle="#3a2815";

        g.fillRect(
            x,
            y,
            cl.w,
            cl.h
        );

        g.fillStyle="#4a3520";

        g.fillRect(
            x+1,
            y+1,
            cl.w-2,
            4
        );

        g.fillStyle="#1a0e06";

        g.fillRect(
            x-1,
            y-1,
            cl.w+2,
            1
        );

        g.fillRect(
            x-1,
            y+cl.h,
            cl.w+2,
            1
        );

        g.fillRect(
            x-1,
            y-1,
            1,
            cl.h+2
        );

        g.fillRect(
            x+cl.w,
            y-1,
            1,
            cl.h+2
        );

        const mid=
            x+
            cl.w/2;

        g.fillStyle="#2a1a0c";

        g.fillRect(
            x+2,
            y+2,
            mid-x-2,
            cl.h-4
        );

        g.fillRect(
            mid,
            y+2,
            cl.w-mid-2,
            cl.h-4
        );

        g.fillStyle="#110000";

        g.fillRect(
            mid-1,
            y,
            2,
            cl.h
        );

        g.fillStyle="#da4";

        g.fillRect(
            mid-3,
            y+cl.h/2-1,
            2,
            3
        );

        g.fillRect(
            mid+1,
            y+cl.h/2-1,
            2,
            3
        );

        if(cl.occupied){
            g.fillStyle="#fa4";
            g.globalAlpha=
                .4+
                .2*Math.sin(t*.15);

            g.fillRect(
                x+2,
                y+2,
                1,
                cl.h-4
            );

            g.fillRect(
                x+cl.w-3,
                y+2,
                1,
                cl.h-4
            );

            g.globalAlpha=1;
        }
    }

    drawPit(t){
        const g=ctx;

        g.fillStyle="#555";

        g.fillRect(
            740,
            150,
            2,
            30
        );

        g.fillRect(
            948,
            150,
            2,
            30
        );

        g.fillStyle="#000";

        for(let y=152;y<180;y+=4){
            g.fillRect(
                740,
                y,
                2,
                1
            );

            g.fillRect(
                948,
                y+2,
                2,
                1
            );
        }
    }

    drawBridge(t){
        const g=ctx;

        g.fillStyle="#555";

        g.fillRect(
            730,
            126,
            4,
            24
        );

        g.fillRect(
            956,
            126,
            4,
            24
        );

        for(const p of this.planks){
            if(p.gone)
                continue;

            const x=p.tx*10;

            let y=
                150+
                p.oy;

            if(
                this.cracked&&
                ((t+p.tx*7)%40)<3
            ){
                y+=1;
            }

            g.fillStyle="#554433";

            g.fillRect(
                x,
                y,
                10,
                3
            );

            g.fillStyle="#776655";

            g.fillRect(
                x,
                y,
                10,
                1
            );

            g.fillStyle="#110800";

            g.fillRect(
                x+9,
                y,
                1,
                3
            );
        }
    }

    drawGate(t){
        const gt=this.gate;
        const g=ctx;

        g.fillStyle="#444";

        g.fillRect(
            1466,
            94,
            14,
            58
        );

        g.fillRect(
            1498,
            94,
            14,
            58
        );

        g.fillStyle="#555";

        g.fillRect(
            1465,
            90,
            16,
            4
        );

        g.fillRect(
            1497,
            90,
            16,
            4
        );

        g.fillStyle="#666";

        g.fillRect(
            1471,
            82,
            4,
            4
        );

        g.fillRect(
            1503,
            82,
            4,
            4
        );

        const off=
            gt.open*gt.h;

        const py=
            gt.y-off;

        g.save();

        g.beginPath();

        g.rect(
            gt.x,
            gt.y,
            gt.w,
            gt.h
        );

        g.clip();

        g.fillStyle="#333";

        for(
            let bx=gt.x+1;
            bx<gt.x+gt.w;
            bx+=2
        ){
            g.fillRect(
                bx,
                py,
                1,
                gt.h
            );
        }

        g.fillRect(
            gt.x,
            py+12,
            gt.w,
            2
        );

        g.fillRect(
            gt.x,
            py+36,
            gt.w,
            2
        );

        g.restore();
    }

    drawCrow(cr,t,cam){
        if(cr.perched){
            cr.perchT++;

            if(
                cr.perchT>300&&
                Math.random()<.01
            ){
                cr.perched=false;
                cr.perchT=0;
                cr.dir=
                    Math.random()<.5
                    ?1
                    :-1;
            }

            return;
        }

        cr.x+=cr.dir*.5;
        cr.flapT++;

        if(cr.flapT>6){
            cr.flapT=0;
            cr.frame=
                (cr.frame+1)%4;
        }

        if(cr.x>cam+W+60)
            cr.x=cam-40;

        if(cr.x<cam-60)
            cr.x=cam+W+40;

        const sx=
            Math.round(
                cr.x-cam
            );

        const sy=
            Math.round(
                cr.y+
                Math.sin(
                    t*.05+
                    cr.x*.01
                )*3
            );

        ctx.fillStyle="#111";

        ctx.fillRect(
            sx,
            sy,
            3,
            2
        );

        ctx.fillRect(
            sx+
                (
                    cr.dir>0
                    ?3
                    :-1
                ),
            sy-1,
            2,
            2
        );

        const wy=[
            0,
            -2,
            -1,
            0
        ][cr.frame];

        ctx.fillRect(
            sx-2,
            sy+wy,
            2,
            1
        );

        ctx.fillRect(
            sx+3,
            sy+wy,
            2,
            1
        );
    }

    drawStars(cam,t){
        for(let i=0;i<70;i++){
            const wx=i*97+13;

            const sx=
                (
                    (
                        wx-cam*.08
                    )%
                    (W+20)
                    +
                    W+20
                )%
                (W+20)-10;

            const sy=
                8+
                hash(i,300)%70;

            const blink=
                .35+
                .65*
                (
                    .5+
                    .5*
                    Math.sin(
                        t*.03+i
                    )
                );

            ctx.globalAlpha=blink;
            ctx.fillStyle="#8899bb";

            ctx.fillRect(
                Math.round(sx),
                sy,
                1,
                1
            );
        }

        ctx.globalAlpha=1;
    }

    drawClouds(cam,t){
        for(let i=0;i<6;i++){
            const wx=i*170+30;

            const sx=
                (
                    (
                        wx-cam*.12
                    )%
                    (W+100)
                    +
                    W+100
                )%
                (W+100)-50;

            const sy=
                38+
                (i%3)*18;

            ctx.globalAlpha=.08;
            ctx.fillStyle="#8990a8";

            ctx.fillRect(
                Math.round(sx),
                sy,
                50,
                4
            );

            ctx.fillRect(
                Math.round(sx+10),
                sy-3,
                35,
                4
            );

            ctx.fillRect(
                Math.round(sx+25),
                sy-5,
                20,
                4
            );
        }

        ctx.globalAlpha=1;
    }

    drawGrass(cam,t){
        const x0=
            Math.max(
                0,
                Math.floor(cam/TILE)-2
            );

        const x1=
            Math.min(
                MW2-1,
                Math.floor((cam+W)/TILE)+2
            );

        for(let tx=x0;tx<=x1;tx++){
            const h=hash(tx,600);

            if(h%3===0){
                const x=
                    tx*10+
                    ((h>>4)%8);

                ctx.fillStyle="#172014";

                const sway=
                    Math.round(
                        Math.sin(
                            t*.025+tx
                        )
                    );

                ctx.fillRect(
                    x,
                    146,
                    1,
                    4
                );

                ctx.fillRect(
                    x+1+sway,
                    144,
                    1,
                    5
                );
            }
        }
    }

    drawGroundDetails(cam,t){
        const x0=
            Math.max(
                0,
                Math.floor(cam/TILE)-1
            );

        const x1=
            Math.min(
                MW2-1,
                Math.floor((cam+W)/TILE)+1
            );

        for(let tx=x0;tx<=x1;tx++){
            const x=tx*10;
            const h=hash(tx,900);

            if(h%8===0){
                ctx.fillStyle="#30261d";

                ctx.fillRect(
                    x+2,
                    146,
                    4,
                    2
                );

                ctx.fillStyle="#40352b";

                ctx.fillRect(
                    x+3,
                    145,
                    2,
                    1
                );
            }

            if(h%6===0){
                ctx.fillStyle="#20150d";

                ctx.fillRect(
                    x+1,
                    151,
                    6,
                    1
                );
            }

            if(h%11===0){
                ctx.fillStyle="#322016";

                ctx.fillRect(
                    x+3,
                    154,
                    5,
                    1
                );
            }
        }
    }

    drawForegroundFog(cam,t){
        for(let i=0;i<7;i++){
            const fx=
                ((i*73+t*.35)%(W+120))-60;

            const fy=
                140+i*5;

            ctx.globalAlpha=
                .05+
                .015*(i%3);

            ctx.fillStyle="#9aa0ad";

            ctx.fillRect(
                Math.round(fx),
                fy,
                60+hash(i,450)%35,
                3
            );
        }

        ctx.globalAlpha=1;
    }

    draw(cam,t){
        const x0=
            Math.max(
                0,
                Math.floor(cam/TILE)-1
            );

        const x1=
            Math.min(
                MW2-1,
                Math.floor((cam+W)/TILE)+1
            );

        const skyGrad=
            ctx.createLinearGradient(
                0,
                0,
                0,
                130
            );

        skyGrad.addColorStop(
            0,
            "#010108"
        );

        skyGrad.addColorStop(
            .3,
            "#060614"
        );

        skyGrad.addColorStop(
            .6,
            "#0c0c22"
        );

        skyGrad.addColorStop(
            1,
            "#161630"
        );

        ctx.fillStyle=skyGrad;

        ctx.fillRect(
            0,
            0,
            W,
            130
        );

        this.drawStars(cam,t);
        this.drawClouds(cam,t);

        const mx=
            Math.round(
                260-cam*.04
            );

        ctx.fillStyle="#aabbcc";
        ctx.globalAlpha=.06;

        for(let yy=-22;yy<=22;yy++){
            const ww=
                Math.floor(
                    Math.sqrt(
                        484-yy*yy
                    )
                );

            if(ww>0){
                ctx.fillRect(
                    mx-ww,
                    25+yy,
                    ww*2,
                    1
                );
            }
        }

        ctx.globalAlpha=1;
        ctx.fillStyle="#eef";

        for(let yy=-11;yy<=11;yy++){
            const ww=
                Math.floor(
                    Math.sqrt(
                        121-yy*yy
                    )
                );

            ctx.fillRect(
                mx-ww,
                25+yy,
                ww*2,
                1
            );
        }

        /* colinas */
        for(let x=0;x<W;x+=2){
            const wx=x+cam*.2;

            const h1=
                Math.floor(
                    12+
                    8*Math.sin(wx*.008)+
                    4*Math.sin(wx*.015+1)
                );

            ctx.fillStyle="#0a0a18";

            ctx.fillRect(
                x,
                105-h1,
                2,
                h1+5
            );
        }

        for(let x=0;x<W;x+=2){
            const wx=x+cam*.4;

            const h2=
                Math.floor(
                    7+
                    5*Math.sin(wx*.017)+
                    3*Math.sin(wx*.009+2)
                );

            ctx.fillStyle="#12121f";

            ctx.fillRect(
                x,
                112-h2,
                2,
                h2+5
            );
        }

        /* árvores distantes */
        for(let i=0;i<8;i++){
            const btx=
                (
                    i*45+
                    10-
                    cam*.3
                )%
                (W+40)-20;

            const bh=
                20+
                hash(i,55)%15;

            ctx.fillStyle="#0a0a12";

            ctx.fillRect(
                Math.round(btx),
                108-bh,
                2,
                bh
            );

            ctx.fillRect(
                Math.round(btx)-3,
                108-bh+5,
                4,
                1
            );

            ctx.fillRect(
                Math.round(btx)+2,
                108-bh+8,
                3,
                1
            );
        }

        /* neblina */
        ctx.globalAlpha=.15;
        ctx.fillStyle="#334";

        for(let i=0;i<6;i++){
            const fx=
                (
                    i*80+
                    t*.2+
                    cam*.1
                )%
                (W+100)-50;

            const fw=
                50+
                hash(i,77)%30;

            ctx.fillRect(
                Math.round(fx),
                130+i*3,
                fw,
                3
            );
        }

        ctx.globalAlpha=1;

        /* chão */
        for(let tx=x0;tx<=x1;tx++){
            for(let ty=15;ty<18;ty++){
                if(
                    this.g[
                        ty*MW2+tx
                    ]===1
                ){
                    this.drawDirt(
                        tx,
                        ty,
                        hash(tx,ty)
                    );
                }
            }
        }

        this.drawGroundDetails(
            cam,
            t
        );

        this.drawGrass(
            cam,
            t
        );

        /* cercas */
        for(const f of this.fences){
            const fx0=f.x0*10;
            const fx1=f.x1*10;

            if(
                fx1<cam-20||
                fx0>cam+W+20
            )continue;

            ctx.fillStyle="#2a1a0a";

            for(
                let x=fx0;
                x<=fx1;
                x+=6
            ){
                ctx.fillRect(
                    x,
                    136,
                    1,
                    14
                );
            }

            ctx.fillRect(
                fx0,
                140,
                fx1-fx0,
                1
            );

            ctx.fillStyle="#3a2a1a";

            ctx.fillRect(
                fx0,
                139,
                fx1-fx0,
                1
            );
        }

        /* túmulos */
        for(const gr of this.graves){
            const x=gr.tx*10;

            if(
                x<cam-20||
                x>cam+W+20
            )continue;

            this.drawGrave(
                x,
                gr,
                t
            );
        }

        /* árvores */
        for(const tr of this.trees){
            const x=tr.tx*10;

            if(
                x<cam-40||
                x>cam+W+40
            )continue;

            this.drawTree(
                x,
                tr,
                t
            );
        }

        /* velas */
        for(const c of this.candles){
            if(
                c.x<cam-10||
                c.x>cam+W+10
            )continue;

            this.drawCandle(
                c,
                t
            );
        }

        /* criptas */
        for(let tx=x0;tx<=x1;tx++){
            for(let ty=12;ty<=14;ty++){
                if(
                    this.g[
                        ty*MW2+tx
                    ]===3
                ){
                    this.drawCryptTile(
                        tx,
                        ty
                    );
                }
            }
        }

        /* armários */
        for(const cl of this.closets){
            this.drawCloset(
                cl,
                t
            );
        }

        this.drawPit(t);
        this.drawBridge(t);
        this.drawGate(t);

        for(const cr of this.crows){
            this.drawCrow(
                cr,
                t,
                cam
            );
        }

        ctx.globalAlpha=.1;
        ctx.fillStyle="#445";

        for(let i=0;i<4;i++){
            const fx=
                (
                    i*100+
                    t*.3
                )%
                (W+120)-60;

            ctx.fillRect(
                Math.round(fx),
                155+i*4,
                70+hash(i,99)%30,
                2
            );
        }

        ctx.globalAlpha=1;

        this.drawForegroundFog(
            cam,
            t
        );
    }
}


/* =========================================================
   PLAYER
========================================================= */

class Player{
    constructor(map,x,y){
        this.map=map;
        this.x=x;
        this.y=y;
        this.w=10;
        this.h=14;
        this.vx=0;
        this.vy=0;
        this.ground=false;
        this.face=1;
        this.frame=0;
        this.animMs=0;
        this.state="idle";
        this.blinkIn=
            1800+
            Math.random()*2000;
        this.blinking=0;
        this.coyote=0;
        this.jbuf=0;
        this.stepT=0;
        this.hiding=false;
        this.hideCloset=null;
        this.breathT=0;
        this.hurtT=0;
        this.squash=1;
        this.landT=0;
    }

    get cx(){
        return this.x+
            this.w/2;
    }

    get cy(){
        return this.y+
            this.h/2;
    }

    hitV(px,pyTop){
        const tx=
            Math.floor(
                px/TILE
            );

        const a=
            Math.floor(
                pyTop/TILE
            );

        const b=
            Math.floor(
                (
                    pyTop+
                    this.h/2
                )/TILE
            );

        const c=
            Math.floor(
                (
                    pyTop+
                    this.h-
                    .01
                )/TILE
            );

        return(
            this.map.solid(tx,a)||
            this.map.solid(tx,b)||
            this.map.solid(tx,c)
        );
    }

    hitH(py,pxL){
        const ty=
            Math.floor(
                py/TILE
            );

        const a=
            Math.floor(
                pxL/TILE
            );

        const b=
            Math.floor(
                (
                    pxL+
                    this.w/2
                )/TILE
            );

        const c=
            Math.floor(
                (
                    pxL+
                    this.w-
                    .01
                )/TILE
            );

        return(
            this.map.solid(a,ty)||
            this.map.solid(b,ty)||
            this.map.solid(c,ty)
        );
    }

    hideIn(closet){
        this.hiding=true;
        this.hideCloset=closet;
        closet.occupied=true;

        this.x=
            closet.x+
            closet.w/2-
            this.w/2;

        this.y=
            closet.y+
            closet.h-
            this.h-
            2;

        this.vx=0;
        this.vy=0;
    }

    unhide(){
        if(this.hideCloset){
            this.hideCloset.occupied=false;
            this.hideCloset=null;
        }

        this.hiding=false;
    }

    update(inp,dt){
        this.breathT+=dt;

        if(this.hurtT>0)
            this.hurtT-=dt;

        if(this.landT>0)
            this.landT--;

        this.squash+=
            (
                1-this.squash
            )*.15;

        if(this.hiding)
            return;

        const target=
            (inp.right?1:0)-
            (inp.left?1:0);

        this.vx+=
            (
                target*1.35-
                this.vx
            )*.35;

        if(Math.abs(this.vx)<.05)
            this.vx=0;

        if(target>0)
            this.face=1;

        if(target<0)
            this.face=-1;

        if(this.jbuf>0)
            this.jbuf--;

        if(this.coyote>0)
            this.coyote--;

        if(
            this.jbuf>0&&
            (
                this.ground||
                this.coyote>0
            )
        ){
            this.vy=-4.45;
            this.ground=false;
            this.coyote=0;
            this.jbuf=0;
            this.squash=.7;

            game.sound.jumpS();

            game.particles.puff(
                this.cx,
                this.y+this.h,
                4
            );
        }

        if(
            !inp.jump&&
            this.vy<-1.6
        ){
            this.vy=-1.6;
        }

        this.vy+=.22;

        if(this.vy>5)
            this.vy=5;

        this.x+=this.vx;

        if(this.vx>0){
            if(
                this.hitV(
                    this.x+this.w,
                    this.y
                )
            ){
                this.x=
                    Math.floor(
                        (
                            this.x+
                            this.w
                        )/TILE
                    )*TILE-
                    this.w-
                    .01;

                this.vx=0;
            }
        }else if(this.vx<0){
            if(
                this.hitV(
                    this.x,
                    this.y
                )
            ){
                this.x=
                    (
                        Math.floor(
                            this.x/TILE
                        )+1
                    )*
                    TILE+
                    .01;

                this.vx=0;
            }
        }

        if(this.x<10)
            this.x=10;

        if(
            this.x>
            this.map.mw*TILE-
            10-
            this.w
        ){
            this.x=
                this.map.mw*TILE-
                10-
                this.w;
        }

        const wasAir=
            !this.ground;

        this.y+=this.vy;
        this.ground=false;

        if(this.vy>0){
            if(
                this.hitH(
                    this.y+this.h,
                    this.x
                )
            ){
                this.y=
                    Math.floor(
                        (
                            this.y+
                            this.h
                        )/TILE
                    )*TILE-
                    this.h-
                    .01;

                this.vy=0;
                this.ground=true;

                if(wasAir){
                    this.squash=1.3;
                    this.landT=8;

                    game.sound.landS();

                    game.particles.puff(
                        this.cx,
                        this.y+this.h,
                        6
                    );

                    game.particles.dust(
                        this.cx,
                        this.y+this.h,
                        4
                    );

                    game.camera.shake(
                        2,
                        5
                    );
                }
            }
        }else if(this.vy<0){
            if(
                this.hitH(
                    this.y,
                    this.x
                )
            ){
                this.y=
                    (
                        Math.floor(
                            this.y/TILE
                        )+1
                    )*
                    TILE+
                    .01;

                this.vy=0;
            }
        }

        if(this.ground)
            this.coyote=7;

        this.animMs+=dt;

        if(this.animMs>=100){
            this.animMs-=100;
            this.frame=
                (this.frame+1)%8;
        }

        if(this.blinking>0){
            this.blinking-=dt;
        }else{
            this.blinkIn-=dt;

            if(this.blinkIn<=0){
                this.blinking=140;

                this.blinkIn=
                    2200+
                    Math.random()*2600;
            }
        }

        this.state=
            !this.ground
            ?"jump"
            :(
                Math.abs(this.vx)>.25
                ?"walk"
                :"idle"
            );

        if(this.state==="walk"){
            this.stepT+=dt;

            if(this.stepT>230){
                this.stepT=0;

                game.sound.stepS(
                    this.frame%2
                );

                game.particles.dust(
                    this.cx,
                    this.y+this.h,
                    1
                );
            }
        }
    }

    draw(){
        const g=game.ghost;
        let img;

        if(this.hiding){
            img=
                g.frames.hide[
                    Math.floor(
                        this.breathT/300
                    )%3
                ];

            drawSpr(
                img,
                this.x-3,
                this.y-4,
                this.face<0
            );

            return;
        }

        if(this.state==="jump"){
            const jf=
                this.vy<0
                ?this.frame%3
                :3+
                    this.frame%3;

            img=
                g.frames.jump[
                    Math.min(
                        jf,
                        g.frames.jump.length-1
                    )
                ];
        }else if(this.state==="walk"){
            img=
                this.blinking>0
                ?g.blinkWalk
                :g.frames.walk[
                    this.frame%
                    g.frames.walk.length
                ];
        }else{
            img=
                this.blinking>0
                ?g.blinkIdle
                :g.frames.idle[
                    this.frame%
                    g.frames.idle.length
                ];
        }

        const bob=
            this.state==="idle"
            ?[0,-1,-1,0,0,-1][
                this.frame%6
            ]
            :
            this.state==="walk"
            ?[0,-1,0,-1,0,-1,0,-1][
                this.frame%8
            ]
            :0;

        ctx.fillStyle="#000";
        ctx.globalAlpha=
            this.ground?.35:.15;

        const shW=
            Math.round(
                this.w*this.squash
            );

        ctx.fillRect(
            Math.round(
                this.cx-shW/2
            ),
            Math.round(
                this.y+this.h
            ),
            shW,
            2
        );

        ctx.globalAlpha=1;

        if(
            this.hurtT>0&&
            Math.floor(
                this.hurtT/50
            )%2===0
        ){
            ctx.globalAlpha=.5;
        }

        ctx.save();

        ctx.translate(
            Math.round(this.cx),
            Math.round(
                this.y+this.h
            )
        );

        ctx.scale(
            2-this.squash,
            this.squash
        );

        ctx.translate(
            -Math.round(this.cx),
            -Math.round(
                this.y+this.h
            )
        );

        drawSpr(
            img,
            this.x-3,
            this.y-2+bob,
            this.face<0
        );

        ctx.restore();

        ctx.globalAlpha=1;

        ctx.fillStyle="#fff";
        ctx.globalAlpha=.05;

        ctx.fillRect(
            Math.round(this.x-3),
            Math.round(this.y-2),
            this.w+6,
            this.h+4
        );

        ctx.globalAlpha=1;
    }
}

    buildSkel(){
        const SK_A=[
            "...WWWWWW...",
            "...WWWWWW...",
            "...W0WW0W...",
            "...W0W0W0...",
            "....WWWW....",
            ".....WW.....",
            "..WWWWWWWW..",
            "..W.WWWW.W..",
            "..W.WWWW.W..",
            "....WWWW....",
            "....WWWW....",
            "....W..W....",
            "....W..W....",
            "...W....W...",
            "...W....W...",
            "..WW....WW.."
        ];

        const SK_B=[
            "...WWWWWW...",
            "...WWWWWW...",
            "...W0WW0W...",
            "...W0W0W0...",
            "....WWWW....",
            ".....WW.....",
            "..WWWWWWWW..",
            "..W.WWWW.W..",
            "..W.WWWW.W..",
            "....WWWW....",
            "....WWWW....",
            ".....WW.....",
            "....WWWW....",
            "....W..W....",
            "....W..W....",
            "...WW..WW..."
        ];

        const SK_ATK=[
            "...WWWWWW...",
            "...WWWWWW...",
            "...W0WW0W...",
            "...W0W0W0...",
            "....WWWW....",
            ".....WW.....",
            "..WWWWWWWW..",
            "WWWWWWWWWWWW",
            "WWWWWWWWWWWW",
            "....WWWW....",
            "....WWWW....",
            "....W..W....",
            "...W....W...",
            "..W......W..",
            "..W......W..",
            ".WW......WW."
        ];

        const mk=(rows,col)=>{
            const c=
                document.createElement(
                    "canvas"
                );

            c.width=12;
            c.height=16;

            const g=c.getContext("2d");

            for(let y=0;y<16;y++){
                for(let x=0;x<12;x++){
                    const ch=
                        rows[y][x];

                    if(ch==="W"){
                        g.fillStyle=col;

                        g.fillRect(
                            x,
                            y,
                            1,
                            1
                        );
                    }else if(ch==="0"){
                        g.fillStyle="#000";

                        g.fillRect(
                            x,
                            y,
                            1,
                            1
                        );
                    }
                }
            }

            return c;
        };

        this.skel={
            w1:mk(SK_A,"#dde"),
            w2:mk(SK_B,"#dde"),
            atk:mk(SK_ATK,"#dde"),
            r1:mk(SK_A,"#f66"),
            r2:mk(SK_B,"#f66"),
            ratk:mk(SK_ATK,"#f66")
        };
    }

    bindInput(){
        addEventListener(
            "keydown",
            e=>{
                if([
                    "Space",
                    "ArrowUp",
                    "ArrowDown",
                    "ArrowLeft",
                    "ArrowRight"
                ].indexOf(e.code)>=0){
                    e.preventDefault();
                }

                this.sound.unlock();

                if(e.repeat){
                    this.keys[e.code]=true;
                    return;
                }

                this.keys[e.code]=true;
                this.pressedObj[e.code]=true;
            }
        );

        addEventListener(
            "keyup",
            e=>{
                this.keys[e.code]=false;
            }
        );

        addEventListener(
            "blur",
            ()=>{
                this.keys={};
                this.touches=[];
            }
        );

        canvas.addEventListener(
            "pointerdown",
            e=>{
                e.preventDefault();

                this.sound.unlock();

                const p=this.toXY(e);

                if(this.state==="gameover"){
                    this.gameoverTap(p);
                    return;
                }

                if(
                    this.toastCur&&
                    this.state==="game"
                ){
                    this.toastCur=null;
                    return;
                }

                if(this.state==="intro"){
                    this.skipIntro();
                    return;
                }

                if(this.state==="game"){
                    if(
                        this.dialog&&
                        this.dialog.active
                    ){
                        this.advDialog();
                        return;
                    }

                    if(
                        this.isTouch&&
                        p.x>290&&
                        p.y<16
                    ){
                        this.toMenu();
                        return;
                    }

                    this.touches.push({
                        id:e.pointerId,
                        x:p.x,
                        y:p.y
                    });

                    return;
                }

                if(this.state==="menu"){
                    this.menuTap(p);
                    return;
                }

                if(this.state==="settings"){
                    this.setTap(p);
                    return;
                }

                if(this.state==="director"){
                    this.sound.back();
                    this.toMenu();
                    return;
                }

                if(this.state==="escaped"){
                    this.sound.confirm();
                    this.toMenu();
                    return;
                }

                if(this.state==="ghostIntro"){
                    if(this.ghostIntro.t>30)
                        this.startGame();

                    return;
                }
            },
            {
                passive:false
            }
        );

        canvas.addEventListener(
            "pointermove",
            e=>{
                const p=this.toXY(e);

                for(const t of this.touches){
                    if(t.id===e.pointerId){
                        t.x=p.x;
                        t.y=p.y;
                    }
                }
            }
        );

        const up=e=>{
            this.touches=
                this.touches.filter(
                    t=>t.id!==e.pointerId
                );
        };

        canvas.addEventListener(
            "pointerup",
            up
        );

        canvas.addEventListener(
            "pointercancel",
            up
        );

        canvas.addEventListener(
            "touchstart",
            e=>e.preventDefault(),
            {
                passive:false
            }
        );

        canvas.addEventListener(
            "contextmenu",
            e=>e.preventDefault()
        );
    }

    toXY(e){
        const r=
            canvas.getBoundingClientRect();

        return{
            x:
                (e.clientX-r.left)*
                W/r.width,

            y:
                (e.clientY-r.top)*
                H/r.height
        };
    }

    inRect(p,b){
        return(
            p.x>=b.x&&
            p.x<=b.x+b.w&&
            p.y>=b.y&&
            p.y<=b.y+b.h
        );
    }

    menuTap(p){
        for(let i=0;i<3;i++){
            if(
                this.inRect(
                    p,
                    {
                        x:90,
                        y:88+i*22,
                        w:140,
                        h:18
                    }
                )
            ){
                if(this.menu.sel!==i)
                    this.sound.click();

                this.menu.sel=i;
                this.menuActivate();
                return;
            }
        }
    }

    setTap(p){
        for(let i=0;i<3;i++){
            if(
                this.inRect(
                    p,
                    {
                        x:60,
                        y:64+i*26,
                        w:200,
                        h:20
                    }
                )
            ){
                this.menu.setSel=i;
                this.setActivate();
                return;
            }
        }
    }

    gameoverTap(p){
        if(
            this.inRect(
                p,
                {
                    x:60,
                    y:115,
                    w:200,
                    h:18
                }
            )
        ){
            this.retryLevel();
            return;
        }

        if(
            this.inRect(
                p,
                {
                    x:60,
                    y:138,
                    w:200,
                    h:18
                }
            )
        ){
            this.toMenu();
            return;
        }
    }

    menuActivate(){
        this.sound.confirm();

        const s=this.menu.sel;

        if(s===0){
            this.state="ghostIntro";

            this.ghostIntro={
                active:true,
                t:0,
                assembled:false
            };

            this.sound.assembleS();
        }else if(s===1){
            this.state="settings";
            this.menu.setSel=0;
        }else{
            this.state="director";
        }
    }

    setActivate(){
        const s=this.menu.setSel;

        if(s===0){
            this.sound.setMusic(
                !this.sound.musicOn
            );

            this.sound.click();
        }else if(s===1){
            this.sound.confirm();
            this.toggleFS();
        }else{
            this.sound.back();
            this.toMenu();
        }
    }

    toggleFS(){
        const d=document.documentElement;

        try{
            if(document.fullscreenElement){
                document.exitFullscreen();
            }else{
                (
                    d.requestFullscreen||
                    d.webkitRequestFullscreen
                ).call(d);
            }
        }catch(e){}
    }

    toMenu(){
        this.state="menu";

        this.sound.setIntense(false);
        this.sound.setGameMode(false);

        this.toastCur=null;
        this.toastQ=[];

        this.fadeAlpha=1;
        this.fadeDir=-1;

        this.camera.cinematic(false);
        this.camera.targetZoom=1;
    }

    skipIntro(){
        if(this.state==="intro"){
            this.state="menu";
            this.sound.setGameMode(false);
        }

    toast(txt){
        this.toastQ.push(txt);

    openDialog(lines){
        const wrapped=[];

        for(const ln of lines){
            for(const w of wrapText(ln,28)){
                wrapped.push(w);
            }
        }

        const pages=[];

        for(let i=0;i<wrapped.length;i+=3){
            pages.push(
                wrapped.slice(i,i+3)
            );
        }

        this.dialog={
            active:true,
            pages,
            page:0,
            n:0
        };

        this.sound.messageBeep();
    }

    advDialog(){
        const d=this.dialog;

        if(!d||!d.active)
            return;

        const pl=
            d.pages[d.page];

        const total=
            pl.reduce(
                (a,l)=>a+l.length,
                0
            );

        if(d.n<total){
            d.n=total;
            this.sound.typeS();
        }else{
            d.page++;
            d.n=0;

            if(
                d.page>=
                d.pages.length
            ){
                d.active=false;
                this.sound.click();
            }else{
                this.sound.typeS();
            }
        }
    }

    updDialog(P){
        if(!this.dialog.active)
            return false;

        const d=this.dialog;
        const pl=
            d.pages[d.page];

        if(pl){
            const total=
                pl.reduce(
                    (a,l)=>a+l.length,
                    0
                );

            if(d.n<total){
                d.n+=.7;

                if(
                    Math.floor(d.n)%4===0
                ){
                    this.sound.typeS();
                }
            }

            if(P.ok||P.act)
                this.advDialog();
        }

        return true;
    }
