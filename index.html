<script>
"use strict";
const W=320,H=180,TILE=10,MW=88,MH=18,MW2=128;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let RK=1;

function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  const cssW=Math.max(1,Math.floor(W*s)),cssH=Math.max(1,Math.floor(H*s));
  RK=Math.max(1,Math.min(4,Math.ceil(s*(window.devicePixelRatio||1))));
  canvas.width=W*RK;canvas.height=H*RK;
  ctx.setTransform(RK,0,0,RK,0,0);
  ctx.imageSmoothingEnabled=false;
  canvas.style.width=cssW+'px';
  canvas.style.height=cssH+'px';
}
addEventListener('resize',fit);
document.addEventListener('fullscreenchange',fit);
fit();

function hash(x,y){let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);n=Math.imul(n^(n>>>13),1274126177);return(n^(n>>>16))>>>0;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rng(a,b){return a+Math.random()*(b-a);}
function wrapText(str,max){
  const words=String(str).split(' '),out=[];let cur='';
  for(let w of words){
    const t=cur?cur+' '+w:w;
    if(t.length<=max)cur=t;
    else{
      if(cur)out.push(cur);
      if(w.length>max){while(w.length>max){out.push(w.slice(0,max));w=w.slice(max);}cur=w;}
      else cur=w;
    }
  }
  out.push(cur);return out;
}

const FONT={

'C':["0111","1000","1000","1000","0111"],'D':["1110","1001","1001","1001","1110"],
'E':["1111","1000","1110","1000","1111"],'F':["1111","1000","1110","1000","1000"],
'G':["0111","1000","1011","1001","0111"],'H':["1001","1001","1111","1001","1001"],
'I':["1110","0100","0100","0100","1110"],'J':["0111","0010","0010","1010","0100"],
'K':["1001","1010","1100","1010","1001"],'L':["1000","1000","1000","1000","1111"],
'M':["1001","1111","1111","1001","1001"],'N':["1001","1101","1011","1001","1001"],
'O':["0110","1001","1001","1001","0110"],'P':["1110","1001","1110","1000","1000"],
'Q':["0110","1001","1001","1010","0101"],'R':["1110","1001","1110","1010","1001"],
'S':["0111","1000","0110","0001","1110"],'T':["1111","0110","0110","0110","0110"],
'U':["1001","1001","1001","1001","0110"],'V':["1001","1001","1001","1010","0100"],
'W':["1001","1001","1111","1111","1001"],'X':["1001","1001","0110","1001","1001"],
'Y':["1010","1010","0100","0100","0100"],'Z':["1111","0001","0110","1000","1111"],
'0':["0110","1001","1001","1001","0110"],'1':["0100","1100","0100","0100","1110"],
'2':["1110","0001","0110","1000","1111"],'3':["1110","0001","0110","0001","1110"],
'4':["1001","1001","1111","0001","0001"],'5':["1111","1000","1110","0001","1110"],
'6':["0110","1000","1110","1001","0110"],'7':["1111","0001","0010","0100","0100"],
'8':["0110","1001","0110","1001","0110"],'9':["0110","1001","0111","0001","0110"],
' ':["0000","0000","0000","0000","0000"],':':["0000","0100","0000","0100","0000"],
'!':["0100","0100","0100","0000","0100"],'.':["0000","0000","0000","0000","0100"],
'-':["0000","0000","1110","0000","0000"],'>':["1000","0100","0010","0100","1000"],
'<':["0010","0100","1000","0100","0010"],'/':["0001","0010","0100","1000","0000"],
'?':["1110","0001","0110","0000","0100"],'+':["0000","0100","1110","0100","0000"]
};
function textW(s,sc){return s.length?(s.length*5-1)*sc:0;}
function drawText(s,x,y,sc,col,align,g){
  g=g||ctx;
  if(align==='center')x-=textW(s,sc)/2;else if(align==='right')x-=textW(s,sc);
  x=Math.round(x);y=Math.round(y);
  g.fillStyle=col;
  for(let i=0;i<s.length;i++){
    const gl=FONT[s[i]];if(!gl)continue;
    for(let r=0;r<5;r++){const bits=gl[r];
      for(let b=0;b<4;b++)if(bits.charCodeAt(b)===49)g.fillRect(x+i*5*sc+b*sc,y+r*sc,sc,sc);
    }
  }
}
function drawTextSh(s,x,y,sc,col,align){
  drawText(s,x+sc,y+sc,sc,'#000000',align);
  drawText(s,x,y,sc,col,align);
}
function textSources(text,sc,x,y){
  const w=textW(text,sc),h=5*sc;
  const oc=document.createElement('canvas');oc.width=w;oc.height=h;
  const o=oc.getContext('2d');
  drawText(text,0,0,sc,'#FFFFFF','left',o);
  const d=o.getImageData(0,0,w,h).data,out=[];
  for(let cx=0;cx<w;cx++){
    for(let cy=h-1;cy>=0;cy--){
      if(d[(cy*w+cx)*4+3]>0){if(Math.random()<0.16)out.push({x:x+cx,y:y+cy+1});break;}
    }
  }
  return out;
}

class ParticleSystem{
  constructor(){this.particles=[];this.maxParticles=800;this.fogParticles=[];this.leafParticles=[];}
  add(p){if(this.particles.length<this.maxParticles)this.particles.push(p);}
  addFog(p){if(this.fogParticles.length<60)this.fogParticles.push(p);}
  addLeaf(p){if(this.leafParticles.length<40)this.leafParticles.push(p);}
  puff(x,y,n,col){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,s=rng(0.5,2.5);
      this.add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rng(0.5,2),
        life:rng(20,45),maxLife:45,size:rng(1,3),col:col||'#AAAAAA',gravity:0.04,type:'puff'});
    }
  }
  burst(x,y,n,col){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,s=rng(1,4);
      this.add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rng(1,3),
        life:rng(25,55),maxLife:55,size:rng(1,3),
        col:col||(Math.random()<0.5?'#FFFFFF':'#AAAAAA'),gravity:0.06,type:'burst'});
    }
  }
  bones(x,y,n){
    for(let i=0;i<n;i++){
      this.add({x,y,vx:rng(-2.5,2.5),vy:rng(-4,-1),life:rng(30,60),maxLife:60,
        size:rng(1,2),col:Math.random()<0.7?'#FFFFFF':'#DDDDDD',
        gravity:0.12,rotation:Math.random()*Math.PI*2,rotSpeed:rng(-0.2,0.2),type:'bone'});
    }
  }
  sparkle(x,y,n,col){
    for(let i=0;i<n;i++){
      this.add({x:x+rng(-8,8),y:y+rng(-8,8),vx:rng(-0.8,0.8),vy:rng(-1.5,-0.3),
        life:rng(15,35),maxLife:35,size:rng(1,2),col:col||'#FFFFFF',gravity:-0.02,
        type:'sparkle',pulse:Math.random()*Math.PI*2});
    }
  }
  invisTrail(x,y){
    this.add({x:x+rng(-6,6),y:y+rng(-4,4),vx:rng(-0.3,0.3),vy:rng(-0.8,-0.2),
      life:rng(20,35),maxLife:35,size:rng(1,2),col:'#88CCFF',gravity:-0.01,
      type:'sparkle',pulse:Math.random()*Math.PI*2});
  }
  dust(x,y,n){
    for(let i=0;i<n;i++){
      this.add({x:x+rng(-5,5),y:y+rng(-2,2),vx:rng(-0.3,0.3),vy:rng(-0.5,-0.1),
        life:rng(40,80),maxLife:80,size:1,col:'#666666',gravity:-0.01,type:'dust'});
    }
  }
  blood(x,y,n){
    for(let i=0;i<n;i++){
      const a=rng(-Math.PI*0.8,-Math.PI*0.2);
      this.add({x,y,vx:Math.cos(a)*rng(1,3),vy:Math.sin(a)*rng(1,3),
        life:rng(30,70),maxLife:70,size:rng(1,3),col:'#CC0000',gravity:0.15,type:'blood'});
    }
  }
  smoke(x,y,n){
    for(let i=0;i<n;i++){
      this.add({x:x+rng(-3,3),y,vx:rng(-0.3,0.3),vy:rng(-1,-0.4),
        life:rng(50,100),maxLife:100,size:rng(2,5),col:'#333333',
        gravity:-0.02,type:'smoke',alpha:0.6});
    }
  }
  deathBurst(x,y){
    for(let i=0;i<40;i++){
      const a=Math.random()*Math.PI*2,s=rng(2,6);
      this.add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rng(2,5),
        life:rng(40,90),maxLife:90,size:rng(1,5),
        col:i%4===0?'#CC0000':(i%4===1?'#FF3333':(i%4===2?'#FFFFFF':'#888888')),
        gravity:0.12,type:'death'});
    }
  }
  assemble(x,y,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,s=rng(3,6);
      this.add({x:x+Math.cos(a)*40,y:y+Math.sin(a)*40,
        vx:-Math.cos(a)*s*0.1,vy:-Math.sin(a)*s*0.1,
        life:rng(40,80),maxLife:80,size:rng(2,4),col:'#FFFFFF',gravity:0,type:'assemble'});
    }
  }
  fog(cam,t){
    for(let i=0;i<3;i++){
      const x=cam+Math.random()*W,y=rng(100,140);
      this.addFog({x,y,vx:rng(0.2,0.5),size:rng(15,30),alpha:rng(0.08,0.15),life:rng(200,400),maxLife:400});
    }
  }
  leaves(cam,t){
    if(Math.random()<0.15){
      const x=cam+W+10,y=rng(60,130);
      this.addLeaf({x,y,vx:rng(-1.5,-0.5),vy:rng(0.3,0.8),rotation:Math.random()*Math.PI*2,
        rotSpeed:rng(-0.1,0.1),size:rng(2,4),life:rng(150,300),maxLife:300,
        color:Math.random()<0.6?'#8B4513':(Math.random()<0.5?'#A0522D':'#654321')});
    }
  }
  ember(x,y,n){
    for(let i=0;i<n;i++){
      this.add({x,y,vx:rng(-0.5,0.5),vy:rng(-1.5,-0.5),
        life:rng(30,60),maxLife:60,size:rng(1,2),
        col:Math.random()<0.5?'#FF6600':'#FFAA00',gravity:-0.03,type:'ember'});
    }
  }
  update(){
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity||0;p.life--;
      if(p.rotation!==undefined)p.rotation+=p.rotSpeed||0;
      if(p.pulse!==undefined)p.pulse+=0.15;
      if(p.type==='smoke')p.alpha*=0.97;
      if(p.life<=0)this.particles.splice(i,1);
    }
    for(let i=this.fogParticles.length-1;i>=0;i--){
      const f=this.fogParticles[i];
      f.x+=f.vx;f.life--;
      if(f.life<=0)this.fogParticles.splice(i,1);
    }
    for(let i=this.leafParticles.length-1;i>=0;i--){
      const l=this.leafParticles[i];
      l.x+=l.vx;l.y+=l.vy;l.rotation+=l.rotSpeed;l.vy+=0.02;l.life--;
      if(l.life<=0||l.x<-50)this.leafParticles.splice(i,1);
    }
  }
  draw(cam){
    for(const p of this.particles){
      const alpha=clamp(p.life/p.maxLife,0,1);
      const sx=Math.round(p.x-cam),sy=Math.round(p.y);
      if(sx<-10||sx>W+10)continue;
      ctx.globalAlpha=alpha*(p.alpha||1);
      ctx.fillStyle=p.col;
      const sz=Math.ceil(p.size*alpha);
      if(p.type==='sparkle'){
        const pulse=0.5+0.5*Math.sin(p.pulse||0);
        ctx.globalAlpha=alpha*pulse;
        ctx.fillRect(sx,sy,sz,sz);
        if(sz>1){ctx.fillRect(sx-1,sy+Math.floor(sz/2),1,1);ctx.fillRect(sx+sz,sy+Math.floor(sz/2),1,1);}
      }else if(p.type==='bone'&&p.rotation!==undefined){
        ctx.save();ctx.translate(sx,sy);ctx.rotate(p.rotation);
        ctx.fillRect(-sz/2,-1,sz,2);ctx.restore();
      }else if(p.type==='assemble'){
        const progress=1-alpha;
        ctx.globalAlpha=alpha;
        ctx.fillRect(sx,sy,sz,sz);
        if(sz>2){
          ctx.globalAlpha=alpha*0.5;
          ctx.fillRect(sx-1,sy,sz+2,sz);
          ctx.fillRect(sx,sy-1,sz,sz+2);
        }
      }else if(p.type==='ember'){
        ctx.globalAlpha=alpha;
        ctx.fillRect(sx,sy,sz,sz);
        if(Math.random()<0.1){
          ctx.globalAlpha=alpha*0.5;
          ctx.fillRect(sx-1,sy+1,sz+2,sz);
        }
      }else{
        ctx.fillRect(sx,sy,sz,sz);
      }
    }
    ctx.globalAlpha=1;
    // Draw fog particles
    for(const f of this.fogParticles){
      const alpha=clamp(f.life/f.maxLife,0,1)*f.alpha;
      const sx=Math.round(f.x-cam);
      if(sx<-50||sx>W+50)continue;
      ctx.globalAlpha=alpha;
      ctx.fillStyle='#8899aa';
      const sz=Math.ceil(f.size*alpha);
      for(let i=0;i<3;i++){
        ctx.fillRect(sx+i*8-f.size/2,f.y-i*4,sz*2,sz);
      }
    }
    // Draw leaf particles
    for(const l of this.leafParticles){
      const alpha=clamp(l.life/l.maxLife,0,1);
      const sx=Math.round(l.x-cam),sy=Math.round(l.y);
      if(sx<-20||sx>W+20)continue;
      ctx.globalAlpha=alpha;
      ctx.fillStyle=l.color||'#8B4513';
      ctx.save();
      ctx.translate(sx,sy);
      ctx.rotate(l.rotation);
      ctx.fillRect(-l.size/2,-1,l.size,2);
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
}

class Sound{
  constructor(){
    this.ctx=null;this.ok=false;this.musicOn=true;this.inGame=false;this.intense=false;
    this.step=0;this.nextT=0;this.bar=0;this.bpm=95;
    this.ambStep=0;this.ambNextT=0;
    this.tryLoad();
  }
  tryLoad(){try{const v=localStorage.getItem('os_music');if(v!==null)this.musicOn=v==='1';}catch(e){}}
  unlock(){
    if(this.ok){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return;}
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    try{this.ctx=new A();}catch(e){return;}
    const c=this.ctx;
    this.master=c.createGain();this.master.gain.value=0.7;this.master.connect(c.destination);
    this.comp=c.createDynamicsCompressor();
    this.comp.threshold.value=-18;this.comp.knee.value=20;
    this.comp.ratio.value=4;this.comp.attack.value=0.003;this.comp.release.value=0.15;
    this.comp.connect(this.master);
    this.mus=c.createGain();this.mus.gain.value=this.musicOn?0.85:0;
    this.mus.connect(this.comp);
    this.ambMus=c.createGain();this.ambMus.gain.value=0;
    this.ambMus.connect(this.comp);
    this.sfxG=c.createGain();this.sfxG.gain.value=1.3;
    this.sfxG.connect(this.master);
    this.ambG=c.createGain();this.ambG.gain.value=0.7;
    this.ambG.connect(this.master);
    this.ok=true;this.nextT=c.currentTime+0.15;this.ambNextT=c.currentTime+0.15;
  }
  setMusic(v){
    this.musicOn=v;
    try{localStorage.setItem('os_music',v?'1':'0');}catch(e){}
    if(this.ok){
      this.mus.gain.setTargetAtTime((v&&!this.inGame)?0.85:0,this.ctx.currentTime,0.15);
    }
  }
  setGameMode(inGame){
    this.inGame=inGame;
    if(!this.ok)return;
    const t=this.ctx.currentTime;
    this.mus.gain.setTargetAtTime((this.musicOn&&!inGame)?0.85:0,t,0.3);
    this.ambMus.gain.setTargetAtTime(inGame?0.18:0,t,0.3);
  }
  setIntense(v){this.intense=v;}
  tick(){
    if(!this.ok)return;
    const c=this.ctx;if(c.state!=='running')return;
    const beatLen=60/this.bpm;
    const sixteenth=beatLen/4;
    if(!this.inGame&&this.musicOn){
      if(this.nextT<c.currentTime-0.5)this.nextT=c.currentTime+0.1;
      while(this.nextT<c.currentTime+0.8){
        this.schedBeat(this.step,this.nextT);
        this.step=(this.step+1)%64;
        if(this.step===0)this.bar++;
        this.nextT+=sixteenth;
      }
    }
    if(this.inGame){
      const ambSix=beatLen/2;
      if(this.ambNextT<c.currentTime-0.5)this.ambNextT=c.currentTime+0.1;
      while(this.ambNextT<c.currentTime+0.8){
        this.schedAmbient(this.ambStep,this.ambNextT);
        this.ambStep=(this.ambStep+1)%32;
        this.ambNextT+=ambSix;
      }
    }
  }
  schedBeat(s,t){
    if(s%16===0){
      const chordProg=[[220,277.18,329.63],[196,246.94,293.66],[246.94,311.13,369.99],[174.61,220,261.63]];
      const chord=chordProg[this.bar%4];
      this.atmosphericPad(chord,t);
    }
    if(s%4===0){
      const notes=[440,523.25,587.33,659.25,783.99,659.25,587.33,523.25];
      const note=notes[(s/4)%notes.length];
      this.arpeggio(note,t);
    }
    if(s%16===0){
      const bassNotes=[110,98,116.54,82.41];
      this.ambientBass(bassNotes[Math.floor(s/16)%bassNotes.length],t);
    }
    if(s%8===0)this.softPerc(t);
    if(s%16===4)this.softPerc(t,0.06);
  }
  schedAmbient(s,t){
    const c=this.ctx;
    if(s===0){
      const o=c.createOscillator(),o2=c.createOscillator();
      const g=c.createGain();
      const flt=c.createBiquadFilter();
      o.type='sine';o.frequency.value=55;
      o2.type='sine';o2.frequency.value=82.41;
      flt.type='lowpass';flt.frequency.value=200;flt.Q.value=1;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.08,t+0.5);
      g.gain.setValueAtTime(0.08,t+3.5);
      g.gain.exponentialRampToValueAtTime(0.001,t+4);
      o.connect(flt);o2.connect(flt);flt.connect(g);g.connect(this.ambMus);
      o.start(t);o2.start(t);o.stop(t+4.1);o2.stop(t+4.1);
    }
    if(s%8===0){
      const buf=c.createBuffer(1,c.sampleRate*2,c.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.05;
      const n=c.createBufferSource();n.buffer=buf;
      const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=300;
      const g=c.createGain();g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.04,t+0.3);
      g.gain.exponentialRampToValueAtTime(0.001,t+2);
      n.connect(f);f.connect(g);g.connect(this.ambMus);
      n.start(t);n.stop(t+2);
    }
    if(s%16===8){
      const o=c.createOscillator();
      const g=c.createGain();
      o.type='sine';o.frequency.value=36.7;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.06,t+0.4);
      g.gain.exponentialRampToValueAtTime(0.001,t+2);
      o.connect(g);g.connect(this.ambMus);
      o.start(t);o.stop(t+2);
    }
  }
  atmosphericPad(notes,t){
    const c=this.ctx;
    for(const f of notes){
      const o=c.createOscillator(),o2=c.createOscillator();
      const g=c.createGain();
      const flt=c.createBiquadFilter();
      o.type='sine';o.frequency.value=f;
      o2.type='sine';o2.frequency.value=f*1.005;
      flt.type='lowpass';flt.frequency.value=800;flt.Q.value=2;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.04,t+0.3);
      g.gain.setValueAtTime(0.04,t+1.8);
      g.gain.exponentialRampToValueAtTime(0.001,t+2.5);
      o.connect(flt);o2.connect(flt);flt.connect(g);g.connect(this.mus);
      o.start(t);o2.start(t);o.stop(t+2.6);o2.stop(t+2.6);
    }
  }
  arpeggio(f,t){
    const c=this.ctx;
    const o=c.createOscillator();
    const g=c.createGain();
    const flt=c.createBiquadFilter();
    o.type='sine';o.frequency.value=f*2;
    flt.type='lowpass';flt.frequency.value=1200;flt.Q.value=3;
    g.gain.setValueAtTime(0,t);

class Ghost{
  constructor(){
    this.pal={'1':'#FFFFFF','2':'#E8E8E8','3':'#B8B8B8','4':'#000000'};
    this.base=[
      "0000000000000000","0000011111100000","0001111111111000","0011111111111100",
      "0111111111111110","0111111111111110","0111111111111110","0111111111111110",
      "0111111111111110","0111111111111110","0111111111111110","0111111111111110",
      "0111111111111110","0111111111111110"];
    this.frames={idle:[],walk:[],jump:[],hide:[],pieces:[]};
    this.build();
  }
  compose(o){
    const rows=this.base.map(r=>r.split(''));
    const dx=o.dx||0,cols=[4+dx,5+dx,10+dx,11+dx];
    const put=(r,c,v)=>{if(c>=0&&c<16)rows[r][c]=v;};
    if(o.wide){[5,6,7].forEach(r=>cols.forEach(c=>put(r,c,'4')));}
    else if(o.blink){cols.forEach(c=>put(7,c,'4'));}
    else{[6,7].forEach(r=>cols.forEach(c=>put(r,c,'4')));}
    cols.forEach(c=>put(8,c,'3'));
    if(o.mouth==='o'){put(10,7,'4');put(10,8,'4');put(11,7,'4');put(11,8,'4');}
    else{put(10,7,'4');put(10,8,'4');}
    for(let r=4;r<=12;r++)put(r,13,'2');
    const out=rows.map(r=>r.join(''));
    out.push(o.tail);out.push(o.r15||"0000000000000000");
    return out;
  }
  mk(rows){
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    for(let y=0;y<16;y++){const r=rows[y];
      for(let x=0;x<16;x++){const ch=r[x];
        if(ch!=='0'){g.fillStyle=this.pal[ch];g.fillRect(x,y,1,1);}}}
    return c;
  }
  build(){
    const T1="0111011101110110",T2="0110111011101100",T3="0111011011101110",T4="0101101101101010";
    const TJ="0111111111111110",TJ2="0011001100110000",TJ3="0101010101010101";
    const TW1="0110111011101110",TW2="0101011101110101",TW3="0111011011010111";
    const m=o=>this.mk(this.compose(o));
    this.frames.idle=[m({tail:T1}),m({tail:T2}),m({tail:T3}),m({tail:T2}),m({tail:T4}),m({tail:T1})];
    this.blinkIdle=m({tail:T1,blink:true});
    this.frames.walk=[
      m({tail:T1,dx:1}),m({tail:T2,dx:0}),m({tail:T3,dx:-1}),m({tail:T2,dx:0}),
      m({tail:T1,dx:-1}),m({tail:TW1,dx:0}),m({tail:TW2,dx:1}),m({tail:TW3,dx:0})
    ];
    this.blinkWalk=m({tail:T2,dx:1,blink:true});
    this.frames.jump=[
      m({tail:TJ,mouth:'o',wide:true}),m({tail:TJ2,mouth:'o',wide:true}),
      m({tail:TJ3,mouth:'o'}),m({tail:TJ}),m({tail:TJ2}),m({tail:T1})
    ];
    this.frames.hide=[this.mkHide(0),this.mkHide(1),this.mkHide(2)];
    this.frames.pieces=this.mkPieces();
    const rows=this.compose({tail:T1});
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    for(let y=0;y<16;y++){const r=rows[y];
      for(let x=0;x<16;x++){const ch=r[x];
        if(ch==='1'||ch==='2'||ch==='3'){g.fillStyle='#000000';g.fillRect(x,y,1,1);}
        else if(ch==='4'){g.fillStyle='#FFFFFF';g.fillRect(x,y,1,1);}}}
    this.sil=c;
  }
  mkPieces(){
    const pieces=[];
    const positions=[
      {x:0,y:0},{x:5,y:0},{x:10,y:0},
      {x:0,y:5},{x:5,y:5},{x:10,y:5},
      {x:0,y:10},{x:5,y:10},{x:10,y:10}
    ];
    for(let i=0;i<9;i++){
      const c=document.createElement('canvas');c.width=16;c.height=16;
      const g=c.getContext('2d');
      const px=positions[i].x,py=positions[i].y;
      g.fillStyle='#FFFFFF';
      g.fillRect(px,py,5,5);
      g.fillStyle='#CCCCCC';
      g.fillRect(px+1,py+1,3,3);
      pieces.push(c);
    }
    return pieces;
  }
  mkHide(phase){
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    g.fillStyle='#FFFFFF';
    const yOff=phase===1?-1:0;
    for(let yy=6;yy<=13;yy++){
      for(let xx=4;xx<=12;xx++){
        const dist=Math.abs(xx-8)+Math.abs(yy-9.5+yOff);
        if(dist<5)g.fillRect(xx,yy,1,1);
      }
    }
    g.fillStyle='#000000';
    g.fillRect(6,8+yOff,1,1);g.fillRect(9,8+yOff,1,1);
    return c;
  }
}
function drawSpr(img,x,y,flip){

}

class Drips{
  constructor(){this.list=[];this.drops=[];}
  seed(srcs){
    this.list=[];this.drops=[];
    for(const s of srcs)if(Math.random()<0.6)
      this.list.push({x:s.x,y:s.y,len:0,max:8+Math.random()*26,sp:0.05+Math.random()*0.1,wait:(Math.random()*220)|0});
  }
  update(){
    for(const d of this.list){
      if(d.wait>0){d.wait--;continue;}
      d.len+=d.sp;
      if(d.len>=d.max){
        this.drops.push({x:d.x,y:d.y+d.len,vy:0.25+Math.random()*0.3});
        d.len=2+Math.random()*3;d.max=8+Math.random()*26;d.sp=0.04+Math.random()*0.09;
      }
    }
    for(const p of this.drops){p.vy=Math.min(p.vy+0.02,1);p.y+=p.vy;}
    this.drops=this.drops.filter(p=>p.y<184);
  }
  draw(col,w){
    ctx.fillStyle=col;
    for(const d of this.list){if(d.wait>0||d.len<=0)continue;ctx.fillRect(d.x,d.y,w,Math.ceil(d.len));}
    for(const p of this.drops)ctx.fillRect(p.x,p.y,w,w);
  }
}

    for(let i=0;i<this.graves.length;i++){

        g.fillStyle='#222233'; // rachaduras

        g.fillStyle='#666677';g.fillRect(x+4,128,2,4);
        g.fillRect(x+4,128,2,1);
        g.fillStyle='#777788';g.fillRect(x+4,128,2,1);
        g.fillStyle='#444455';g.fillRect(x+2,150,6,2);
        g.fillStyle='#222233';g.fillRect(x+4,140,2,3);
        // Inscrição especial

      // Pequenos detalhes no chão ao redor da lápide

    // Mãos surgindo do chão (aleatórias)
    for(let i=0;i<5;i++){

      g.fillStyle='#eeddbb';g.fillRect(cx,cy,2,1);

    for(const f of this.deadFlowers){

      g.fillStyle='#886655';
      g.fillRect(fx,fy-1,3,2);
      g.fillStyle='#aa8877';
      g.fillRect(fx,fy-1,1,1);
      g.fillRect(fx+2,fy-1,1,1);
      g.fillStyle='#664433';
      g.fillRect(fx+1,fy-2,1,1);
    }
    
    this.drawMausoleum(t);
    
    for(let tx=x0;tx<=x1;tx++){
      const h=hash(tx,88);
      const py=148+(h%2);
      if(tx%3===0){
        g.fillStyle='#554433';
        g.fillRect(tx*10,py,8,2);
        g.fillStyle='#665544';
        g.fillRect(tx*10,py,8,1);
      }
    }
    
    for(let tx=x0;tx<=x1;tx++)for(let ty=15;ty<18;ty++){
      if(this.g[ty*MW2+tx]===1)this.drawDirt(tx,ty);
    }
    for(let tx=x0;tx<=x1;tx++){
      const h=hash(tx,99);
      if(h%19===0&&!(tx>=63&&tx<=85)){
        g.fillStyle='#776655';
        g.fillRect(tx*10+(h%7),148,2,1);
      }
      if(h%23===0&&!(tx>=63&&tx<=85)){
        g.fillStyle='#665544';
        g.fillRect(tx*10+(h%8),149,1,1);
      }
      if(h%17===0&&!(tx>=63&&tx<=85)){
        g.fillStyle='#554433';
        g.fillRect(tx*10+(h%6),147,1,1);
      }
    }
    for(let tx=x0;tx<=x1;tx++)for(let ty=12;ty<=14;ty++){

    for(const cl of this.closets)this.drawCloset(cl,t);
    this.drawPit(t);this.drawBridge(t);this.drawGate(t);
    
    for(const cr of this.crows){
      cr.x+=cr.dir*0.3;

      if(cr.frame===1){
        g.fillRect(sx-3,sy-2,2,1);
        g.fillRect(sx+4,sy-2,2,1);
      }else if(cr.frame===3){
        g.fillRect(sx-3,sy+1,2,1);
        g.fillRect(sx+4,sy+1,2,1);
      }
      g.fillStyle='#aa6633';
      g.fillRect(sx+(cr.dir>0?5:-2),sy,1,1);
    }
  }
  drawDirt(tx,ty){
    const x=tx*10,y=ty*10,h=hash(tx,ty),g=ctx;
    g.fillStyle='#3a2818';g.fillRect(x,y,10,10);
    g.fillStyle='#2a1a0a';
    g.fillRect(x+(h%8),y+((h>>2)%8),1,1);

      g.fillStyle='#554433';g.fillRect(x,y,10,1);
      if(h%3===0)g.fillRect(x+(h%8),y-1,1,1);
    }

  drawCryptTile(tx,ty){
    const x=tx*10,y=ty*10,g=ctx;
    g.fillStyle='#666677';g.fillRect(x,y,10,10);
    g.fillStyle='#222233';g.fillRect(x,y+9,10,1);
    if(!this.solid(tx,ty-1)){g.fillStyle='#8888aa';g.fillRect(x,y,10,1);}
    if(ty===14){g.fillStyle='#222233';g.fillRect(x+4,y+3,2,4);g.fillRect(x+3,y+4,4,1);}
    g.fillStyle='#555566';g.fillRect(x+1,y+1,1,1);g.fillRect(x+8,y+1,1,1);

  drawCloset(cl,t){
    const g=ctx,x=cl.x,y=cl.y;
    g.fillStyle='#000000';g.globalAlpha=0.4;

    const mid=x+cl.w/2;
    g.fillStyle='#443311';g.fillRect(x+2,y+2,mid-x-2,cl.h-4);
    g.fillStyle='#554422';g.fillRect(x+3,y+3,mid-x-4,cl.h-6);
    g.fillStyle='#332211';
    g.fillRect(x+4,y+4,mid-x-6,10);
    g.fillRect(x+4,y+cl.h-14,mid-x-6,10);
    g.fillStyle='#443311';g.fillRect(mid,y+2,cl.w-mid-2,cl.h-4);
    g.fillStyle='#554422';g.fillRect(mid+1,y+3,cl.w-mid-4,cl.h-6);
    g.fillStyle='#332211';
    g.fillRect(mid+2,y+4,cl.w-mid-6,10);
    g.fillRect(mid+2,y+cl.h-14,cl.w-mid-6,10);
    g.fillStyle='#110000';g.fillRect(mid-1,y,2,cl.h);
    g.fillStyle='#ddaa44';
    g.fillRect(mid-3,y+cl.h/2-1,2,3);
    g.fillRect(mid+1,y+cl.h/2-1,2,3);
    g.fillStyle='#ffdd88';
    g.fillRect(mid-3,y+cl.h/2-1,1,1);
    g.fillRect(mid+1,y+cl.h/2-1,1,1);
    if(cl.occupied){
      g.fillStyle='#ffaa44';g.globalAlpha=0.4+0.2*Math.sin(t*0.15);
      g.fillRect(x+2,y+2,1,cl.h-4);
      g.fillRect(x+cl.w-3,y+2,1,cl.h-4);
      g.fillRect(mid-1,y+2,1,cl.h-4);
      g.globalAlpha=1;
    }
    if(game&&game.player&&!cl.occupied&&game.level===2&&!game.player.hiding){
      const dist=Math.hypot((x+cl.w/2)-game.player.cx,(y+cl.h/2)-game.player.cy);
      if(dist<35){
        const blink=((t>>3)%2)===0;
        if(blink){
          const bx=x+cl.w/2-7,by=y-14;
          g.fillStyle='#000000';g.fillRect(bx,by,14,10);
          g.fillStyle='#FFFFFF';
          g.fillRect(bx,by,14,1);g.fillRect(bx,by+9,14,1);
          g.fillRect(bx,by,1,10);g.fillRect(bx+13,by,1,10);
          g.fillRect(x+cl.w/2-1,by+10,2,2);
          drawText('E',bx+5,by+2,1,'#FFFFFF');

      }
    }
  }
  drawMausoleum(t){
    const g=ctx;
    for(let yy=83;yy<92;yy++){const ww=(92-yy)*3;g.fillStyle='#666677';g.fillRect(30-ww,yy,ww*2,1);}

    g.fillStyle='#444455';g.fillRect(0,92,60,1);

    g.fillStyle='#8888aa';g.fillRect(0,92,60,1);
    g.fillStyle='#111122';g.fillRect(20,112,20,38);
    g.fillStyle='#8888aa';
    g.fillRect(18,110,2,40);g.fillRect(40,110,2,40);g.fillRect(18,110,24,2);

  drawPit(t){
    const g=ctx;
    g.fillStyle='#666677';
    g.fillRect(640,150,2,30);g.fillRect(848,150,2,30);

  drawGate(t){
    const gt=this.gate,g=ctx;

    g.fillRect(1198,94,14,58);
    g.fillStyle='#666677';
    g.fillRect(1166,94,14,1);
    g.fillRect(1198,94,14,1);

    g.fillRect(1197,90,16,4);

    g.fillRect(1200,86,10,4);
    g.fillStyle='#888899';
    g.fillRect(1171,82,4,4);
    g.fillRect(1203,82,4,4);
    g.fillStyle='#aaaaaa';
    g.fillRect(1172,82,2,1);
    g.fillRect(1204,82,2,1);
    g.fillStyle='#444455';

      for(let i=0;i<6;i++){
        const px=gt.x+3+((hash(i,Math.floor(t/9))%14)),py=gt.y+((t+i*11)%48);
        g.fillRect(px,py,1,1);
      }
    }
    const off=gt.open*gt.h,py=gt.y-off;
    g.save();g.beginPath();g.rect(gt.x,gt.y,gt.w,gt.h);g.clip();
    g.fillStyle='#333344';
    for(let bx=gt.x+1;bx<gt.x+gt.w;bx+=2){
      g.fillRect(bx,py,1,gt.h);
      g.fillRect(bx,py-3,1,3);
      g.fillRect(bx-1,py-4,3,1);
    }
    g.fillStyle='#222233';
    g.fillRect(gt.x,py+12,gt.w,2);
    g.fillRect(gt.x,py+36,gt.w,2);
    g.fillRect(gt.x,py,gt.w,1);
    g.fillStyle='#444455';
    g.fillRect(gt.x+gt.w/2-3,py+22,6,4);
    g.fillRect(gt.x+gt.w/2-2,py+20,4,1);
    g.fillRect(gt.x+gt.w/2-2,py+27,4,1);
    g.restore();
    const lampOn=gt.open<1&&((t%30)<15);
    g.fillStyle='#666677';g.fillRect(1186,80,8,6);
    g.fillStyle=lampOn?'#88ff88':'#444455';g.fillRect(1189,82,2,2);
  }
}

class Player{
  constructor(map,x,y){
    this.map=map;this.x=x;this.y=y;this.w=10;this.h=14;
    this.vx=0;this.vy=0;this.ground=false;this.face=1;
    this.frame=0;this.animMs=0;this.state='idle';
    this.blinkIn=1800+Math.random()*2000;this.blinking=0;
    this.coyote=0;this.jbuf=0;this.stepT=0;
    this.hiding=false;this.hideCloset=null;
    this.breathT=0;this.hurtT=0;
  }
  get cx(){return this.x+this.w/2;}
  get cy(){return this.y+this.h/2;}
  hitV(px,pyTop){
    const tx=Math.floor(px/TILE);
    const a=Math.floor(pyTop/TILE),b=Math.floor((pyTop+this.h/2)/TILE),c=Math.floor((pyTop+this.h-0.01)/TILE);
    return this.map.solid(tx,a)||this.map.solid(tx,b)||this.map.solid(tx,c);
  }
  hitH(py,pxL){
    const ty=Math.floor(py/TILE);
    const a=Math.floor(pxL/TILE),b=Math.floor((pxL+this.w/2)/TILE),c=Math.floor((pxL+this.w-0.01)/TILE);
    return this.map.solid(a,ty)||this.map.solid(b,ty)||this.map.solid(c,ty);
  }
  hideIn(closet){
    this.hiding=true;this.hideCloset=closet;closet.occupied=true;
    this.x=closet.x+closet.w/2-this.w/2;
    this.y=closet.y+closet.h-this.h-2;
    this.vx=0;this.vy=0;
  }
  unhide(){
    if(this.hideCloset){this.hideCloset.occupied=false;this.hideCloset=null;}
    this.hiding=false;
  }
  update(inp,dt){
    this.breathT+=dt;
    if(this.hurtT>0)this.hurtT-=dt;
    if(this.hiding)return;
    const target=(inp.right?1:0)-(inp.left?1:0);
    this.vx+=(target*1.35-this.vx)*0.35;
    if(Math.abs(this.vx)<0.05)this.vx=0;
    if(target>0)this.face=1;if(target<0)this.face=-1;
    if(this.jbuf>0)this.jbuf--;
    if(this.coyote>0)this.coyote--;
    if(this.jbuf>0&&(this.ground||this.coyote>0)){
      this.vy=-4.45;this.ground=false;this.coyote=0;this.jbuf=0;
      game.sound.jumpS();game.particles.puff(this.cx,this.y+this.h,4);
    }
    if(!inp.jump&&this.vy<-1.6)this.vy=-1.6;
    this.vy+=0.22;if(this.vy>5)this.vy=5;
    this.x+=this.vx;
    if(this.vx>0){if(this.hitV(this.x+this.w,this.y)){this.x=Math.floor((this.x+this.w)/TILE)*TILE-this.w-0.01;this.vx=0;}}
    else if(this.vx<0){if(this.hitV(this.x,this.y)){this.x=(Math.floor(this.x/TILE)+1)*TILE+0.01;this.vx=0;}}
    if(this.x<10)this.x=10;
    if(this.x>this.map.mw*TILE-10-this.w)this.x=this.map.mw*TILE-10-this.w;
    const wasAir=!this.ground;
    this.y+=this.vy;this.ground=false;
    if(this.vy>0){
      if(this.hitH(this.y+this.h,this.x)){
        this.y=Math.floor((this.y+this.h)/TILE)*TILE-this.h-0.01;this.vy=0;this.ground=true;
        if(wasAir){game.sound.landS();game.particles.puff(this.cx,this.y+this.h,5);game.particles.dust(this.cx,this.y+this.h,3);}
      }
    }else if(this.vy<0){
      if(this.hitH(this.y,this.x)){this.y=(Math.floor(this.y/TILE)+1)*TILE+0.01;this.vy=0;}
    }
    if(this.ground)this.coyote=7;
    this.animMs+=dt;
    if(this.animMs>=100){this.animMs-=100;this.frame=(this.frame+1)%8;}
    if(this.blinking>0)this.blinking-=dt;
    else{this.blinkIn-=dt;if(this.blinkIn<=0){this.blinking=140;this.blinkIn=2200+Math.random()*2600;}}
    this.state=!this.ground?'jump':(Math.abs(this.vx)>0.25?'walk':'idle');
    if(this.state==='walk'){this.stepT+=dt;if(this.stepT>230){this.stepT=0;game.sound.stepS(this.frame%2);game.particles.dust(this.cx,this.y+this.h,1);}}
  }
  draw(){
    const g=game.ghost;let img;
    if(this.hiding){
      img=g.frames.hide[Math.floor(this.breathT/300)%3];
      drawSpr(img,this.x-3,this.y-4,this.face<0);
      return;
    }
    if(this.state==='jump'){
      const jf=this.vy<0?(this.frame%3):3+(this.frame%3);
      img=g.frames.jump[Math.min(jf,g.frames.jump.length-1)];
    }else if(this.state==='walk'){
      img=this.blinking>0?g.blinkWalk:g.frames.walk[this.frame%g.frames.walk.length];
    }else{
      img=this.blinking>0?g.blinkIdle:g.frames.idle[this.frame%g.frames.idle.length];
    }
    const bob=this.state==='idle'?[0,-1,-1,0,0,-1][this.frame%6]:this.state==='walk'?[0,-1,0,-1,0,-1,0,-1][this.frame%8]:0;
    
    // Sombra melhorada (mais suave e realista)
    const shadowW=this.w+4;
    const shadowAlpha=this.ground?0.35:0.2;
    ctx.fillStyle='#000000';
    ctx.globalAlpha=shadowAlpha;
    ctx.fillRect(Math.round(this.x-2),Math.round(this.y+this.h),shadowW,2);
    ctx.globalAlpha=shadowAlpha*0.5;
    ctx.fillRect(Math.round(this.x-3),Math.round(this.y+this.h+1),shadowW+2,1);
    ctx.globalAlpha=1;
    
    if(this.hurtT>0 && Math.floor(this.hurtT/50)%2===0){
      ctx.globalAlpha=0.5;
    }
    
    // Efeito de brilho sutil no fantasma
    const glowPulse=0.9+0.1*Math.sin(this.breathT*0.003);
    ctx.globalAlpha=(ctx.globalAlpha||1)*glowPulse;
    
    drawSpr(img,this.x-3,this.y-2+bob,this.face<0);
    ctx.globalAlpha=1;
    
    // Aura suave ao redor do fantasma
    ctx.fillStyle='#ffffff';
    ctx.globalAlpha=0.08;
    ctx.fillRect(Math.round(this.x-4),Math.round(this.y-3),this.w+8,this.h+6);
    ctx.globalAlpha=1;
  }
}

class Menu{
  constructor(g){
    this.g=g;this.sel=0;this.setSel=0;this.seeded=false;
    this.drips=new Drips();this.parts=[];
    for(let i=0;i<55;i++)this.parts.push({x:Math.random()*W,y:Math.random()*H,sp:0.1+Math.random()*0.25,c:Math.random()<0.5?'#8888aa':'#ccccff',dr:Math.random()*6});
    this.tankT=260;this.tankOn=0;
  }
  enter(){this.sel=0;this.seeded=false;}
  update(){
    for(const p of this.parts){
      p.y+=p.sp;p.x+=Math.sin((this.g.t+p.dr*60)*0.01)*0.1;
      if(p.y>152){p.y=-2;p.x=Math.random()*W;}
    }
    if(this.g.state==='menu'&&!this.seeded){
      this.drips.seed(textSources('OTHER SIDE',4,62,12));this.seeded=true;

    if(this.g.state==='menu')this.drips.update();
    this.tankT--;

    if(this.tankOn>0)this.tankOn--;

  drawBg(t){
    // Fundo do menu melhorado com gradiente

  draw(t){

    ctx.globalAlpha=1;
    
    drawTextSh('OTHER SIDE',62,12,4,'#ffffff');

        ctx.fillStyle='#8888aa';ctx.fillRect(90,y,140,18);
        ctx.fillStyle='#ffffff';ctx.fillRect(92,y+2,136,14);

  drawSettings(t){

    for(let i=0;i<3;i++){

      if(this.setSel===i){
        ctx.fillStyle='#8888aa';ctx.fillRect(60,y,200,20);
        ctx.fillStyle='#ffffff';ctx.fillRect(62,y+2,196,16);
        drawText(rows[i],W/2+4,y+6,2,'#000000','center');
      }else{
        ctx.fillStyle='#444455';
        ctx.fillRect(60,y,200,1);ctx.fillRect(60,y+19,200,1);
        ctx.fillRect(60,y,1,20);ctx.fillRect(259,y,1,20);
        drawText(rows[i],W/2,y+6,2,'#ccccff','center');

  drawDirector(t){

    drawTextSh('DIRECTOR',W/2,16,3,'#ffffff','center');
    const gf=this.g.ghost.frames.idle[Math.floor(t/9)%6];
    const gy=44+Math.sin(t*0.06)*2;
    ctx.globalAlpha=0.9;ctx.drawImage(gf,136,gy,48,48);ctx.globalAlpha=1;
    drawText('UM JOGO DE',W/2,102,1,'#8888aa','center');
    drawTextSh('KLIPZASTUDIO',W/2,112,2,'#ffffff','center');
    drawText('DIRECAO / CODIGO / MUSICA: KLIPZA',W/2,132,1,'#8888aa','center');
    drawText('OBRIGADO POR JOGAR.',W/2,144,1,'#8888aa','center');
    drawText('ENTER: VOLTAR',W/2,170,1,'#666677','center');
  }
}

class Game{
  constructor(){
    this.sound=new Sound();
    this.ghost=new Ghost();
    this.menu=new Menu(this);
    this.isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
    this.state='intro';
    this.level=1;this.escTarget='menu';
    this.intro={phase:0,t:0,load:0,drips:new Drips(),seeded:false,eyes:{t:120,on:false,x:0,y:0}};
    this.keys={};this.pressedObj={};this.touches=[];
    this.prevJ=false;this.prevA=false;this.prevR2=false;this.prevE=false;
    this.t=0;this.acc=0;this.last=0;
    this.toastQ=[];this.toastCur=null;this.toastLines=[];
    this.dialog={active:false,pages:[],page:0,n:0};
    this.skels=[];this.invis={active:0,cd:0,denyT:0};
    this.cine={active:false,t:0,hold:0};
    this.graceT=0;this.alertSndT=0;
    this.particles=new ParticleSystem();
    this.vig=null;
    this.scanlines=null;
    this.btns={l:{x:6,y:138,w:40,h:36},r:{x:50,y:138,w:40,h:36},a:{x:226,y:136,w:40,h:38},j:{x:270,y:130,w:44,h:46},r2:{x:138,y:138,w:42,h:36}};
    this.buildSkel();this.bindInput();
    this.gameover={active:false,reason:'',t:0,particles:[]};
    this.ghostIntro={active:false,t:0,phase:0,assembled:false};
    this.ambientTimer=0;
  }
  buildSkel(){
    const SK_A=[
    "...WWWWWW...","...WWWWWW...","...W0WW0W...","...W0W0W0...",
    "....WWWW....",".....WW.....","..WWWWWWWW..","..W.WWWW.W..",
    "..W.WWWW.W..","....WWWW....","....WWWW....","....W..W....",
    "....W..W....","...W....W...","...W....W...","..WW....WW.."];
    const SK_B=[
    "...WWWWWW...","...WWWWWW...","...W0WW0W...","...W0W0W0...",
    "....WWWW....",".....WW.....","..WWWWWWWW..","..W.WWWW.W..",
    "..W.WWWW.W..","....WWWW....","....WWWW....",".....WW.....",
    "....WWWW....","....W..W....","....W..W....","...WW..WW..."];
    const SK_ATK=[
    "...WWWWWW...","...WWWWWW...","...W0WW0W...","...W0W0W0...",
    "....WWWW....",".....WW.....","..WWWWWWWW..","WWWWWWWWWWWW",
    "WWWWWWWWWWWW","....WWWW....","....WWWW....","....W..W....",
    "...W....W...","..W......W..","..W......W..",".WW......WW."];
    const mk=(rows,col)=>{
      const c=document.createElement('canvas');c.width=12;c.height=16;
      const g=c.getContext('2d');
      for(let y=0;y<16;y++)for(let x=0;x<12;x++){
        const ch=rows[y][x];
        if(ch==='W'){g.fillStyle=col;g.fillRect(x,y,1,1);}
        else if(ch==='0'){g.fillStyle='#000000';g.fillRect(x,y,1,1);}
      }
      return c;
    };
    this.skel={w1:mk(SK_A,'#eeeeff'),w2:mk(SK_B,'#eeeeff'),atk:mk(SK_ATK,'#eeeeff'),
               r1:mk(SK_A,'#ff6666'),r2:mk(SK_B,'#ff6666'),ratk:mk(SK_ATK,'#ff6666')};
  }
  bindInput(){
    addEventListener('keydown',e=>{
      if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0)e.preventDefault();
      this.sound.unlock();
      if(e.repeat){this.keys[e.code]=true;return;}
      this.keys[e.code]=true;this.pressedObj[e.code]=true;
    });
    addEventListener('keyup',e=>{this.keys[e.code]=false;});
    addEventListener('blur',()=>{this.keys={};this.touches=[];});
    canvas.addEventListener('pointerdown',e=>{
      e.preventDefault();this.sound.unlock();
      const p=this.toXY(e);
      if(this.state==='gameover'){this.gameoverTap(p);return;}
      if(this.toastCur&&this.state==='game'){this.toastCur=null;return;}
      if(this.state==='intro'){this.skipIntro();return;}
      if(this.state==='game'){
        if(this.dialog&&this.dialog.active){this.advDialog();return;}
        if(this.isTouch&&p.x>290&&p.y<16){this.toMenu();return;}
        this.touches.push({id:e.pointerId,x:p.x,y:p.y});
        return;
      }
      if(this.state==='menu'){this.menuTap(p);return;}
      if(this.state==='settings'){this.setTap(p);return;}
      if(this.state==='director'){this.sound.back();this.toMenu();return;}
      if(this.state==='escaped'){this.sound.confirm();this.toMenu();return;}
      if(this.state==='ghostIntro'){this.skipGhostIntro();return;}
    },{passive:false});
    canvas.addEventListener('pointermove',e=>{
      const p=this.toXY(e);
      for(const tch of this.touches)if(tch.id===e.pointerId){tch.x=p.x;tch.y=p.y;}
    });
    const up=e=>{this.touches=this.touches.filter(tt=>tt.id!==e.pointerId);};
    canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
    canvas.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
    canvas.addEventListener('contextmenu',e=>e.preventDefault());
  }
  toXY(e){
    const r=canvas.getBoundingClientRect();
    return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
  }
  inRect(p,b){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;}
  menuTap(p){
    for(let i=0;i<3;i++){
      if(this.inRect(p,{x:90,y:88+i*22,w:140,h:18})){
        if(this.menu.sel!==i)this.sound.click();
        this.menu.sel=i;this.menuActivate();return;
      }
    }
  }
  setTap(p){
    for(let i=0;i<3;i++){
      if(this.inRect(p,{x:60,y:64+i*26,w:200,h:20})){
        this.menu.setSel=i;this.setActivate();return;
      }
    }
  }
  gameoverTap(p){
    if(this.inRect(p,{x:60,y:115,w:200,h:18})){
      this.retryLevel();return;
    }
    if(this.inRect(p,{x:60,y:138,w:200,h:18})){
      this.toMenu();return;
    }
  }
  menuActivate(){
    this.sound.confirm();
    const s=this.menu.sel;
    if(s===0)this.startGhostIntro();
    else if(s===1){this.state='settings';this.menu.setSel=0;}
    else this.state='director';
  }
  setActivate(){
    const s=this.menu.setSel;
    if(s===0){this.sound.setMusic(!this.sound.musicOn);this.sound.click();}
    else if(s===1){this.sound.confirm();this.toggleFS();}
    else{this.sound.back();this.toMenu();}
  }
  toggleFS(){
    const d=document.documentElement;
    try{
      if(document.fullscreenElement)document.exitFullscreen();
      else(d.requestFullscreen||d.webkitRequestFullscreen).call(d);
    }catch(e){this.toast('NAO SUPORTADO');}
  }
  toMenu(){
    this.state='menu';this.menu.enter();
    this.sound.setIntense(false);
    this.sound.setGameMode(false);
    this.toastCur=null;this.toastQ=[];
  }
  skipIntro(){if(this.state==='intro'){
    this.state='menu';this.menu.enter();
    this.sound.setGameMode(false);
  }}
  
  startGhostIntro(){
    this.state='ghostIntro';
    this.ghostIntro={active:true,t:0,phase:0,assembled:false};
    this.sound.assembleS();
    this.particles.assemble(W/2,H/2,30);
  }
  skipGhostIntro(){
    if(this.ghostIntro.t<30)return;
    this.startGame();
  }
  
  toast(txt){this.toastQ.push(txt);}
  openDialog(lines){
    const wrapped=[];
    for(const ln of lines)for(const w of wrapText(ln,28))wrapped.push(w);
    const pages=[];
    for(let i=0;i<wrapped.length;i+=3)pages.push(wrapped.slice(i,i+3));
    this.dialog={active:true,pages:pages,page:0,n:0};
    this.sound.messageBeep();
  }
  advDialog(){
    const d=this.dialog;if(!d||!d.active)return;
    const pl=d.pages[d.page];
    const total=pl.reduce((a,l)=>a+l.length,0);
    if(d.n<total){d.n=total;this.sound.typeS();}
    else{
      d.page++;d.n=0;
      if(d.page>=d.pages.length){d.active=false;this.sound.click();}
      else this.sound.typeS();
    }
  }
  updDialog(P){
    if(!this.dialog.active)return false;
    const d=this.dialog,pl=d.pages[d.page];
    if(pl){
      const total=pl.reduce((a,l)=>a+l.length,0);
      if(d.n<total){d.n+=0.7;if(Math.floor(d.n)%4===0)this.sound.typeS();}
      if(P.ok||P.act)this.advDialog();
    }
    return true;
  }
  startGame(){
    this.level=1;
    this.map=new Map();
    this.player=new Player(this.map,32,156);
    this.hasKey=false;this.time=0;this.introT=0;
    this.cam=0;this.shake=0;this.glitch=0;
    this.toastQ=[];this.toastCur=null;
    this.dialog={active:false,pages:[],page:0,n:0};
    this.particles.particles=[];
    this.dust=[];
    this.app={on:false,x:0,t:0,cd:500+Math.random()*400};
    this.bo={on:false,t:500+Math.random()*500};
    this.flick={brokenT:400,on:0};
    this.scarePending=0;
    this.skels=[];this.invis={active:0,cd:0,denyT:0};this.cine={active:false,t:0,hold:0};
    this.sound.setIntense(false);
    this.sound.setGameMode(true);
    this.state='game';
    this.objective='ENCONTRE A CHAVE';
    this.ambientTimer=0;
  }
  retryLevel(){
    this.sound.confirm();
    if(this.level===1)this.startGame();
    else this.startLevel2();
  }
  triggerGameOver(reason){
    this.state='gameover';
    this.gameover.active=true;
    this.gameover.reason=reason;
    this.gameover.t=0;
    this.gameover.particles=[];
    this.sound.deathS();
    this.sound.setIntense(false);
    this.shake=20;this.glitch=15;
    this.particles.deathBurst(this.player.cx,this.player.cy);
    this.particles.blood(this.player.cx,this.player.cy,20);
  }
  puff(x,y,n){this.particles.puff(x,y,n);}
  burst(x,y){this.particles.burst(x,y,14);}
  bones(x,y){this.particles.bones(x,y,10);}
  sparkle(){this.particles.sparkle(this.player.cx,this.player.cy,12,'#88CCFF');}
  openDoor(){
    const d=this.map.door;
    if(d.opening||d.open>=1)return;
    d.opening=true;
    this.sound.openS();
    this.sound.doorCreak();
    this.shake=14;
    this.particles.smoke(d.x+d.w/2,d.y+10,6);
    this.toast('O PORTAO SE ABRIU...');
  }
  doInteract(a){
    if(a.kind==='key'){
      this.map.key.taken=true;this.hasKey=true;
      this.sound.keyS();this.particles.burst(a.x,a.y,16,'#ffff88');
      this.toast('A CHAVE PULSA NA SUA MAO. FUJA.');
      this.sound.setIntense(true);this.glitch=14;
      this.objective='ABRA O PORTAO E FUJA!';
      this.app.cd=Math.min(this.app.cd,140);
    }else if(a.kind==='door'){
      if(!this.hasKey){this.openDialog(['TRANCADO.','PRECISO DA CHAVE.']);this.sound.lockedS();}
      else this.openDoor();
    }else{
      a.read=true;this.openDialog(a.lines);this.sound.typeS();
    }
  }
  doInteract2(){
    if(this.player.hiding){
      this.player.unhide();
      this.sound.unhideS();
      this.particles.dust(this.player.cx,this.player.cy,5);
      return;
    }
    const cl=this.map.getClosetAt(this.player.cx,this.player.cy);
    if(cl&&!cl.occupied){
      this.player.hideIn(cl);
      this.sound.hideS();
      this.particles.dust(cl.x+cl.w/2,cl.y+cl.h,4);
      this.toast('ESCONDIDO!');
    }
  }
  consumePressed(){
    const p=this.pressedObj;
    const P={
      up:p.ArrowUp||p.KeyW,down:p.ArrowDown||p.KeyS,
      ok:p.Enter||p.Space,back:p.Escape,
      jump:p.Space||p.KeyW||p.ArrowUp,act:p.KeyE,
      invis:p.KeyR,
      any:Object.keys(p).length>0
    };
    this.pressedObj={};
    return P;
  }
  touchFlags(){
    const f={l:false,r:false,j:false,a:false,r2:false};
    for(const tch of this.touches){
      const p={x:tch.x,y:tch.y};
      if(this.inRect(p,this.btns.l))f.l=true;
      if(this.inRect(p,this.btns.r))f.r=true;
      if(this.inRect(p,this.btns.j))f.j=true;
      if(this.inRect(p,this.btns.a))f.a=true;
      if(this.inRect(p,this.btns.r2))f.r2=true;
    }
    return f;
  }
  stepF(dt){
    this.t++;
    this.sound.tick();
    this.particles.update();
    const P=this.consumePressed();
    if(this.state==='game'){
      if(this.toastCur&&P.any){
        this.toastCur=null;
        P.ok=false;P.act=false;P.jump=false;P.back=false;P.invis=false;
      }else if(!this.toastCur&&this.toastQ.length&&!(this.dialog&&this.dialog.active)&&!(this.cine&&this.cine.active)){
        const m=this.toastQ.shift();
        this.toastCur=m;this.toastLines=wrapText(m,30);
      }
    }
    switch(this.state){
      case 'intro':this.updIntro(P);break;
      case 'menu':
        this.menu.update();
        if(P.up){this.menu.sel=(this.menu.sel+2)%3;this.sound.click();}
        if(P.down){this.menu.sel=(this.menu.sel+1)%3;this.sound.click();}
        if(P.ok)this.menuActivate();
        break;
      case 'settings':
        this.menu.update();
        if(P.up){this.menu.setSel=(this.menu.setSel+2)%3;this.sound.click();}
        if(P.down){this.menu.setSel=(this.menu.setSel+1)%3;this.sound.click();}
        if(P.ok)this.setActivate();
        if(P.back){this.sound.back();this.toMenu();}
        break;
      case 'director':
        this.menu.update();
        if(P.ok||P.back){this.sound.back();this.toMenu();}
        break;
      case 'game':
        if(this.level===2)this.updGame2(P,dt);else this.updGame(P,dt);
        break;
      case 'gameover':this.updGameOver(P,dt);break;
      case 'escapeAnim':
        this.escT++;this.updAmbient(dt);
        if(this.escT>62){
          if(this.escTarget==='level2')this.startLevel2();
          else{this.state='escaped';this.escSeed=false;}
        }
        break;
      case 'escaped':
        this.updEscaped(P);
        break;
      case 'ghostIntro':
        this.updGhostIntro(P);
        break;
    }
  }
  updGhostIntro(P){
    const gi=this.ghostIntro;
    gi.t++;
    if(gi.t>=60&&gi.t<120){
      if(gi.t%10===0){
        this.particles.assemble(W/2,H/2,5);
      }
    }
    if(gi.t>=120&&!gi.assembled){
      gi.assembled=true;
      gi.phase=2;
      this.sound.confirm();
    }
    if(gi.t>=180||(P.any&&gi.t>30)){
      this.startGame();
    }
  }
  drawGhostIntro(){
    const gi=this.ghostIntro;
    const t=gi.t;
    ctx.fillStyle='#000000';
    ctx.fillRect(0,0,W,H);
    if(t<60){
      const pieces=this.ghost.frames.pieces;
      for(let i=0;i<9;i++){
        const angle=(i/9)*Math.PI*2+t*0.02;
        const dist=40-t*0.5;
        const px=W/2+Math.cos(angle)*dist-8;
        const py=H/2+Math.sin(angle)*dist-8;
        ctx.globalAlpha=0.8;
        ctx.drawImage(pieces[i],px,py);
      }
      ctx.globalAlpha=1;
      drawTextSh('RESSUSCITANDO...',W/2,30,2,'#ffffff','center');
    }else if(t<120){
      const progress=(t-60)/60;
      const pieces=this.ghost.frames.pieces;
      for(let i=0;i<9;i++){
        const angle=(i/9)*Math.PI*2;
        const dist=40*(1-progress);
        const px=W/2+Math.cos(angle)*dist-8;
        const py=H/2+Math.sin(angle)*dist-8;
        ctx.globalAlpha=0.5+progress*0.5;
        ctx.drawImage(pieces[i],px,py);
      }
      ctx.globalAlpha=1;
      drawTextSh('MONTANDO...',W/2,30,2,'#ffffff','center');
    }else{
      const gf=this.ghost.frames.idle[0];
      const pulse=Math.sin(t*0.1)*0.1+0.9;
      ctx.globalAlpha=pulse;
      drawSpr(gf,W/2-8,H/2-8,false);
      ctx.globalAlpha=1;
      if(t>130){
        const barProgress=Math.min(1,(t-130)/30);
        const barW=60*barProgress;
        const barX=W/2-barW/2;
        const barY=H/2+20;
        ctx.fillStyle='#333333';
        ctx.fillRect(W/2-30,barY,60,6);
        ctx.fillStyle='#88ff88';
        ctx.fillRect(barX,barY,barW,6);
        ctx.strokeStyle='#ffffff';
        ctx.lineWidth=1;
        ctx.strokeRect(W/2-30,barY,60,6);
        if(t>150){
          drawTextSh('VAMOS VOLTAR A VIDA!',W/2,barY+14,1,'#88ff88','center');
        }
      }
      if(t>160){
        const blink=((t>>3)%2)===0;
        if(blink){
          drawText(this.isTouch?'TOQUE PARA CONTINUAR':'APERTE QUALQUER TECLA',W/2,H-30,1,'#888888','center');
        }
      }
    }
    this.particles.draw(0);
  }
  updGameOver(P,dt){
    this.gameover.t++;
    if(this.shake>0)this.shake--;
    if(this.glitch>0)this.glitch--;
    this.particles.update();
    if(this.gameover.t>90&&(P.ok||P.back)){
      if(P.ok){this.retryLevel();}
      else if(P.back){this.toMenu();}
    }
  }
  updIntro(P){
    const it=this.intro;it.t++;
    if(it.phase===0&&it.t>40){it.phase=1;it.t=0;}
    else if(it.phase===1){
      if(it.t>132){it.phase=2;it.t=0;}
      if(P.any&&it.t>30){this.skipIntro();return;}
    }else if(it.phase===2){
      if(!it.seeded){it.drips.seed(textSources('OTHER SIDE',5,37,44));it.seeded=true;}
      it.drips.update();
      if(it.load<66)it.load+=0.7;
      else if(it.load<70)it.load+=(Math.random()<0.2)?0.5:0;
      else it.load+=0.9;
      it.eyes.t--;
      if(it.eyes.t<=0){
        if(it.eyes.on){it.eyes.on=false;it.eyes.t=140+Math.random()*260;}
        else{it.eyes.on=true;it.eyes.x=30+Math.random()*260;it.eyes.y=90+Math.random()*60;it.eyes.t=22;}
      }
      if(it.load>=100){it.phase=3;it.t=0;it.load=100;}
      if(P.any&&it.t>40){this.skipIntro();return;}
    }else if(it.phase===3&&it.t>34){
      this.state='menu';this.menu.enter();
      this.sound.setGameMode(false);
    }
  }
  updAmbient(dt){
    this.ambientTimer++;
    if(this.ambientTimer%180===0&&Math.random()<0.4){
      this.sound.windAmbient();
    }
    if(this.ambientTimer%240===0&&Math.random()<0.3){
      this.sound.dripSound();
    }
    if(this.ambientTimer%300===0&&this.level===1&&Math.random()<0.3){
      this.sound.machineryHum();
    }
    if(this.ambientTimer%280===0&&this.level===2&&Math.random()<0.25){
      this.sound.distantThunder();
    }
    if(this.ambientTimer%500===0&&this.level===2&&Math.random()<0.2){
      this.sound.crowCaw();
    }
    if(this.ambientTimer%800===0&&this.level===2&&Math.random()<0.15){
      this.sound.bellToll();
    }
  }
  updGame(P,dt){
    const tb=this.touchFlags();
    if(tb.j&&!this.prevJ)P.jump=true;
    if(tb.a&&!this.prevA)P.act=true;
    this.prevJ=tb.j;this.prevA=tb.a;
    this.updAmbient(dt);
    const d=this.map.door;
    if(d.opening&&d.open<1){
      d.open+=1/90;
      if(d.open>=1){
        d.open=1;d.opening=false;d.done=true;
        this.scarePending=40;
      }
    }
    if(this.scarePending>0){
      this.scarePending--;
      if(this.scarePending===0){
        this.spawnApp(clamp(this.player.cx-100,30,840));
      }
    }
    this.updHorror();
    if(this.updDialog(P))return;
    if(this.introT<220)this.introT++;
    if(P.back){this.sound.back();this.toMenu();return;}
    const inp={
      left:this.keys.ArrowLeft||this.keys.KeyA||tb.l,
      right:this.keys.ArrowRight||this.keys.KeyD||tb.r,
      jump:this.keys.Space||this.keys.KeyW||this.keys.ArrowUp||tb.j
    };
    if(P.jump)this.player.jbuf=7;
    this.player.update(inp,dt);
    this.time++;
    const tgt=clamp(this.player.cx-160+this.player.face*24,0,MW*TILE-W);
    this.cam+=(tgt-this.cam)*0.1;
    this.prompt=null;
    for(const a of this.map.acts){
      if(a.kind==='key'&&this.map.key.taken)continue;
      if(a.kind==='door'&&(d.opening||d.open>=1))continue;
      const dist=Math.hypot(a.x-this.player.cx,a.y-this.player.cy);
      if(dist<a.r){this.prompt=a;break;}
    }
    if(this.hasKey&&!d.opening&&d.open<1&&this.player.x+this.player.w>796)this.openDoor();
    if(P.act&&this.prompt)this.doInteract(this.prompt);
    if(d.open>=1&&this.player.x>838)this.startEscape();
  }
  updHorror(){
    this.bo.t--;
    if(this.bo.t<=0){
      if(this.bo.on){this.bo.on=false;this.bo.t=650+Math.random()*800;}
      else{this.bo.on=true;this.bo.t=42+Math.random()*50;}
    }
    this.flick.brokenT--;
    if(this.flick.brokenT<=0){
      if(this.flick.on>0){this.flick.on=0;this.flick.brokenT=140+Math.random()*340;}
      else{this.flick.on=8+Math.random()*12;this.flick.brokenT=this.flick.on;}
    }
    if(!this.app.on){
      this.app.cd--;
      if(this.app.cd<=0)this.spawnApp();
    }else{
      this.app.t--;
      if(this.app.t<=0){
        this.app.on=false;
        this.app.cd=620+Math.random()*520;
      }
    }
    if(this.shake>0)this.shake--;
    if(this.glitch>0)this.glitch--;
  }
  spawnApp(forceX){
    let best=null;
    for(const sx of this.map.appSpots){
      const dist=Math.abs(sx-this.player.cx);
      if(dist>60&&dist<270){if(!best||Math.random()<0.5)best=sx;}
    }
    if(best===null)best=clamp(this.player.cx+130,30,840);
    if(forceX!==undefined)best=forceX;
    this.app.on=true;this.app.x=best;this.app.t=46+Math.random()*40;
    this.sound.stingS();this.glitch=6;
  }
  startEscape(){
    this.state='escapeAnim';this.escT=0;this.escTarget='level2';
    this.sound.escapeS();this.sound.setIntense(false);
  }
  updEscaped(P){
    if(!this.escSeed){
      this.escDrips=new Drips();
      this.escDrips.seed(textSources('YOU ESCAPED',3,79,44));
      this.escSeed=true;
    }
    this.escDrips.update();
    if(P.ok){this.sound.confirm();this.toMenu();}
  }
  startLevel2(){
    this.level=2;
    this.map=new Map2();
    this.player=new Player(this.map,28,136);
    this.cam=0;this.shake=0;this.glitch=0;
    this.toastQ=[];this.toastCur=null;
    this.dialog={active:false,pages:[],page:0,n:0};
    this.particles.particles=[];
    this.dust=[];
    this.skels=this.mkSkelsStart();
    this.invis={active:0,cd:0,denyT:0};
    this.cine={active:false,t:0,hold:0};
    this.checkX=28;this.cp2=false;
    this.graceT=90;this.alertSndT=0;
    this.objective='SAIA PELO PORTAO DO CEMITERIO';
    this.introT=0;
    this.sound.setIntense(false);
    this.sound.setGameMode(true);
    this.state='game';
    ['VOCE SAIU DO LABORATORIO...',
     'ESCONDA-SE NOS ARMARIOS (E) QUANDO ELES SE APROXIMAREM.',
     'APERTE R: INVISIBILIDADE POR 5 SEGUNDOS.',
     'CHEGUE AO PORTAO. SOBREVIVA.'].forEach(m=>this.toast(m));
  }
  
  mkSkelsStart(){
    return [
      this.mkSkel(90,168,120),
      this.mkSkel(208,308,250),
      this.mkSkel(348,468,420),
      this.mkSkel(506,628,560)
    ];
  }
  
  mkSkels(){
    return [this.mkSkel(90,168,120),this.mkSkel(208,308,250),this.mkSkel(348,468,420),
            this.mkSkel(506,628,560)];
  }
  mkSkel(minX,maxX,x){
    return{x,y:150,dir:1,minX,maxX,state:'patrol',loseT:0,searchT:0,lastSeen:x,
      bubbleTxt:'',bubbleT:0,bubbleDelay:0,bubblePool:'alert',animT:Math.random()*2,
      falling:false,vy:0,dead:false,stepT:0,searchClosetT:0,targetCloset:null};
  }
  setBubble(s,pool){
    const pools={
      alert:['O FUGITIVO! ALI!','PEGUEM ELE!','NAO O DEIXEM SAIR!','SINTO SEU CHEIRO...'],
      search:['ONDE ESTA O FUGITIVO?','SUMIU...','EU OUVI ALGO...','VERIFIQUEM OS ARMARIOS.'],
      crack:['A PONTE! PEGUEM ELE!','CORRAM!','NAO O DEIXEM CAIR!']
    };
    const arr=pools[pool]||pools.alert;
    s.bubbleTxt=arr[(Math.random()*arr.length)|0];s.bubbleT=110;
    this.sound.skelTalk();
  }
  alertWave(x){
    let i=0;
    for(const s of this.skels){
      if(Math.abs(s.x-x)<320){
        if(s.state!=='alert'){s.state='alert';s.loseT=0;s.bubbleDelay=i*45;s.bubblePool='alert';i++;}
        s.lastSeen=this.player.cx;
      }
    }
    if(i>0&&this.alertSndT<=0){this.sound.alertS();this.alertSndT=60;}
  }
  wallAhead(s){
    const tx=Math.floor((s.x+s.dir*8)/TILE);
    return this.map.solid(tx,13)||this.map.solid(tx,14);
  }
  skelSees(s){
    if(this.invis.active>0)return false;
    if(this.player.hiding)return false;
    const p=this.player;
    if(Math.abs((s.y-9)-p.cy)>26)return false;
    const dx=p.cx-s.x,dist=Math.abs(dx);
    if(dist<3)return false;
    const range=s.state==='alert'?150:84;
    if(dist>range)return false;
    if(s.state!=='alert'&&dx*s.dir<=0)return false;
    const step=dx>0?6:-6;
    for(let px=s.x+step;(dx>0?px<p.cx-4:px>p.cx+4);px+=step){
      if(this.map.solid(Math.floor(px/TILE),14))return false;
    }
    return true;
  }
  skelSmellsCloset(s){
    return null;
  }
  updSkeletons(){
    if(this.graceT>0){this.graceT--;this.skels=this.skels.filter(s=>!s.dead);return;}
    const P2=this.player;let caught=false;let caughtSkel=null;
    for(const s of this.skels){
      if(s.dead)continue;
      if(s.falling){
        s.vy+=0.3;s.y+=s.vy;s.x+=s.dir*0.3;
        if(s.y>188){this.particles.bones(s.x,176,8);this.sound.clackS();s.dead=true;}
        continue;
      }
      if(!this.map.solid(Math.floor(s.x/TILE),15)){s.falling=true;s.vy=0;continue;}
      const sees=this.skelSees(s);
      if(sees){
        if(s.state!=='alert')this.alertWave(s.x);
        s.state='alert';s.loseT=0;s.lastSeen=P2.cx;s.targetCloset=null;
      }
      if(s.state==='patrol'){
        s.x+=s.dir*0.32;s.animT+=0.08;
        s.stepT++;
        if(s.stepT>40){s.stepT=0;this.sound.skelStep();}
        if(s.x<=s.minX){s.x=s.minX;s.dir=1;}
        if(s.x>=s.maxX){s.x=s.maxX;s.dir=-1;}
        if(this.wallAhead(s))s.dir*=-1;
      }else if(s.state==='alert'){
        s.dir=P2.cx>=s.x?1:-1;
        if(!this.wallAhead(s))s.x+=s.dir*0.92;
        s.animT+=0.15;
        s.stepT++;
        if(s.stepT>25){s.stepT=0;this.sound.skelStep();this.sound.skelRattle();}
        if(!sees){
          s.loseT++;
          if(s.loseT>150){s.state='search';s.searchT=260;this.setBubble(s,'search');s.targetCloset=null;}
        }else if(s.bubbleT<=0&&Math.random()<0.006)this.setBubble(s,'alert');
      }else{
        s.searchT--;
        if(s.targetCloset&&!s.targetCloset.occupied){s.targetCloset=null;}
        if(s.targetCloset){
          const cl=s.targetCloset;
          const dd=(cl.x+cl.w/2)-s.x;
          if(Math.abs(dd)>6){
            s.dir=dd>0?1:-1;
            if(!this.wallAhead(s))s.x+=s.dir*0.6;
          }else{
            s.searchClosetT--;
            if(s.searchClosetT<=0){
              if(cl.occupied){caught=true;caughtSkel=s;break;}
              s.targetCloset=null;
            }
          }
          s.animT+=0.09;
        }else{
          const dd=s.lastSeen-s.x;
          if(Math.abs(dd)>8){
            s.dir=dd>0?1:-1;
            if(!this.wallAhead(s))s.x+=s.dir*0.5;
            else{s.dir*=-1;s.lastSeen=s.x+s.dir*40;}
            s.animT+=0.09;
          }else if(Math.random()<0.02)s.dir*=-1;
        }
        if(Math.random()<0.005)this.setBubble(s,'search');
        if(s.searchT<=0&&!s.targetCloset){s.state='patrol';s.bubbleT=Math.min(s.bubbleT,20);}
      }
      s.x=clamp(s.x,14,MW2*TILE-14);
      if(s.bubbleDelay>0){s.bubbleDelay--;if(s.bubbleDelay===0)this.setBubble(s,s.bubblePool);}
      if(s.bubbleT>0)s.bubbleT--;
      if(this.invis.active<=0&&!this.player.hiding&&
         Math.abs(s.x-P2.cx)<8&&Math.abs((s.y-9)-P2.cy)<13){
        caught=true;caughtSkel=s;break;
      }
    }
    if(caught){
      this.triggerGameOver(caughtSkel?'OS ESQUELETOS TE PEGARAM...':'VOCE MORREU...');
      return;
    }
    this.skels=this.skels.filter(s=>!s.dead);
    const anyAlert=this.skels.some(s=>s.state==='alert');
    this.sound.setIntense(anyAlert);
  }
  crackBridge(){
    const m=this.map;m.cracked=true;
    this.sound.crackS();
    this.sound.bridgeCrash();
    this.shake=15;this.glitch=10;
    this.objective='CORRA PELO RESTO DA PONTE!';
    this.toast('A PONTE RACHOU! OS ESQUELETOS OUVIRAM!');
    for(const s of this.skels){
      s.state='alert';s.loseT=0;s.lastSeen=this.player.cx;
      s.bubbleDelay=(Math.random()*60)|0;s.bubblePool='crack';
    }

  startCine(){
    this.cine={active:true,t:0,hold:0};

    this.sound.setIntense(true);

  updCine(){
    const c=this.cine,m=this.map;
    c.t++;this.time++;
    if(c.t%7===0)this.shake=Math.max(this.shake,3);
    const order=[10,9,11,8,12,7,13,6,14,5,15,4,16,3,17,2,18,1,19,0,20];
    if(c.t>=26&&(c.t-26)%6===0){
      const idx=order[Math.floor((c.t-26)/6)];
      if(idx!==undefined){
        const p=m.planks[idx];
        if(p&&!p.falling&&!p.gone){
          p.falling=true;p.vy=0;
          this.particles.dust(p.tx*10+5,150,5);
          this.particles.bones(p.tx*10+5,150,3);
          this.sound.clackS();
        }
      }
    }
    for(const p of m.planks){
      if(p.falling&&!p.gone){
        p.vy+=0.3;p.oy+=p.vy;
        if(p.oy>34){
          p.gone=true;
          this.particles.bones(p.tx*10+5,176,8);
          this.particles.dust(p.tx*10+5,176,4);
          if(Math.random()<0.5)this.sound.clackS();
        }
      }
    }
    for(const s of this.skels){
      if(s.falling){
        s.vy+=0.3;s.y+=s.vy;
        if(s.y>188){
          this.particles.bones(s.x,176,10);
          this.particles.dust(s.x,176,5);
          this.sound.clackS();
          s.dead=true;
        }
        continue;
      }
      if(!m.solid(Math.floor(s.x/TILE),15)){s.falling=true;s.vy=0;continue;}
      s.dir=(740>s.x)?1:-1;
      s.x+=s.dir*1.15;s.animT+=0.15;
      if(s.bubbleT<=0&&Math.random()<0.012){s.bubbleTxt='AAAAH!';s.bubbleT=60;}
      if(s.bubbleT>0)s.bubbleT--;
    }
    this.skels=this.skels.filter(s=>!s.dead);
    const tgt=clamp(740-160,0,MW2*TILE-W);
    this.cam+=(tgt-this.cam)*0.08;
    const allGone=m.planks.every(p=>p.gone);
    if(allGone&&c.t>150)c.hold++;
    if((allGone&&c.hold>60)||c.t>460)this.endCine();
  }
  endCine(){
    this.cine.active=false;

      s.state='patrol';s.bubbleT=0;s.falling=false;
      s.x=clamp(s.x,s.minX,s.maxX);

    this.sound.setIntense(false);

  updGame2(P,dt){
    const tb=this.touchFlags();
    if(tb.j&&!this.prevJ)P.jump=true;
    if(tb.r2&&!this.prevR2)P.invis=true;
    if(tb.a&&!this.prevE)P.act=true;
    this.prevJ=tb.j;this.prevR2=tb.r2;this.prevE=tb.a;
    this.updAmbient(dt);
    if(this.alertSndT>0)this.alertSndT--;
    if(this.shake>0)this.shake--;
    if(this.glitch>0)this.glitch--;
    if(this.cine.active){this.updCine();return;}
    if(this.updDialog(P))return;
    if(this.introT<220)this.introT++;
    if(P.back){this.sound.back();this.toMenu();return;}
    const iv=this.invis;
    if(iv.active>0){
      iv.active--;
      if(this.t%3===0&&!this.player.hiding){
        this.particles.invisTrail(this.player.cx,this.player.cy);
      }
      if(iv.active===0){iv.cd=900;this.sound.invisOffS();}
    }else if(iv.cd>0){
      iv.cd--;
      if(iv.cd===0)this.sound.readyS();
    }
    if(iv.denyT>0)iv.denyT--;
    if(P.invis&&!this.player.hiding){
      if(iv.active<=0){
        if(iv.cd>0){iv.denyT=24;this.sound.denyS();}
        else{iv.active=300;this.sound.invisOnS();this.sparkle();}
      }
    }
    if(P.act){
      this.doInteract2();
    }
    const inp={
      left:this.keys.ArrowLeft||this.keys.KeyA||tb.l,
      right:this.keys.ArrowRight||this.keys.KeyD||tb.r,
      jump:this.keys.Space||this.keys.KeyW||this.keys.ArrowUp||tb.j
    };
    if(P.jump&&!this.player.hiding)this.player.jbuf=7;
    this.player.update(inp,dt);
    this.time++;
    if(this.player.y>186){
      this.triggerGameOver('VOCE CAIU NO ABISMO...');
      return;
    }
    if(!this.cp2&&this.player.x>505){
      this.cp2=true;this.checkX=512;
      this.toast('PONTO DE SEGURANCA.');
      this.sound.checkpointS();
    }
    const m=this.map;
    if(!m.cracked&&!m.bridgeDone&&this.player.ground&&
       Math.abs(this.player.y+this.player.h-150)<2&&
       this.player.cx>660&&this.player.cx<830){
      this.crackBridge();
    }
    if(m.cracked&&!m.bridgeDone&&!this.cine.active&&this.player.x>852&&this.player.ground){
      if(this.player.hiding)this.player.unhide();
      this.startCine();return;
    }
    const gate=m.gate;
    if(m.bridgeDone&&!gate.opening&&gate.open<1&&this.player.x>1100){
      gate.opening=true;this.sound.openS();this.sound.doorCreak();this.shake=8;
      this.toast('O PORTAO SE ABRE...');
      this.particles.smoke(gate.x+gate.w/2,gate.y+10,8);
    }
    if(gate.opening&&gate.open<1){
      gate.open+=1/90;
      if(gate.open>=1){gate.open=1;gate.opening=false;}
    }
    if(this.player.x>1208){
      this.finalTime=this.time;this.escTarget='end';
      this.state='escapeAnim';this.escT=0;
      this.sound.escapeS();this.sound.setIntense(false);
      return;
    }
    this.updSkeletons();
    const tgt=clamp(this.player.cx-160+this.player.face*24,0,MW2*TILE-W);
    this.cam+=(tgt-this.cam)*0.1;
  }

    ctx.globalAlpha=1;
    
    if(s.dir<0){
      ctx.save();ctx.translate(x+12,y);ctx.scale(-1,1);ctx.drawImage(img,0,0);ctx.restore();
    }else{
      ctx.drawImage(img,x,y);
    }
    
    // Olhos brilhantes quando alerta (mais dramático)
    if(red){
      const pulse=0.6+0.4*Math.sin(this.t*0.25);
      ctx.fillStyle='#ff0000';
      ctx.globalAlpha=pulse;
      const ex=s.dir<0?x+8:x+4;
      ctx.fillRect(ex,y+2,1,1);ctx.fillRect(ex+(s.dir<0?-3:3),y+2,1,1);
      // Brilho ao redor dos olhos
      ctx.globalAlpha=pulse*0.3;
      ctx.fillRect(ex-1,y+1,3,3);
      ctx.fillRect(ex+(s.dir<0?-4:2),y+1,3,3);
      ctx.globalAlpha=1;
    }
  }
  drawBubble(s){
    if(s.bubbleT<=0||!s.bubbleTxt)return;
    const txt=s.bubbleTxt,w=textW(txt,1)+8;
    const bx=clamp(Math.round(s.x-w/2),Math.round(this.cam)+2,Math.round(this.cam)+W-w-2);
    const by=Math.round(s.y)-32;
    ctx.fillStyle='#1a1a2a';ctx.fillRect(bx,by,w,12);
    ctx.fillStyle='#ff6666';
    ctx.fillRect(bx,by,w,1);ctx.fillRect(bx,by+11,w,1);
    ctx.fillRect(bx,by,1,12);ctx.fillRect(bx+w-1,by,1,12);
    drawText(txt,bx+4,by+4,1,'#ffffff');
  }
  drawCine(){
    const c=this.cine;
    const allGone=this.map.planks.every(p=>p.gone);
    let bh=Math.min(20,Math.floor(c.t*1.5));
    if(allGone)bh=Math.max(0,Math.min(bh,20-Math.floor((c.hold||0)*0.4)));
    if(bh>0){
      ctx.fillStyle='#000000';
      ctx.fillRect(0,0,W,bh);ctx.fillRect(0,H-bh,W,bh);
    }
    if(c.t>30&&c.t<110)
      drawTextSh('A PONTE ESTA DESABANDO!',W/2,H-bh+5,2,'#ffffff','center');
    if(c.t>120&&c.t<210)
      drawTextSh('OS ESQUELETOS CAEM NO ABISMO.',W/2,H-bh+5,2,'#ffffff','center');
  }
  drawEscaped(){
    const t=this.t;
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
    drawText('YOU ESCAPED',79,44,3,'#000000');
    if(this.escDrips)this.escDrips.draw('#000000',2);
    const gy=96+Math.sin(t*0.06)*2;
    ctx.drawImage(this.ghost.sil,144,gy,32,32);
    drawText('TEMPO '+this.fmt(this.finalTime),W/2,130,1,'#000000','center');
    drawText('O LABORATORIO E O CEMITERIO FICARAM PARA TRAS.',W/2,142,1,'#666677','center');
    if(t%400>150)drawText('MAS ALGO SAIU COM VOCE...',W/2,154,1,'#000000','center');
    if(((t>>4)%2)===0)drawText(this.isTouch?'TOQUE: MENU':'ENTER: MENU',W/2,166,1,'#000000','center');
  }
  fmt(frames){
    const s=Math.floor(frames/60),m=Math.floor(s/60);
    return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }
  start(){
    this.last=performance.now();
    const loop=ts=>{
      requestAnimationFrame(loop);
      let dt=ts-this.last;this.last=ts;
      if(dt>200)dt=200;
      this.acc+=dt;
      let n=0;
      while(this.acc>=16.6667&&n<5){this.stepF(16.6667);this.acc-=16.6667;n++;}
      this.draw();
    };
    requestAnimationFrame(loop);
  }
}

let game;
game=new Game();
game.start();
</script>
