    consumePressed(){
        const p=this.pressedObj;

        const P={
            up:
                p.ArrowUp||
                p.KeyW,

            down:
                p.ArrowDown||
                p.KeyS,

            ok:
                p.Enter||
                p.Space,

            back:
                p.Escape,

            jump:
                p.Space||
                p.KeyW||
                p.ArrowUp,

            act:p.KeyE,

            invis:p.KeyR,

            any:
                Object.keys(p).length>0
        };

        this.pressedObj={};

        return P;
    }

    touchFlags(){
        const f={
            l:false,
            r:false,
            j:false,
            a:false,
            r2:false
        };

        for(const t of this.touches){
            const p={
                x:t.x,
                y:t.y
            };

            if(this.inRect(p,this.btns.l))
                f.l=true;

            if(this.inRect(p,this.btns.r))
                f.r=true;

            if(this.inRect(p,this.btns.j))
                f.j=true;

            if(this.inRect(p,this.btns.a))
                f.a=true;

            if(this.inRect(p,this.btns.r2))
                f.r2=true;
        }

        return f;
    }

    stepF(dt){
        this.t++;

        this.sound.tick();
        this.particles.update();

        if(
            this.fadeDir<0&&
            this.fadeAlpha>0
        ){
            this.fadeAlpha=
                Math.max(
                    0,
                    this.fadeAlpha-.03
                );
        }

        if(
            this.fadeDir>0&&
            this.fadeAlpha<1
        ){
            this.fadeAlpha=
                Math.min(
                    1,
                    this.fadeAlpha+.03
                );
        }

        const P=
            this.consumePressed();

        this.camera.update();

        if(this.state==="game"){
            if(
                this.toastCur&&
                P.any
            ){
                this.toastCur=null;

                P.ok=false;
                P.act=false;
                P.jump=false;
                P.back=false;
                P.invis=false;

            }else if(
                !this.toastCur&&
                this.toastQ.length&&
                !(
                    this.dialog&&
                    this.dialog.active
                )&&
                !(
                    this.cine&&
                    this.cine.active
                )
            ){
                const m=
                    this.toastQ.shift();

                this.toastCur=m;

                this.toastLines=
                    wrapText(m,30);
            }

            this.events.update();
        }

        switch(this.state){
            case "intro":
                this.updIntro(P);
                break;

            case "menu":
                this.updMenu(P);
                break;

            case "settings":
                this.updSettings(P);
                break;

            case "director":
                if(P.ok||P.back){
                    this.sound.back();
                    this.toMenu();
                }
                break;

            case "game":
                if(this.level===2)
                    this.updGame2(P,dt);
                else
                    this.updGame(P,dt);
                break;

            case "gameover":
                this.updGameOver(P,dt);
                break;

            case "escapeAnim":
                this.escT++;

                if(this.escT>62){
                    if(
                        this.escTarget===
                        "level2"
                    ){
                        this.startLevel2();
                    }else{
                        this.state="escaped";
                        this.escSeed=false;
                    }
                }

                break;

            case "escaped":
                if(P.ok){
                    this.sound.confirm();
                    this.toMenu();
                }
                break;

            case "ghostIntro":
                this.ghostIntro.t++;

                if(
                    this.ghostIntro.t>=120&&
                    !this.ghostIntro.assembled
                ){
                    this.ghostIntro.assembled=true;
                    this.sound.confirm();
                }

                if(
                    this.ghostIntro.t>=180||
                    (
                        P.any&&
                        this.ghostIntro.t>30
                    )
                ){
                    this.startGame();
                }

                break;
        }
    }

    updMenu(P){
        for(const p of this.menu.parts){
            p.y+=p.sp;

            if(p.y>152){
                p.y=-2;
                p.x=Math.random()*W;
            }
        }

        if(
            this.state==="menu"&&
            !this.menu.seeded
        ){
            this.menu.drips.seed(
                textSources(
                    "OTHER SIDE",
                    4,
                    62,
                    12
                )
            );

            this.menu.seeded=true;
        }

        this.menu.drips.update();

        if(P.up){
            this.menu.sel=
                (this.menu.sel+2)%3;

            this.sound.click();
        }

        if(P.down){
            this.menu.sel=
                (this.menu.sel+1)%3;

            this.sound.click();
        }

        if(P.ok)
            this.menuActivate();
    }

    updSettings(P){
        for(const p of this.menu.parts){
            p.y+=p.sp;

            if(p.y>152){
                p.y=-2;
                p.x=Math.random()*W;
            }
        }

        if(P.up){
            this.menu.setSel=
                (this.menu.setSel+2)%3;

            this.sound.click();
        }

        if(P.down){
            this.menu.setSel=
                (this.menu.setSel+1)%3;

            this.sound.click();
        }

        if(P.ok)
            this.setActivate();

        if(P.back){
            this.sound.back();
            this.toMenu();
        }
    }

    updIntro(P){
        const it=this.intro;

        it.t++;

        if(
            it.phase===0&&
            it.t>40
        ){
            it.phase=1;
            it.t=0;
        }else if(it.phase===1){

            if(it.t>132){
                it.phase=2;
                it.t=0;
            }

            if(
                P.any&&
                it.t>30
            ){
                this.skipIntro();
                return;
            }
        }else if(it.phase===2){

            if(!it.seeded){
                it.drips.seed(
                    textSources(
                        "OTHER SIDE",
                        5,
                        37,
                        44
                    )
                );

                it.seeded=true;
            }

            it.drips.update();

            if(it.load<66){
                it.load+=.7;
            }else if(it.load<70){
                it.load+=
                    Math.random()<.2
                    ?.5
                    :0;
            }else{
                it.load+=.9;
            }

            it.eyes.t--;

            if(it.eyes.t<=0){
                if(it.eyes.on){
                    it.eyes.on=false;

                    it.eyes.t=
                        140+
                        Math.random()*260;
                }else{
                    it.eyes.on=true;

                    it.eyes.x=
                        30+
                        Math.random()*260;

                    it.eyes.y=
                        90+
                        Math.random()*60;

                    it.eyes.t=22;
                }
            }

            if(it.load>=100){
                it.phase=3;
                it.t=0;
                it.load=100;
            }

            if(
                P.any&&
                it.t>40
            ){
                this.skipIntro();
                return;
            }
        }else if(
            it.phase===3&&
            it.t>34
        ){
            this.state="menu";
            this.sound.setGameMode(false);
        }
    }

    updGame(P,dt){
        this.map.updateElectricity(
            this.t
        );

        const tb=
            this.touchFlags();

        if(tb.j&&!this.prevJ)
            P.jump=true;

        if(tb.a&&!this.prevA)
            P.act=true;

        this.prevJ=tb.j;
        this.prevA=tb.a;

        const d=this.map.door;

        if(
            d.opening&&
            d.open<1
        ){
            d.open+=1/90;

            if(d.open>=1){
                d.open=1;
                d.opening=false;
                d.done=true;
                this.scarePending=40;
            }
        }

        if(this.scarePending>0){
            this.scarePending--;

            if(this.scarePending===0)
                this.spawnApp();
        }

        this.updHorror();

        if(this.updDialog(P))
            return;

        if(this.introT<220)
            this.introT++;

        if(P.back){
            this.sound.back();
            this.toMenu();
            return;
        }

        const inp={
            left:
                this.keys.ArrowLeft||
                this.keys.KeyA||
                tb.l,

            right:
                this.keys.ArrowRight||
                this.keys.KeyD||
                tb.r,

            jump:
                this.keys.Space||
                this.keys.KeyW||
                this.keys.ArrowUp||
                tb.j
        };

        if(P.jump)
            this.player.jbuf=7;

        this.player.update(
            inp,
            dt
        );

        this.time++;

        this.camera.follow(
            this.player.cx,
            this.player.face,
            MW*TILE
        );

        this.prompt=null;

        for(const a of this.map.acts){
            if(
                a.kind==="key"&&
                this.map.key.taken
            )
                continue;

            if(
                a.kind==="door"&&
                (
                    d.opening||
                    d.open>=1
                )
            )
                continue;

            const dist=
                Math.hypot(
                    a.x-this.player.cx,
                    a.y-this.player.cy
                );

            if(dist<a.r){
                this.prompt=a;
                break;
            }
        }

        if(
            this.hasKey&&
            !d.opening&&
            d.open<1&&
            this.player.x+
            this.player.w>796
        ){
            this.openDoor();
        }

        if(P.act&&this.prompt)
            this.doInteract(
                this.prompt
            );

        if(
            d.open>=1&&
            this.player.x>838
        ){
            this.startEscape();
        }

        this.updateLighting1();
    }

    updHorror(){
        this.bo.t--;

        if(this.bo.t<=0){
            if(this.bo.on){
                this.bo.on=false;

                this.bo.t=
                    650+
                    Math.random()*800;
            }else{
                this.bo.on=true;

                this.bo.t=
                    42+
                    Math.random()*50;
            }
        }

        this.flick.brokenT--;

        if(this.flick.brokenT<=0){
            if(this.flick.on>0){
                this.flick.on=0;

                this.flick.brokenT=
                    140+
                    Math.random()*340;
            }else{
                this.flick.on=
                    8+
                    Math.random()*12;

                this.flick.brokenT=
                    this.flick.on;
            }
        }

        if(!this.app.on){
            this.app.cd--;

            if(this.app.cd<=0)
                this.spawnApp();
        }else{
            this.app.t--;

            if(this.app.t<=0){
                this.app.on=false;

                this.app.cd=
                    620+
                    Math.random()*520;
            }
        }

        if(this.shake>0)
            this.shake--;

        if(this.glitch>0)
            this.glitch--;
    }

    spawnApp(){
        let best=null;

        for(const sx of this.map.appSpots){
            const dist=
                Math.abs(
                    sx-
                    this.player.cx
                );

            if(
                dist>60&&
                dist<270
            ){
                if(
                    !best||
                    Math.random()<.5
                ){
                    best=sx;
                }
            }
        }

        if(best===null){
            best=clamp(
                this.player.cx+130,
                30,
                840
            );
        }

        this.app.on=true;
        this.app.x=best;

        this.app.t=
            46+
            Math.random()*40;

        this.sound.stingS();
        this.glitch=6;

        this.camera.shake(
            3,
            8
        );
    }

    startEscape(){
        this.state="escapeAnim";
        this.escT=0;
        this.escTarget="level2";

        this.sound.escapeS();
        this.sound.setIntense(false);
    }

    openDoor(){
        const d=this.map.door;

        if(
            d.opening||
            d.open>=1
        )
            return;

        d.opening=true;

        this.sound.openS();
        this.camera.shake(
            5,
            15
        );

        this.particles.smoke(
            d.x+d.w/2,
            d.y+10,
            6
        );

        this.toast(
            "O PORTAO SE ABRIU..."
        );
    }

    doInteract(a){
        if(a.kind==="key"){
            this.map.key.taken=true;
            this.hasKey=true;

            this.sound.keyS();

            this.particles.burst(
                a.x,
                a.y,
                16,
                "#ffff88"
            );

            this.toast(
                "A CHAVE PULSA NA SUA MAO. FUJA."
            );

            this.sound.setIntense(true);

            this.glitch=14;

            this.objective=
                "ABRA O PORTAO E FUJA!";

            this.app.cd=
                Math.min(
                    this.app.cd,
                    140
                );
        }else if(a.kind==="door"){
            if(!this.hasKey){
                this.openDialog([
                    "TRANCADO.",
                    "PRECISO DA CHAVE."
                ]);

                this.sound.lockedS();
            }else{
                this.openDoor();
            }
        }else{
            a.read=true;

            this.openDialog(
                a.lines
            );

            this.sound.typeS();
        }
    }

    doInteract2(){
        if(this.player.hiding){
            this.player.unhide();

            this.sound.unhideS();

            this.particles.dust(
                this.player.cx,
                this.player.cy,
                5
            );

            return;
        }

        const cl=
            this.map.getClosetAt(
                this.player.cx,
                this.player.cy
            );

        if(cl&&!cl.occupied){
            this.player.hideIn(cl);

            this.sound.hideS();

            this.particles.dust(
                cl.x+cl.w/2,
                cl.y+cl.h,
                4
            );

            this.toast(
                "ESCONDIDO!"
            );
        }
    }

    updGame2(P,dt){
        const tb=
            this.touchFlags();

        if(tb.j&&!this.prevJ)
            P.jump=true;

        if(tb.r2&&!this.prevR2)
            P.invis=true;

        if(tb.a&&!this.prevE)
            P.act=true;

        this.prevJ=tb.j;
        this.prevR2=tb.r2;
        this.prevE=tb.a;

        if(this.alertSndT>0)
            this.alertSndT--;

        if(this.shake>0)
            this.shake--;

        if(this.glitch>0)
            this.glitch--;

        if(this.cine.active){
            this.updCine();
            return;
        }

        if(this.updDialog(P))
            return;

        if(this.introT<220)
            this.introT++;

        if(P.back){
            this.sound.back();
            this.toMenu();
            return;
        }

        const iv=this.invis;

        if(iv.active>0){
            iv.active--;

            if(
                this.t%3===0&&
                !this.player.hiding
            ){
                this.particles.invisTrail(
                    this.player.cx,
                    this.player.cy
                );
            }

            if(iv.active===0){
                iv.cd=900;
                this.sound.invisOffS();
            }
        }else if(iv.cd>0){
            iv.cd--;

            if(iv.cd===0)
                this.sound.readyS();
        }

        if(iv.denyT>0)
            iv.denyT--;

        if(
            P.invis&&
            !this.player.hiding
        ){
            if(iv.active<=0){
                if(iv.cd>0){
                    iv.denyT=24;
                    this.sound.denyS();
                }else{
                    iv.active=300;

                    this.sound.invisOnS();

                    this.particles.sparkle(
                        this.player.cx,
                        this.player.cy,
                        12,
                        "#88CCFF"
                    );
                }
            }
        }

        if(P.act)
            this.doInteract2();

        const inp={
            left:
                this.keys.ArrowLeft||
                this.keys.KeyA||
                tb.l,

            right:
                this.keys.ArrowRight||
                this.keys.KeyD||
                tb.r,

            jump:
                this.keys.Space||
                this.keys.KeyW||
                this.keys.ArrowUp||
                tb.j
        };

        if(
            P.jump&&
            !this.player.hiding
        ){
            this.player.jbuf=7;
        }

        this.player.update(
            inp,
            dt
        );

        this.time++;

        if(this.player.y>186){
            this.triggerGameOver(
                "VOCE CAIU NO ABISMO..."
            );

            return;
        }

        if(
            !this.cp2&&
            this.player.x>505
        ){
            this.cp2=true;
            this.checkX=512;

            this.toast(
                "PONTO DE SEGURANCA."
            );

            this.sound.checkpointS();
        }

        const m=this.map;

        if(
            !m.cracked&&
            !m.bridgeDone&&
            this.player.ground&&
            Math.abs(
                this.player.y+
                this.player.h-
                150
            )<2&&
            this.player.cx>760&&
            this.player.cx<930
        ){
            this.crackBridge();
        }

        if(
            m.cracked&&
            !m.bridgeDone&&
            !this.cine.active&&
            this.player.x>952&&
            this.player.ground
        ){
            if(this.player.hiding)
                this.player.unhide();

            this.startCine();
            return;
        }

        const gate=m.gate;

        if(
            m.bridgeDone&&
            !gate.opening&&
            gate.open<1&&
            this.player.x>1400
        ){
            gate.opening=true;

            this.sound.openS();

            this.camera.shake(
                4,
                10
            );

            this.toast(
                "O PORTAO SE ABRE..."
            );

            this.particles.smoke(
                gate.x+gate.w/2,
                gate.y+10,
                8
            );
        }

        if(
            gate.opening&&
            gate.open<1
        ){
            gate.open+=1/90;

            if(gate.open>=1){
                gate.open=1;
                gate.opening=false;
            }
        }

        if(this.player.x>1508){
            this.finalTime=this.time;
            this.escTarget="end";
            this.state="escapeAnim";
            this.escT=0;

            this.sound.escapeS();
            this.sound.setIntense(false);

            return;
        }

        this.updSkeletons();
        this.updEmergingSkels();

        this.camera.follow(
            this.player.cx,
            this.player.face,
            MW2*TILE
        );

        this.updateLighting2();
    }

    updSkeletons(){
        if(this.graceT>0){
            this.graceT--;
            return;
        }

        const P2=this.player;
        let caught=false;

        for(const s of this.skels){
            if(s.dead)
                continue;

            s.headBob+=.05;

            s.jawOpen=
                Math.max(
                    0,
                    s.jawOpen-.02
                );

            if(s.falling){
                s.vy+=.3;
                s.y+=s.vy;
                s.x+=s.dir*.3;

                if(s.y>188){
                    this.particles.bones(
                        s.x,
                        176,
                        8
                    );

                    this.sound.clackS();

                    s.dead=true;
                }

                continue;
            }

            if(
                !this.map.solid(
                    Math.floor(
                        s.x/TILE
                    ),
                    15
                )
            ){
                s.falling=true;
                s.vy=0;
                continue;
            }

            const sees=
                this.skelSees(s);

            if(sees){
                if(s.state!=="alert")
                    this.alertWave(s.x);

                s.state="alert";
                s.loseT=0;
                s.lastSeen=P2.cx;
            }

            if(s.state==="patrol"){
                s.x+=s.dir*.32;
                s.animT+=.08;
                s.stepT++;

                if(s.stepT>40){
                    s.stepT=0;
                    this.sound.skelStep();
                }

                if(s.x<=s.minX){
                    s.x=s.minX;
                    s.dir=1;
                }

                if(s.x>=s.maxX){
                    s.x=s.maxX;
                    s.dir=-1;
                }

                if(this.wallAhead(s))
                    s.dir*=-1;
            }else if(s.state==="alert"){
                s.dir=
                    P2.cx>=s.x
                    ?1
                    :-1;

                if(!this.wallAhead(s))
                    s.x+=s.dir*.92;

                s.animT+=.15;
                s.stepT++;

                if(s.stepT>25){
                    s.stepT=0;
                    this.sound.skelStep();
                    this.sound.skelRattle();
                }

                if(!sees){
                    s.loseT++;

                    if(s.loseT>150){
                        s.state="search";
                        s.searchT=260;

                        this.setBubble(
                            s,
                            "search"
                        );
                    }
                }else if(
                    s.bubbleT<=0&&
                    Math.random()<.006
                ){
                    this.setBubble(
                        s,
                        "alert"
                    );
                }
            }else{
                s.searchT--;

                const dd=
                    s.lastSeen-s.x;

                if(Math.abs(dd)>8){
                    s.dir=
                        dd>0
                        ?1
                        :-1;

                    if(!this.wallAhead(s))
                        s.x+=s.dir*.5;

                    s.animT+=.09;
                }else if(Math.random()<.02){
                    s.dir*=-1;
                }

                if(Math.random()<.005){
                    this.setBubble(
                        s,
                        "search"
                    );
                }

                if(s.searchT<=0)
                    s.state="patrol";
            }

            s.x=
                clamp(
                    s.x,
                    14,
                    MW2*TILE-14
                );

            if(s.bubbleDelay>0){
                s.bubbleDelay--;

                if(s.bubbleDelay===0){
                    this.setBubble(
                        s,
                        s.bubblePool
                    );
                }
            }

            if(s.bubbleT>0)
                s.bubbleT--;

            if(
                this.invis.active<=0&&
                !this.player.hiding&&
                Math.abs(
                    s.x-
                    P2.cx
                )<8&&
                Math.abs(
                    (s.y-9)-
                    P2.cy
                )<13
            ){
                caught=true;
                break;
            }
        }

        if(caught){
            this.triggerGameOver(
                "OS ESQUELETOS TE PEGARAM..."
            );

            return;
        }

        this.skels=
            this.skels.filter(
                s=>!s.dead
            );

        const anyAlert=
            this.skels.some(
                s=>s.state==="alert"
            );

        this.sound.setIntense(
            anyAlert
        );
    }

    updEmergingSkels(){
        for(
            let i=
                this.emergingSkels.length-1;
            i>=0;
            i--
        ){
            const e=
                this.emergingSkels[i];

            e.t++;

            if(e.t===30){
                e.handUp=true;

                this.particles.dust(
                    e.x,
                    150,
                    5
                );
            }

            if(e.t===60)
                e.handUp=false;

            if(e.t===120){
                this.skels.push(
                    this.mkSkel(
                        e.x-40,
                        e.x+40,
                        e.x
                    )
                );

                this.particles.bones(
                    e.x,
                    150,
                    8
                );

                this.particles.dust(
                    e.x,
                    150,
                    8
                );

                this.sound.skelRattle();

                this.camera.shake(
                    4,
                    10
                );

                this.emergingSkels.splice(
                    i,
                    1
                );
            }
        }
    }

    skelSees(s){
        if(this.invis.active>0)
            return false;

        if(this.player.hiding)
            return false;

        const p=this.player;

        if(
            Math.abs(
                (s.y-9)-p.cy
            )>26
        )
            return false;

        const dx=
            p.cx-s.x;

        const dist=
            Math.abs(dx);

        if(dist<3)
            return false;

        const range=
            s.state==="alert"
            ?150
            :84;

        if(dist>range)
            return false;

        if(
            s.state!=="alert"&&
            dx*s.dir<=0
        )
            return false;

        const step=
            dx>0
            ?6
            :-6;

        for(
            let px=s.x+step;
            (
                dx>0
                ?px<p.cx-4
                :px>p.cx+4
            );
            px+=step
        ){
            if(
                this.map.solid(
                    Math.floor(
                        px/TILE
                    ),
                    14
                )
            ){
                return false;
            }
        }

        return true;
    }

    wallAhead(s){
        const tx=
            Math.floor(
                (
                    s.x+
                    s.dir*8
                )/TILE
            );

        return(
            this.map.solid(tx,13)||
            this.map.solid(tx,14)

    alertWave(x){
        let i=0;

        for(const s of this.skels){
            if(
                Math.abs(
                    s.x-x
                )<320
            ){
                if(s.state!=="alert"){
                    s.state="alert";
                    s.loseT=0;
                    s.bubbleDelay=i*45;
                    s.bubblePool="alert";
                    i++;
                }

                s.lastSeen=
                    this.player.cx;
            }
        }

        if(
            i>0&&
            this.alertSndT<=0
        ){
            this.sound.alertS();
            this.alertSndT=60;
        }
    }

    startCine(){
        this.cine={
            active:true,
            t:0,
            hold:0
        };

        this.camera.cinematic(true);

        this.sound.bridgeCrash();
        this.sound.setIntense(true);
    }

    updCine(){
        const c=this.cine;
        const m=this.map;

        c.t++;
        this.time++;

        if(c.t%7===0)
            this.camera.shake(
                2,
                3
            );

        const order=[
            10,9,11,8,12,7,13,6,14,5,
            15,4,16,3,17,2,18,1,19,0,20
        ];

        if(
            c.t>=26&&
            (c.t-26)%6===0
        ){
            const idx=
                order[
                    Math.floor(
                        (c.t-26)/6
                    )
                ];

            if(idx!==undefined){
                const p=
                    m.planks[idx];

                if(
                    p&&
                    !p.falling&&
                    !p.gone
                ){
                    p.falling=true;
                    p.vy=0;

                    this.particles.dust(
                        p.tx*10+5,
                        150,
                        5
                    );

                    this.sound.clackS();
                }
            }
        }

        for(const p of m.planks){
            if(
                p.falling&&
                !p.gone
            ){
                p.vy+=.3;
                p.oy+=p.vy;

                if(p.oy>34){
                    p.gone=true;

                    this.particles.bones(
                        p.tx*10+5,
                        176,
                        6
                    );

                    this.particles.dust(
                        p.tx*10+5,
                        176,
                        4
                    );
                }
            }
        }

        for(const s of this.skels){
            if(s.falling){
                s.vy+=.3;
                s.y+=s.vy;

                if(s.y>188){
                    this.particles.bones(
                        s.x,
                        176,
                        10
                    );

                    s.dead=true;
                }

                continue;
            }

            if(
                !m.solid(
                    Math.floor(
                        s.x/TILE
                    ),
                    15
                )
            ){
                s.falling=true;
                s.vy=0;
                continue;
            }

            s.dir=
                840>s.x
                ?1
                :-1;

            s.x+=s.dir*1.15;
            s.animT+=.15;
        }

        this.skels=
            this.skels.filter(
                s=>!s.dead
            );

        const allGone=
            m.planks.every(
                p=>p.gone
            );

        if(allGone&&c.t>150)
            c.hold++;

        if(
            (
                allGone&&
                c.hold>60
            )||
            c.t>460
        ){
            this.endCine();
        }
    }

    endCine(){
        this.cine.active=false;

        this.camera.cinematic(false);

        const m=this.map;

        m.bridgeDone=true;

        for(const s of this.skels){
            s.state="patrol";
            s.bubbleT=0;
            s.falling=false;

            s.x=
                clamp(
                    s.x,
                    s.minX,
                    s.maxX
                );
        }

        this.sound.setIntense(false);

        this.objective=
            "O PORTAO ESTA ABERTO. FUJA!";

        this.toast(
            "A PONTE DESABOU!"
        );

        this.sound.escapeS();
    }

    updateLighting1(){
        this.lighting.clear();

        /*
            Laboratório mais escuro entre as lâmpadas.
            Cada lâmpada possui intensidade própria.
        */
        this.lighting.darkness=.72;

        for(let i=0;i<this.map.lamps.length;i++){
            const L=this.map.lamps[i];

            if(L.dead)
                continue;

            const f=
                this.map.electric.flicker[i];

            const power=
                f
                ?f.power
                :1;

            if(power<.035)
                continue;

            const radius=
                L.broken
                ?42+power*30
                :50+power*32;

            const intensity=
                L.broken
                ?(.42+power*.5)
                :(.6+power*.4);

            this.lighting.addLight(
                L.tx*10+5,
                18,
                radius,
                intensity,
                L.broken
                ?"255,205,125"
                :"255,240,180"
            );
        }

        /* pequena luz fria do personagem */
        this.lighting.addLight(
            this.player.cx,
            this.player.cy,
            25,
            .20,
            "180,190,230"
        );

        /* luz de emergência do portão */
        if(this.hasKey){
            this.lighting.addLight(
                this.map.door.x+10,
                130,
                38,
                .25,
                "255,60,50"
            );
        }
    }

    updateLighting2(){
        this.lighting.clear();

        this.lighting.darkness=.7;

        this.lighting.addLight(
            Math.round(
                252-

            25,
            60,
            .4,
            "200,200,255"
        );

        for(const c of this.map.candles){

                this.lighting.addLight(
                    c.x,
                    c.y,
                    20,
                    .5,
                    "255,180,80"

            }
        }

        );

        for(const s of this.skels){

                this.lighting.addLight(

                    s.y-9,

                    .4,
                    "255,50,50"
                );
            }
        }

        );

        this.lighting.render(
            this.camera.sx

        );

        this.drawLamps();

    drawLamps(){
        if(!this.map||
           !this.map.lamps)
            return;

        for(let i=0;i<this.map.lamps.length;i++){
            const L=
                this.map.lamps[i];

            const sx=
                L.tx*10+5;

            if(
                sx<
                    this.camera.x-60||
                sx>
                    this.camera.x+W+60
            )
                continue;

            const f=
                this.map.electric.flicker[i];

            let power=
                f
                ?f.power
                :1;

            if(L.dead)
                power=0;

            /* suporte */
            ctx.fillStyle="#333340";

            ctx.fillRect(
                sx-3,
                9,
                6,
                3
            );

            ctx.fillStyle="#181820";

            ctx.fillRect(
                sx-5,
                10,
                2,
                4
            );

            ctx.fillRect(
                sx+3,
                10,
                2,
                4
            );

            /* fio */
            ctx.fillStyle="#20202a";

            ctx.fillRect(
                sx,
                3,
                1,
                7
            );

            /* base */
            ctx.fillStyle="#555566";

            ctx.fillRect(
                sx-2,
                12,
                4,
                2
            );

            if(power>.035){
                const warm=
                    L.broken
                    ?"#ffd36a"
                    :"#fff0aa";

                ctx.globalAlpha=
                    .65+
                    power*.35;

                ctx.fillStyle=warm;

                ctx.fillRect(
                    sx-1,
                    14,
                    3,
                    2
                );

                ctx.globalAlpha=1;

                ctx.fillStyle="#fff8d0";

                ctx.globalAlpha=
                    .5+
                    power*.5;

                ctx.fillRect(
                    sx,
                    14,
                    1,
                    1
                );

                ctx.globalAlpha=1;
            }else{
                ctx.fillStyle="#25252f";

                ctx.fillRect(
                    sx-1,
                    14,
                    3,
                    2
                );
            }

            if(L.broken){
                ctx.fillStyle="#5e3f29";

                ctx.fillRect(
                    sx-5,
                    15,
                    4,
                    1
                );

                if(
                    Math.random()<
                    .02*
                    (power+.35)
                ){
                    ctx.fillStyle="#8ed7ff";

                    ctx.fillRect(
                        sx-5,
                        15,
                        2,
                        1
                    );

                    ctx.fillRect(
                        sx-6,
                        17,
                        1,
                        1
                    );
                }
            }
        }

        ctx.globalAlpha=1;
    }

    drawApp(){
        const a=this.app;

        const x=Math.round(a.x);
        const y=140;

        ctx.fillStyle="#fff";

        for(let yy=0;yy<30;yy++){
            const w2=
                yy<7
                ?(
                    yy<2
                    ?2
                    :4
                )
                :(
                    6+
                    (
                        yy%7<3
                        ?1
                        :0
                    )
                );

            for(
                let xx=
                    -Math.floor(
                        w2/2
                    );
                xx<=Math.floor(w2/2);
                xx++
            ){
                if(
                    ((xx+yy)&1)===0
                ){
                    ctx.fillRect(
                        x+xx,
                        y+yy,
                        1,
                        1
                    );
                }
            }
        }

        ctx.fillStyle="#f00";

        ctx.fillRect(
            x-1,
            y+3,
            1,
            2
        );

        ctx.fillRect(
            x+1,
            y+3,
            1,
            2
        );
    }

    drawGame2(){
        const t=this.t;
        const m=this.map;

        ctx.fillStyle="#0a0a1a";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.save();

        ctx.translate(
            -this.camera.sx,
            this.camera.sy
        );

        m.draw(
            this.camera.x,
            t
        );

        for(const s of this.skels){
            this.drawSkel(s);
        }

        for(const s of this.skels){
            this.drawBubble(s);
        }

        this.drawEmergingSkels();

        if(this.player.hiding){
            ctx.globalAlpha=.5;

            this.player.draw();

            ctx.globalAlpha=1;
        }else if(this.invis.active>0){
            const shim=
                .3+
                .1*Math.sin(t*.2);

            ctx.globalAlpha=shim;

            this.player.draw();

            ctx.globalAlpha=1;

            ctx.fillStyle="#88ccff";
            ctx.globalAlpha=.1;

            ctx.fillRect(
                Math.round(
                    this.player.x-5
                ),
                Math.round(
                    this.player.y-4
                ),
                this.player.w+10,
                this.player.h+8
            );

            ctx.globalAlpha=1;
        }else{
            this.player.draw();
        }

        this.particles.draw(
            this.camera.x
        );

        ctx.restore();

        this.lighting.render(
            this.camera.sx
        );

        const closest=
            this.skels.length
            ?this.skels.reduce(
                (min,s)=>
                    Math.min(
                        min,
                        Math.abs(
                            s.x-
                            this.player.cx
                        )
                    ),
                999
            )
            :999;

        if(
            closest<120&&
            !this.player.hiding
        ){
            const intensity=
                1-
                closest/120;

            ctx.fillStyle="#f00";
            ctx.globalAlpha=
                intensity*.2;

            ctx.fillRect(
                0,
                0,
                W,
                H
            );

            ctx.globalAlpha=1;
        }

        this.drawHUD();
        this.drawInvisHUD();
        this.drawHideIndicator();
        this.drawDialog();
        this.drawToast();

        if(this.introT<200)
            this.drawLevelIntro();

        this.drawLetterbox();

        if(
            this.isTouch&&
            !this.dialog.active&&
            !this.cine.active
        ){
            this.drawTouch();
        }
    }

    drawEmergingSkels(){
        for(const e of this.emergingSkels){
            const sx=
                Math.round(
                    e.x-
                    this.camera.x
                );

            if(
                e.handUp&&
                e.t<60
            ){
                ctx.fillStyle="#dde";

                const amount=
                    Math.min(
                        6,
                        (e.t-30)*.2
                    );

                ctx.fillRect(
                    sx,
                    148-amount,
                    2,
                    amount
                );

                ctx.fillRect(
                    sx-1,
                    148-amount,
                    1,
                    2
                );

                ctx.fillRect(
                    sx+2,
                    148-amount,
                    1,
                    2
                );
            }

            if(e.t>20){
                ctx.fillStyle="#3a2818";
                ctx.globalAlpha=.5;

                ctx.fillRect(
                    sx-3,
                    147,
                    8,
                    3
                );

                ctx.globalAlpha=1;
            }
        }
    }

    drawSkel(s){
        const red=
            s.state!=="patrol";

        let img;

        const af=
            Math.floor(
                s.animT*2
            )%4;

        if(
            af===0||
            af===2
        ){
            img=
                red
                ?this.skel.r1
                :this.skel.w1;
        }else if(af===1){
            img=
                red
                ?this.skel.r2
                :this.skel.w2;
        }else{
            img=
                red
                ?this.skel.ratk
                :this.skel.atk;
        }

        const headOff=
            Math.sin(
                s.headBob
            );

        const x=
            Math.round(
                s.x-6
            );

        const y=
            Math.round(
                s.y-
                16+
                headOff*.5
            );

        ctx.fillStyle="#000";
        ctx.globalAlpha=.4;

        ctx.fillRect(
            x+1,
            s.y-1,
            10,
            2
        );

        ctx.globalAlpha=1;

        if(s.dir<0){
            ctx.save();

            ctx.translate(
                x+12,
                y
            );

            ctx.scale(
                -1,
                1
            );

            ctx.drawImage(
                img,
                0,
                0
            );

            ctx.restore();
        }else{
            ctx.drawImage(
                img,
                x,
                y
            );
        }

        if(red){
            const pulse=
                .5+
                .5*
                Math.sin(
                    this.t*.25
                );

            ctx.fillStyle="#f00";
            ctx.globalAlpha=pulse;

            const ex=
                s.dir<0
                ?x+8
                :x+4;

            ctx.fillRect(
                ex,
                y+2,
                1,
                1
            );

            ctx.fillRect(
                ex+
                    (
                        s.dir<0
                        ?-3
                        :3
                    ),
                y+2,
                1,
                1
            );

            ctx.globalAlpha=1;
        }
    }

    drawBubble(s){
        if(
            s.bubbleT<=0||
            !s.bubbleTxt
        )
            return;

        const txt=s.bubbleTxt;

        const w=
            textW(
                txt,
                1
            )+
            8;

        const bx=
            clamp(
                Math.round(
                    s.x-
                    w/2-
                    this.camera.x
                ),
                2,
                W-w-2
            );

        const by=
            Math.round(s.y)-32;

        ctx.fillStyle="#1a1a2a";

        ctx.fillRect(
            bx,
            by,
            w,
            12
        );

        ctx.fillStyle="#f66";

        ctx.fillRect(
            bx,
            by,
            w,
            1
        );

        ctx.fillRect(
            bx,
            by+11,
            w,
            1
        );

        drawText(
            txt,
            bx+4,
            by+4,
            1,
            "#fff"
        );
    }

    drawHUD(){
        const t=this.t;

        const obj=
            this.objective||
            (
                this.level===1
                ?(
                    this.hasKey
                    ?"ABRA O PORTAO"
                    :"ENCONTRE A CHAVE"
                )
                :"FUJA!"
            );

        const w=
            textW(obj,1)+28;

        const h=14;
        const x=4;
        const y=4;

        ctx.fillStyle="#0a0a1a";
        ctx.globalAlpha=.85;

        ctx.fillRect(
            x,
            y,
            w,
            h
        );

        ctx.globalAlpha=1;

        const intense=
            this.sound.intense;

        const pc=
            intense
            ?(
                (t>>3)%2
                ?"#f00"
                :"#f66"
            )
            :"#88a";

        ctx.fillStyle=pc;

        ctx.fillRect(
            x,
            y,
            w,
            1
        );

        ctx.fillRect(
            x,
            y+h-1,
            w,
            1
        );

        ctx.fillRect(
            x,
            y,
            1,
            h
        );

        ctx.fillRect(
            x+w-1,
            y,
            1,
            h
        );

        ctx.fillRect(
            x+3,
            y+3,
            8,
            8
        );

        ctx.fillStyle="#000";

        ctx.fillRect(
            x+4,
            y+4,
            6,
            6
        );

        ctx.fillStyle=pc;

        ctx.fillRect(
            x+6,
            y+6,
            2,
            2
        );

        drawText(
            obj,
            x+14,
            y+5,
            1,
            "#fff"
        );

        if(
            this.level===2&&
            this.map
        ){
            const progress=
                Math.min(
                    1,
                    this.player.x/1500
                );

            ctx.fillStyle="#223";

            ctx.fillRect(
                x,
                y+h+2,
                w,
                3
            );

            ctx.fillStyle=pc;

            ctx.fillRect(
                x+1,
                y+h+3,
                Math.floor(
                    (w-2)*progress

                1
            );
        }

    drawInvisHUD(){
        if(this.level!==2)
            return;

        const iv=this.invis;
        const t=this.t;

        const ready=
            iv.cd<=0&&
            iv.active<=0;

        const w=56;
        const h=10;
        const x=W-w-4;
        const y=4;

        ctx.fillStyle="#0a0a1a";
        ctx.globalAlpha=.85;

        ctx.fillRect(
            x,
            y,
            w,
            h
        );

        ctx.globalAlpha=1;

        const col=
            (
                iv.denyT>0&&
                ((t>>2)%2)
            )
            ?"#f66"
            :(
                ready
                ?"#8cf"
                :"#667"
            );

        ctx.fillStyle=col;

        ctx.fillRect(
            x,
            y,
            w,
            1
        );

        ctx.fillRect(
            x,
            y+h-1,
            w,
            1
        );

        ctx.fillRect(
            x,
            y,
            1,
            h
        );

        ctx.fillRect(
            x+w-1,
            y,
            1,
            h
        );

        drawText(
            "R",
            x+3,
            y+2,
            1,
            col
        );

        const bx=x+10;
        const bw=w-14;
        const by=y+3;
        const bh=4;

        ctx.fillStyle="#223";

        ctx.fillRect(
            bx,
            by,
            bw,
            bh
        );

        let fill=0;
        let fcol="#8cf";

        if(iv.active>0){
            fill=
                iv.active/300;
        }else if(iv.cd>0){
            fill=
                1-
                iv.cd/900;

            fcol="#88a";
        }else{
            fill=1;
        }

        ctx.fillStyle=fcol;

        ctx.fillRect(
            bx+1,
            by+1,
            Math.floor(
                (bw-2)*
                clamp(fill,0,1)
            ),
            bh-2
        );
    }

    drawDialog(){
        const d=this.dialog;

        if(!d.active)
            return;

        const pl=
            d.pages[d.page];

        if(!pl)
            return;

        ctx.fillStyle="#1a1a2a";

        ctx.fillRect(
            12,
            44,
            296,
            54
        );

        ctx.fillStyle="#88a";

        ctx.fillRect(
            12,
            44,
            296,
            1
        );

        ctx.fillRect(
            12,
            97,
            296,
            1
        );

        let left=
            Math.floor(
                d.n
            );

        for(let i=0;i<pl.length;i++){
            const take=
                Math.max(
                    0,
                    Math.min(
                        pl[i].length,
                        left
                    )
                );

            if(take>0){
                drawText(
                    pl[i].substring(
                        0,
                        take
                    ),
                    20,
                    52+i*14,
                    2,
                    "#fff"
                );

            left-=pl[i].length;
        }
    }

    drawToast(){
        if(!this.toastCur)
            return;

        const lines=
            this.toastLines.length
            ?this.toastLines
            :[
                this.toastCur
            ];

        let wMax=0;

        for(const l of lines){
            wMax=Math.max(
                wMax,
                textW(l,2)
            );
        }

        const bw=wMax+18;
        const bh=
            lines.length*13+
            12;

        const bx=
            Math.round(
                (W-bw)/2
            );

        const by=
            112-bh;

        ctx.fillStyle="#1a1a2a";

        ctx.fillRect(
            bx,
            by,
            bw,
            bh
        );

        ctx.fillStyle="#88a";

        ctx.fillRect(
            bx,
            by,
            bw,
            1
        );

        ctx.fillRect(
            bx,
            by+bh-1,
            bw,
            1
        );

        for(let i=0;i<lines.length;i++){
            drawText(
                lines[i],
                W/2,
                by+8+i*13,
                2,
                "#fff",
                "center"
            );
        }

        if(((this.t>>4)%2)===0){
            drawText(
                this.isTouch
                ?"TOQUE"
                :"ENTER",

                by+bh+4,

                "#556",

        }

        if(dens>0){
            for(let y=0;y<H;y+=2){

                            y,
                            2,

        if(tt>40){

                    70,

                    "#88a",

                );

    drawTouch(){
        const f=
            this.touchFlags();

        const B=this.btns;

        const box=(b,pr)=>{
            ctx.fillStyle=
                pr
                ?"#88a"
                :"#1a1a2a";

            ctx.fillRect(
                b.x,
                b.y,
                b.w,
                b.h
            );

            ctx.fillStyle=
                pr
                ?"#000"
                :"#88a";

            ctx.fillRect(
                b.x,
                b.y,
                b.w,
                1
            );

            ctx.fillRect(
                b.x,
                b.y+b.h-1,
                b.w,
                1
            );

            ctx.fillRect(
                b.x,
                b.y,
                1,
                b.h
            );

            ctx.fillRect(
                b.x+b.w-1,
                b.y,
                1,
                b.h
            );
        };

        const arrow=
            (x,y,dir,col)=>{
                ctx.fillStyle=col;

                for(let r=0;r<9;r++){
                    const wd=
                        9-
                        Math.abs(
                            4-r
                        );

                    if(dir<0){
                        ctx.fillRect(
                            x+
                                Math.abs(
                                    4-r
                                ),
                            y+r,
                            wd,
                            1
                        );
                    }else{
                        ctx.fillRect(
                            x,
                            y+r,
                            wd,
                            1
                        );
                    }
                }
            };

        const triUp=
            (x,y,col)=>{
                ctx.fillStyle=col;

                for(let r=0;r<9;r++){
                    const wd=
                        Math.max(
                            1,
                            Math.round(
                                (r/8)*11
                            )
                        );

                    ctx.fillRect(
                        x+
                            Math.floor(
                                (11-wd)/2
                            ),
                        y+r,
                        wd,
                        1
                    );
                }
            };

        box(
            B.l,
            f.l
        );

        arrow(
            B.l.x+15,
            B.l.y+13,
            -1,
            f.l
            ?"#000"
            :"#fff"
        );

        box(
            B.r,
            f.r
        );

        arrow(
            B.r.x+16,
            B.r.y+13,
            1,
            f.r
            ?"#000"
            :"#fff"
        );

        box(
            B.a,
            f.a
        );

        drawText(
            "E",
            B.a.x+B.a.w/2,
            B.a.y+14,
            2,
            f.a
            ?"#000"
            :"#fff",
            "center"
        );

        box(
            B.j,
            f.j
        );

        triUp(
            B.j.x+16,
            B.j.y+12,
            f.j
            ?"#000"
            :"#fff"
        );

        if(this.level===2){
            box(
                B.r2,
                f.r2
            );

            drawText(
                "R",
                B.r2.x+B.r2.w/2,
                B.r2.y+13,
                2,
                f.r2
                ?"#000"
                :"#8cf",
                "center"
            );
        }

        ctx.fillStyle="#556";

        ctx.fillRect(
            292,
            2,
            26,
            12
        );

        ctx.fillStyle="#1a1a2a";

        ctx.fillRect(
            293,
            3,
            24,
            10
        );

        drawText(
            "MENU",
            296,
            5,
            1,
            "#88a"
        );
    }

    drawGhostIntro(){

            this.ghostIntro;

            0,
            0,
            W,
            H
        );

                ctx.globalAlpha=.8;

                ctx.drawImage(
                    pieces[i],
                    W/2+
                        Math.cos(angle)*
                        dist-
                        8,
                    H/2+
                        Math.sin(angle)*
                        dist-
                        8
                );
            }

            ctx.globalAlpha=1;

            drawTextSh(
                "RESSUSCITANDO...",
                W/2,
                30,
                2,
                "#fff",
                "center"
            );

            const progress=
                (t-60)/60;

            const pieces=
                this.ghost.frames.pieces;

            for(let i=0;i<9;i++){
                const angle=
                    (i/9)*6.28;

                const dist=
                    40*
                    (1-progress);

                ctx.globalAlpha=
                    .5+
                    progress*.5;

                ctx.drawImage(
                    pieces[i],
                    W/2+
                        Math.cos(angle)*
                        dist-
                        8,
                    H/2+
                        Math.sin(angle)*
                        dist-
                        8
                );
            }

            ctx.globalAlpha=1;

            drawTextSh(
                "MONTANDO...",
                W/2,
                30,
                2,
                "#fff",
                "center"
            );
        }else{
            const gf=
                this.ghost.frames.idle[0];

            ctx.globalAlpha=
                .9+
                .1*
                Math.sin(t*.1);

            drawSpr(
                gf,
                W/2-8,
                H/2-8,
                false
            );

            ctx.globalAlpha=1;

            if(
                t>160&&
                ((t>>3)%2)===0
            ){
                drawText(
                    this.isTouch
                    ?"TOQUE"
                    :"QUALQUER TECLA",
                    W/2,
                    H-30,
                    1,
                    "#888",
                    "center"
                );
            }
        }

        this.particles.draw(0);
    }

    fmt(frames){
        const s=
            Math.floor(
                frames/60
            );

        const m=
            Math.floor(
                s/60
            );

        return(
            String(m).padStart(2,"0")+
            ":"+
            String(
                s%60
            ).padStart(2,"0")
        );
    }

    start(){
        this.last=
            performance.now();

        const loop=ts=>{
            requestAnimationFrame(
                loop
            );

            let dt=
                ts-
                this.last;

            this.last=ts;

            if(dt>200)
                dt=200;

            this.acc+=dt;

            let n=0;

            while(
                this.acc>=16.6667&&
                n<5
            ){
                this.stepF(
                    16.6667
                );

                this.acc-=16.6667;
                n++;
            }

            this.draw();
        };

        requestAnimationFrame(
            loop
        );
    }
}


/* =========================================================
   START
========================================================= */

let game=new Game();

game.start();

</script>
