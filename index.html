"use strict";

const W=320,H=180,TILE=10,MW=88,MH=18,MW2=160;

const ctx=canvas.getContext("2d");

const lightCanvas=document.createElement("canvas");
lightCanvas.width=W;
lightCanvas.height=H;

const lctx=lightCanvas.getContext("2d");

let RK=1;

function fit(){
    const s=Math.min(innerWidth/W,innerHeight/H);

    const cssW=Math.max(
        1,
        Math.floor(W*s)
    );

    const cssH=Math.max(
        1,
        Math.floor(H*s)
    );

    RK=Math.max(
        1,
        Math.min(
            4,
            Math.ceil(
                s*(window.devicePixelRatio||1)
            )
        )
    );

    canvas.width=W*RK;
    canvas.height=H*RK;

    ctx.setTransform(
        RK,
        0,
        0,
        RK,
        0,
        0
    );

    ctx.imageSmoothingEnabled=false;

    canvas.style.width=cssW+"px";
    canvas.style.height=cssH+"px";
}

addEventListener("resize",fit);
document.addEventListener("fullscreenchange",fit);

fit();

function hash(x,y){
    let n=
        Math.imul(x|0,374761393)+
        Math.imul(y|0,668265263);

    n=Math.imul(
        n^(n>>>13),
        1274126177
    );

    return (n^(n>>>16))>>>0;
}

function clamp(v,a,b){
    return v<a?a:(v>b?b:v);
}

function lerp(a,b,t){
    return a+(b-a)*t;
}

function rng(a,b){
    return a+Math.random()*(b-a);
}

function wrapText(str,max){
    const words=String(str).split(" ");
    const out=[];
    let cur="";

    for(let w of words){
        const t=cur?cur+" "+w:w;

        if(t.length<=max){
            cur=t;
        }else{
            if(cur)out.push(cur);

            if(w.length>max){
                while(w.length>max){
                    out.push(w.slice(0,max));
                    w=w.slice(max);
                }

                cur=w;
            }else{
                cur=w;
            }
        }
    }

    if(cur)out.push(cur);

    return out;
}

function textW(s,sc){
    return s.length?(s.length*5-1)*sc:0;
}

function drawText(s,x,y,sc,col,align,g){
    g=g||ctx;

    if(align==="center")
        x-=textW(s,sc)/2;
    else if(align==="right")
        x-=textW(s,sc);

    x=Math.round(x);
    y=Math.round(y);

    g.fillStyle=col;

    for(let i=0;i<s.length;i++){
        const gl=FONT[s[i]];

        if(!gl)continue;

        for(let r=0;r<5;r++){
            const bits=gl[r];

            for(let b=0;b<4;b++){
                if(bits.charCodeAt(b)===49){
                    g.fillRect(
                        x+i*5*sc+b*sc,
                        y+r*sc,
                        sc,
                        sc
                    );
                }
            }
        }
    }
}

function drawTextSh(s,x,y,sc,col,align){
    drawText(
        s,
        x+sc,
        y+sc,
        sc,
        "#000",
        align
    );

    drawText(
        s,
        x,
        y,
        sc,
        col,
        align
    );
}

function textSources(text,sc,x,y){
    const w=textW(text,sc);
    const h=5*sc;

    const oc=document.createElement("canvas");

    oc.width=w;
    oc.height=h;

    const o=oc.getContext("2d");

    drawText(
        text,
        0,
        0,
        sc,
        "#fff",
        "left",
        o
    );

    const d=o.getImageData(
        0,
        0,
        w,
        h
    ).data;

    const out=[];

    for(let cx=0;cx<w;cx++){
        for(let cy=h-1;cy>=0;cy--){
            if(
                d[
                    (cy*w+cx)*4+3
                ]>0
            ){
                if(Math.random()<.16){
                    out.push({
                        x:x+cx,
                        y:y+cy+1
                    });
                }

                break;
            }
        }
    }

    return out;
}

========================================================= */

class ParticleSystem{
    constructor(){
        this.pool=[];
        this.max=600;
        this.active=[];
    }

    spawn(
        x,
        y,
        vx,
        vy,
        life,
        size,
        col,
        grav,
        type,
        extra
    ){
        if(this.active.length>=this.max)return;

        this.active.push({
            x,
            y,
            vx,
            vy,
            life,
            maxLife:life,
            size,
            col,
            grav,
            type:0,
            rot:0,
            rotV:0,
            pulse:0,
            alpha:1,
            ...(extra||{})
        });
    }

    puff(x,y,n,col){
        for(let i=0;i<n;i++){
            const a=Math.random()*6.28;
            const s=rng(.5,2.5);

            this.spawn(
                x,
                y,
                Math.cos(a)*s,
                Math.sin(a)*s-rng(.5,2),
                rng(20,45),
                rng(1,3),
                col||"#999",
                .04
            );
        }
    }

    burst(x,y,n,col){
        for(let i=0;i<n;i++){
            const a=Math.random()*6.28;
            const s=rng(1,4);

            this.spawn(
                x,
                y,
                Math.cos(a)*s,
                Math.sin(a)*s-rng(1,3),
                rng(25,55),
                rng(1,3),
                col||"#fff",
                .06
            );
        }
    }

    bones(x,y,n){
        for(let i=0;i<n;i++){
            this.spawn(
                x,
                y,
                rng(-2.5,2.5),
                rng(-4,-1),
                rng(30,60),
                rng(1,2),
                Math.random()<.7?"#fff":"#ddd",
                .12,
                0,
                {
                    rot:Math.random()*6.28,
                    rotV:rng(-.2,.2)
                }
            );
        }
    }

    dust(x,y,n){
        for(let i=0;i<n;i++){
            this.spawn(
                x+rng(-5,5),
                y+rng(-2,2),
                rng(-.3,.3),
                rng(-.5,-.1),
                rng(40,80),
                1,
                "#666",
                -.01
            );
        }
    }

    smoke(x,y,n){
        for(let i=0;i<n;i++){
            this.spawn(
                x+rng(-3,3),
                y,
                rng(-.3,.3),
                rng(-1,-.4),
                rng(50,100),
                rng(2,5),
                "#333",
                -.02
            );
        }
    }

    sparkle(x,y,n,col){
        for(let i=0;i<n;i++){
            this.spawn(
                x+rng(-8,8),
                y+rng(-8,8),
                rng(-.8,.8),
                rng(-1.5,-.3),
                rng(15,35),
                rng(1,2),
                col||"#fff",
                -.02,
                0,
                {
                    pulse:Math.random()*6.28
                }
            );
        }
    }

    blood(x,y,n){
        for(let i=0;i<n;i++){
            const a=rng(-2.5,-.6);

            this.spawn(
                x,
                y,
                Math.cos(a)*rng(1,3),
                Math.sin(a)*rng(1,3),
                rng(30,70),
                rng(1,3),
                "#c00",
                .15
            );
        }
    }

    leaves(x,y,n){
        for(let i=0;i<n;i++){
            this.spawn(
                x+rng(-20,20),
                y+rng(-10,5),
                rng(-.5,.5),
                rng(.2,.8),
                rng(60,120),
                rng(1,2),
                "#553322",
                .02,
                0,
                {
                    rot:Math.random()*6.28,
                    rotV:rng(-.05,.05)
                }
            );
        }
    }

    embers(x,y,n){
        for(let i=0;i<n;i++){
            this.spawn(
                x+rng(-3,3),
                y,
                rng(-.3,.3),
                rng(-1.5,-.5),
                rng(30,60),
                rng(1,2),
                Math.random()<.5?"#ff6600":"#ffaa00",
                -.03,
                0,
                {
                    pulse:Math.random()*6.28
                }
            );
        }
    }

    fireflies(x,y,n){
        for(let i=0;i<n;i++){
            this.spawn(
                x+rng(-30,30),
                y+rng(-20,10),
                rng(-.2,.2),
                rng(-.3,.1),
                rng(80,160),
                1,
                "#aaffaa",
                0,
                0,
                {
                    pulse:Math.random()*6.28
                }
            );
        }
    }

    invisTrail(x,y){
        this.spawn(
            x+rng(-6,6),
            y+rng(-4,4),
            rng(-.3,.3),
            rng(-.8,-.2),
            rng(20,35),
            rng(1,2),
            "#88CCFF",
            -.01,
            0,
            {
                pulse:Math.random()*6.28
            }
        );
    }

    deathBurst(x,y){
        for(let i=0;i<40;i++){
            const a=Math.random()*6.28;
            const s=rng(2,6);

            const cols=[
                "#c00",
                "#f33",
                "#fff",
                "#888"
            ];

            this.spawn(
                x,
                y,
                Math.cos(a)*s,
                Math.sin(a)*s-rng(2,5),
                rng(40,90),
                rng(1,5),
                cols[i%4],
                .12
            );
        }
    }

    update(){
        for(let i=this.active.length-1;i>=0;i--){
            const p=this.active[i];

            p.x+=p.vx;
            p.y+=p.vy;
            p.vy+=p.grav;
            p.life--;

            if(p.rotV)p.rot+=p.rotV;
            if(p.pulse!==undefined)p.pulse+=.15;

            if(p.life<=0)
                this.active.splice(i,1);
        }
    }

    draw(cam){
        for(const p of this.active){
            const alpha=clamp(
                p.life/p.maxLife,
                0,
                1
            );

            const sx=Math.round(p.x-cam);
            const sy=Math.round(p.y);

            if(
                sx<-10||
                sx>W+10
            )continue;

            ctx.globalAlpha=alpha;
            ctx.fillStyle=p.col;

            const sz=Math.ceil(
                p.size*alpha
            );

            if(p.pulse!==undefined){
                ctx.globalAlpha=
                    alpha*
                    (
                        .5+
                        .5*
                        Math.sin(p.pulse)
                    );
            }

            if(p.rotV){
                ctx.save();

                ctx.translate(
                    sx,
                    sy
                );

                ctx.rotate(p.rot);

                ctx.fillRect(
                    -sz/2,
                    -1,
                    sz,
                    2
                );

                ctx.restore();
            }else{
                ctx.fillRect(
                    sx,
                    sy,
                    sz,
                    sz
                );
            }
        }

        ctx.globalAlpha=1;
    }

    clear(){
        this.active.length=0;
    }
}

class Sound{
    constructor(){
        this.ctx=null;
        this.ok=false;
        this.musicOn=true;
        this.inGame=false;
        this.intense=false;
        this.step=0;
        this.nextT=0;
        this.bar=0;
        this.bpm=95;
        this.ambStep=0;
        this.ambNextT=0;
        this.panner=null;

        try{
            const v=
                localStorage.getItem(
                    "os_music"
                );

            if(v!==null)
                this.musicOn=v==="1";
        }catch(e){}
    }

    unlock(){
        if(this.ok){
            if(
                this.ctx&&
                this.ctx.state==="suspended"
            ){
                this.ctx.resume();
            }

            return;
        }

        const A=
            window.AudioContext||
            window.webkitAudioContext;

        if(!A)return;

        try{
            this.ctx=new A();
        }catch(e){
            return;
        }

        const c=this.ctx;

        this.master=c.createGain();
        this.master.gain.value=.7;
        this.master.connect(c.destination);

        this.comp=
            c.createDynamicsCompressor();

        this.comp.connect(
            this.master
        );

        this.mus=c.createGain();

        this.mus.gain.value=
            this.musicOn?.85:0;

        this.mus.connect(
            this.comp
        );

        this.ambMus=c.createGain();
        this.ambMus.gain.value=0;
        this.ambMus.connect(
            this.comp
        );

        this.sfxG=c.createGain();
        this.sfxG.gain.value=1.3;
        this.sfxG.connect(
            this.master
        );

        this.ambG=c.createGain();
        this.ambG.gain.value=.7;
        this.ambG.connect(
            this.master
        );

        this.ok=true;

        this.nextT=
            c.currentTime+.15;

        this.ambNextT=
            c.currentTime+.15;
    }

    setMusic(v){
        this.musicOn=v;

        try{
            localStorage.setItem(
                "os_music",
                v?"1":"0"
            );
        }catch(e){}

        if(this.ok){
            this.mus.gain.setTargetAtTime(
                (v&&!this.inGame)?.85:0,
                this.ctx.currentTime,
                .15
            );
        }
    }

    setGameMode(g){
        this.inGame=g;

        if(!this.ok)return;

        const t=this.ctx.currentTime;

        this.mus.gain.setTargetAtTime(
            (this.musicOn&&!g)?.85:0,
            t,
            .3
        );

        this.ambMus.gain.setTargetAtTime(
            g?.18:0,
            t,
            .3
        );
    }

    setIntense(v){
        this.intense=v;
    }

    tone(f,d,o){
        if(!this.ok)return;

        o=o||{};

        const c=this.ctx;
        const t=
            c.currentTime+
            (o.at||0);

        const os=
            c.createOscillator();

        const g=
            c.createGain();

        os.type=
            o.type||
            "square";

        os.frequency.setValueAtTime(
            f,
            t
        );

        if(o.slide){
            os.frequency.exponentialRampToValueAtTime(
                o.slide,
                t+d
            );
        }

        g.gain.setValueAtTime(
            o.v||.16,
            t
        );

        g.gain.exponentialRampToValueAtTime(
            .0001,
            t+d
        );

        os.connect(g);
        g.connect(this.sfxG);

        os.start(t);
        os.stop(t+d+.02);
    }

    click(){
        this.tone(
            900,
            .05,
            {
                v:.1
            }
        );

            buf.getChannelData(0);

        for(let i=0;i<d.length;i++){
            d[i]=
                (Math.random()*2-1)*.12;

        n.buffer=buf;

        const f=c.createBiquadFilter();

        f.type="lowpass";
        f.frequency.value=400;

        const g=c.createGain();

        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.05,t+.5);
        g.gain.exponentialRampToValueAtTime(.001,t+2);

        n.connect(f);
        f.connect(g);
        g.connect(this.ambG);

        n.start(t);
        n.stop(t+2);

                this.tone(
                    f,
                    .06,
                    {
                        v:.08,
                        at:.3+i*.1
                    }
                );
            }
        );
    }

    tick(){
        if(!this.ok)return;

        const c=this.ctx;

        if(c.state!=="running")
            return;

        const beatLen=60/this.bpm;
        const sixteenth=beatLen/4;

        if(!this.inGame&&this.musicOn){
            if(
                this.nextT<
                c.currentTime-.5
            ){
                this.nextT=
                    c.currentTime+.1;
            }

            while(
                this.nextT<
                c.currentTime+.8
            ){
                this.schedBeat(
                    this.step,
                    this.nextT
                );

                this.step=
                    (this.step+1)%64;

                if(this.step===0)
                    this.bar++;

                this.nextT+=sixteenth;
            }
        }

        if(this.inGame){
            const ambSix=
                beatLen/2;

            if(
                this.ambNextT<
                c.currentTime-.5
            ){
                this.ambNextT=
                    c.currentTime+.1;
            }

            while(
                this.ambNextT<
                c.currentTime+.8
            ){
                this.schedAmbient(
                    this.ambStep,
                    this.ambNextT
                );

                this.ambStep=
                    (this.ambStep+1)%32;

                this.ambNextT+=ambSix;
            }
        }
    }

    schedBeat(s,t){
        const c=this.ctx;

        if(s%16===0){
            const prog=[
                [220,277.18,329.63],
                [196,246.94,293.66],
                [246.94,311.13,369.99],
                [174.61,220,261.63]
            ];

            const ch=
                prog[this.bar%4];

            for(const f of ch){
                const o=c.createOscillator();
                const o2=c.createOscillator();
                const g=c.createGain();
                const fl=c.createBiquadFilter();

                o.type="sine";
                o.frequency.value=f;

                o2.type="sine";
                o2.frequency.value=
                    f*1.005;

                fl.type="lowpass";
                fl.frequency.value=800;

                g.gain.setValueAtTime(
                    0,
                    t
                );

                g.gain.linearRampToValueAtTime(
                    .04,
                    t+.3
                );

                g.gain.setValueAtTime(
                    .04,
                    t+1.8
                );

                g.gain.exponentialRampToValueAtTime(
                    .001,
                    t+2.5
                );

                o.connect(fl);
                o2.connect(fl);
                fl.connect(g);
                g.connect(this.mus);

                o.start(t);
                o2.start(t);

                o.stop(t+2.6);
                o2.stop(t+2.6);
            }
        }

        if(s%4===0){
            const notes=[
                440,
                523.25,
                587.33,
                659.25,
                783.99,
                659.25,
                587.33,
                523.25
            ];

            const o=c.createOscillator();
            const g=c.createGain();
            const fl=c.createBiquadFilter();

            o.type="sine";

            o.frequency.value=
                notes[(s/4)%8]*2;

            fl.type="lowpass";
            fl.frequency.value=1200;

            g.gain.setValueAtTime(
                0,
                t
            );

            g.gain.linearRampToValueAtTime(
                .03,
                t+.05
            );

            g.gain.exponentialRampToValueAtTime(
                .001,
                t+.6
            );

            o.connect(fl);
            fl.connect(g);
            g.connect(this.mus);

            o.start(t);
            o.stop(t+.7);
        }

        if(s%16===0){
            const bass=[
                110,
                98,
                116.54,
                82.41
            ];

            const o=c.createOscillator();
            const g=c.createGain();
            const fl=c.createBiquadFilter();

            o.type="sine";

            o.frequency.value=
                bass[Math.floor(s/16)%4];

            fl.type="lowpass";
            fl.frequency.value=300;

            g.gain.setValueAtTime(
                0,
                t
            );

            g.gain.linearRampToValueAtTime(
                .08,
                t+.1
            );

            g.gain.exponentialRampToValueAtTime(
                .001,
                t+2
            );

            o.connect(fl);
            fl.connect(g);
            g.connect(this.mus);

            o.start(t);
            o.stop(t+2.1);
        }
    }

    schedAmbient(s,t){
        const c=this.ctx;

        if(s===0){
            const o=c.createOscillator();
            const o2=c.createOscillator();
            const g=c.createGain();
            const fl=c.createBiquadFilter();

            o.type="sine";
            o.frequency.value=55;

            o2.type="sine";
            o2.frequency.value=82.41;

            fl.type="lowpass";
            fl.frequency.value=200;

            g.gain.setValueAtTime(
                0,
                t
            );

            g.gain.linearRampToValueAtTime(
                .08,
                t+.5
            );

            g.gain.setValueAtTime(
                .08,
                t+3.5
            );

            g.gain.exponentialRampToValueAtTime(
                .001,
                t+4
            );

            o.connect(fl);
            o2.connect(fl);
            fl.connect(g);
            g.connect(this.ambMus);

            o.start(t);
            o2.start(t);

            o.stop(t+4.1);
            o2.stop(t+4.1);
        }

        if(s%16===8){
            const o=c.createOscillator();
            const g=c.createGain();

            o.type="sine";
            o.frequency.value=36.7;

            g.gain.setValueAtTime(
                0,
                t
            );

            g.gain.linearRampToValueAtTime(
                .06,
                t+.4
            );

            g.gain.exponentialRampToValueAtTime(
                .001,
                t+2
            );

            o.connect(g);
            g.connect(this.ambMus);

            o.start(t);
            o.stop(t+2);
        }
    }
}


/* =========================================================
   CAMERA
========================================================= */

class Camera{
    constructor(){
        this.x=0;
        this.y=0;
        this.targetX=0;
        this.shakeX=0;
        this.shakeY=0;
        this.shakeMag=0;
        this.shakeDur=0;
        this.zoom=1;
        this.targetZoom=1;
        this.letterbox=0;
        this.targetLetterbox=0;
        this.freeze=false;
    }

    follow(px,face,mapW){
        this.targetX=
            clamp(
                px-160+face*24,
                0,
                mapW-W
            );
    }

    update(){
        if(!this.freeze){
            this.x+=
                (
                    this.targetX-this.x
                )*.1;
        }

        this.zoom+=
            (
                this.targetZoom-this.zoom
            )*.05;

        this.letterbox+=
            (
                this.targetLetterbox-
                this.letterbox
            )*.08;

        if(this.shakeDur>0){
            this.shakeDur--;

            this.shakeX=
                (Math.random()-.5)*
                this.shakeMag;

            this.shakeY=
                (Math.random()-.5)*
                this.shakeMag;

            this.shakeMag*=.92;
        }else{
            this.shakeX=0;
            this.shakeY=0;
        }
    }

    shake(mag,dur){
        this.shakeMag=mag;
        this.shakeDur=dur;
    }

    cinematic(on){
        this.targetLetterbox=
            on?20:0;

        this.freeze=on;
    }

    get sx(){
        return Math.round(
            this.x+this.shakeX
        );
    }

    get sy(){
        return Math.round(
            this.shakeY
        );
    }
}


/* =========================================================
   LIGHTING
========================================================= */

class LightingSystem{
    constructor(){
        this.lights=[];
        this.darkness=.65;
    }

    clear(){
        this.lights.length=0;
    }

    addLight(
        x,
        y,
        radius,
        intensity,
        color
    ){
        this.lights.push({
            x,
            y,
            radius,
            intensity,
            color:
                color||
                "255,200,100"
        });
    }

    render(cam){
        lctx.clearRect(
            0,
            0,
            W,
            H
        );

        lctx.fillStyle=
            `rgba(0,0,20,${this.darkness})`;

        lctx.fillRect(
            0,
            0,
            W,
            H
        );

        lctx.globalCompositeOperation=
            "destination-out";

        for(const l of this.lights){
            const sx=l.x-cam;

            if(
                sx<-l.radius||
                sx>W+l.radius
            )continue;

            const grad=
                lctx.createRadialGradient(
                    sx,
                    l.y,
                    0,
                    sx,
                    l.y,
                    l.radius
                );

            grad.addColorStop(
                0,
                `rgba(0,0,0,${l.intensity})`
            );

            grad.addColorStop(
                .35,
                `rgba(0,0,0,${l.intensity*.75})`
            );

            grad.addColorStop(
                .7,
                `rgba(0,0,0,${l.intensity*.4})`
            );

            grad.addColorStop(
                1,
                "rgba(0,0,0,0)"
            );

            lctx.fillStyle=grad;

            lctx.fillRect(
                sx-l.radius,
                l.y-l.radius,
                l.radius*2,
                l.radius*2
            );
        }

        lctx.globalCompositeOperation=
            "source-over";

        ctx.drawImage(
            lightCanvas,
            0,
            0
        );
    }
}


/* =========================================================
   EVENTS
========================================================= */

class EventSystem{
    constructor(game){
        this.game=game;
        this.cooldowns={};
        this.events=[];
    }

    canTrigger(name,cd){
        const now=this.game.t;

        return !this.cooldowns[name]||
            now-this.cooldowns[name]>cd;
    }

    trigger(name){
        this.cooldowns[name]=this.game.t;
    }

    update(){
        const g=this.game;

        if(g.state!=="game")
            return;

        if(
            this.canTrigger("crow",600)&&
            Math.random()<.003
        ){
            this.trigger("crow");
            g.sound.crowCaw();
        }

        if(
            this.canTrigger("wind",400)&&
            Math.random()<.004
        ){
            this.trigger("wind");
            g.sound.windAmbient();

            g.particles.leaves(
                g.cam+Math.random()*W,
                100,
                3
            );
        }

        if(
            this.canTrigger("distant",800)&&
            Math.random()<.002
        ){
            this.trigger("distant");

            if(g.level===2)
                g.sound.bellToll();
            else
                g.sound.dripSound();
        }

        if(
            g.level===2&&
            this.canTrigger("emerge",1200)&&
            Math.random()<.001
        ){
            this.trigger("emerge");

            const ex=
                g.player.x+
                rng(80,200)*
                (
                    Math.random()<.5
                    ?-1
                    :1
                );

            g.spawnEmergingSkeleton(
                clamp(
                    ex,
                    20,
                    MW2*TILE-20
                )
            );

            g.sound.skelEmerge();
            g.camera.shake(3,15);
        }
    }
}


/* =========================================================
   GHOST
========================================================= */

class Ghost{
    constructor(){
        this.pal={
            "1":"#FFFFFF",
            "2":"#E8E8E8",
            "3":"#B8B8B8",
            "4":"#000000"
        };

        this.base=[
            "0000000000000000",
            "0000011111100000",
            "0001111111111000",
            "0011111111111100",
            "0111111111111110",
            "0111111111111110",
            "0111111111111110",
            "0111111111111110",
            "0111111111111110",
            "0111111111111110",
            "0111111111111110",
            "0111111111111110",
            "0111111111111110",
            "0111111111111110"
        ];

        this.frames={
            idle:[],
            walk:[],
            jump:[],
            hide:[],
            pieces:[]
        };

        this.build();
    }

    compose(o){
        const rows=
            this.base.map(
                r=>r.split("")
            );

        const dx=o.dx||0;

        const cols=[
            4+dx,
            5+dx,
            10+dx,
            11+dx
        ];

        const put=(r,c,v)=>{
            if(c>=0&&c<16)
                rows[r][c]=v;
        };

        if(o.wide){
            [5,6,7].forEach(
                r=>{
                    cols.forEach(
                        c=>put(r,c,"4")
                    );
                }
            );
        }else if(o.blink){
            cols.forEach(
                c=>put(7,c,"4")
            );
        }else{
            [6,7].forEach(
                r=>{
                    cols.forEach(
                        c=>put(r,c,"4")
                    );
                }
            );
        }

        cols.forEach(
            c=>put(8,c,"3")
        );

        if(o.mouth==="o"){
            put(10,7,"4");
            put(10,8,"4");
            put(11,7,"4");
            put(11,8,"4");
        }else{
            put(10,7,"4");
            put(10,8,"4");
        }

        for(let r=4;r<=12;r++)
            put(r,13,"2");

        const out=
            rows.map(
                r=>r.join("")
            );

        out.push(o.tail);
        out.push(
            o.r15||
            "0000000000000000"
        );

        return out;
    }

    mk(rows){
        const c=
            document.createElement(
                "canvas"
            );

        c.width=16;
        c.height=16;

        const g=c.getContext("2d");

        for(let y=0;y<16;y++){
            const r=rows[y];

            for(let x=0;x<16;x++){
                const ch=r[x];

                if(ch!=="0"){
                    g.fillStyle=
                        this.pal[ch];

                    g.fillRect(
                        x,
                        y,
                        1,
                        1
                    );
                }
            }
        }

        return c;
    }

    build(){
        const T1="0111011101110110";
        const T2="0110111011101100";
        const T3="0111011011101110";
        const T4="0101101101101010";

        const TJ="0111111111111110";
        const TJ2="0011001100110000";
        const TJ3="0101010101010101";

        const TW1="0110111011101110";
        const TW2="0101011101110101";
        const TW3="0111011011010111";

        const m=o=>this.mk(
            this.compose(o)
        );

        this.frames.idle=[
            m({tail:T1}),
            m({tail:T2}),
            m({tail:T3}),
            m({tail:T2}),
            m({tail:T4}),
            m({tail:T1})
        ];

        this.blinkIdle=
            m({
                tail:T1,
                blink:true
            });

        this.frames.walk=[
            m({tail:T1,dx:1}),
            m({tail:T2,dx:0}),
            m({tail:T3,dx:-1}),
            m({tail:T2,dx:0}),
            m({tail:T1,dx:-1}),
            m({tail:TW1,dx:0}),
            m({tail:TW2,dx:1}),
            m({tail:TW3,dx:0})
        ];

        this.blinkWalk=
            m({
                tail:T2,
                dx:1,
                blink:true
            });

        this.frames.jump=[
            m({
                tail:TJ,
                mouth:"o",
                wide:true
            }),
            m({
                tail:TJ2,
                mouth:"o",
                wide:true
            }),
            m({
                tail:TJ3,
                mouth:"o"
            }),
            m({tail:TJ}),
            m({tail:TJ2}),
            m({tail:T1})
        ];

        this.frames.hide=[
            this.mkHide(0),
            this.mkHide(1),
            this.mkHide(2)
        ];

        this.frames.pieces=
            this.mkPieces();

        const rows=
            this.compose({
                tail:T1
            });

        const c=
            document.createElement(
                "canvas"
            );

        c.width=16;
        c.height=16;

        const g=c.getContext("2d");

        for(let y=0;y<16;y++){
            const r=rows[y];

            for(let x=0;x<16;x++){
                const ch=r[x];

                if(
                    ch==="1"||
                    ch==="2"||
                    ch==="3"
                ){
                    g.fillStyle="#000";
                    g.fillRect(
                        x,
                        y,
                        1,
                        1
                    );
                }else if(ch==="4"){
                    g.fillStyle="#fff";
                    g.fillRect(
                        x,
                        y,
                        1,
                        1
                    );
                }
            }
        }

        this.sil=c;
    }

    mkPieces(){
        const pieces=[];

        const pos=[
            {x:0,y:0},

        ];

        for(let i=0;i<9;i++){

    mkHide(phase){
        const c=
            document.createElement(
                "canvas"
            );

        c.width=16;
        c.height=16;

        const g=c.getContext("2d");

        g.fillStyle="#fff";

        const yOff=
            phase===1?-1:0;

        for(let yy=6;yy<=13;yy++){
            for(let xx=4;xx<=12;xx++){
                const dist=
                    Math.abs(xx-8)+
                    Math.abs(
                        yy-
                        9.5+
                        yOff
                    );

                if(dist<5){
                    g.fillRect(
                        xx,
                        yy,
                        1,
                        1
                    );
                }
            }
        }

        g.fillStyle="#000";

        g.fillRect(
            6,
            8+yOff,
            1,
            1
        );

        g.fillRect(
            9,
            8+yOff,
            1,
            1
        );

        return c;
    }
}

function drawSpr(img,x,y,flip){
    x=Math.round(x);
    y=Math.round(y);

    if(!flip){
        ctx.drawImage(
            img,
            x,
            y
        );
    }else{
        ctx.save();

        ctx.translate(
            x+16,
            y
        );

        ctx.scale(-1,1);

        ctx.drawImage(
            img,
            0,
            0
        );

        ctx.restore();
    }
}


/* =========================================================
   DRIPS
========================================================= */

class Drips{
    constructor(){
        this.list=[];
        this.drops=[];
    }

    seed(srcs){
        this.list=[];
        this.drops=[];

        for(const s of srcs){
            if(Math.random()<.6){
                this.list.push({
                    x:s.x,
                    y:s.y,
                    len:0,
                    max:8+Math.random()*26,
                    sp:.05+Math.random()*.1,
                    wait:
                        (Math.random()*220)|0
                });
            }
        }
    }

    update(){
        for(const d of this.list){
            if(d.wait>0){
                d.wait--;
                continue;
            }

            d.len+=d.sp;

            if(d.len>=d.max){
                this.drops.push({
                    x:d.x,
                    y:d.y+d.len,
                    vy:.25+Math.random()*.3
                });

                d.len=
                    2+
                    Math.random()*3;

                d.max=
                    8+
                    Math.random()*26;

                d.sp=
                    .04+
                    Math.random()*.09;
            }
        }

        for(const p of this.drops){
            p.vy=
                Math.min(
                    p.vy+.02,
                    1
                );

            p.y+=p.vy;
        }

        this.drops=
            this.drops.filter(
                p=>p.y<184
            );
    }

    draw(col,w){
        ctx.fillStyle=col;

        for(const d of this.list){
            if(
                d.wait>0||
                d.len<=0
            )continue;

            ctx.fillRect(
                d.x,
                d.y,
                w,
                Math.ceil(d.len)
            );
        }

        for(const p of this.drops){
            ctx.fillRect(
                p.x,
                p.y,
                w,
                w
            );
        }
    }
}

    updateElectricity(t){
        if(!this.electric)
            return;

        for(let i=0;i<this.lamps.length;i++){
            const L=this.lamps[i];

            if(!this.electric.flicker[i]){
                this.electric.flicker[i]={
                    timer:8,
                    power:
                        .75+
                        Math.random()*.25,
                    burst:0
                };
            }

            const f=
                this.electric.flicker[i];

            f.timer--;

            if(f.timer<=0){
                const chance=
                    L.broken
                    ?.24
                    :.065;

                if(Math.random()<chance){
                    f.burst=
                        2+
                        Math.floor(
                            Math.random()*8
                        );

                    f.power=
                        .08+
                        Math.random()*.7;
                }else{
                    f.power=
                        .78+
                        Math.random()*.22;
                }

                f.timer=
                    12+
                    Math.floor(
                        Math.random()*55
                    );
            }

            if(f.burst>0){
                f.burst--;

                if(Math.random()<.35){
                    f.power=
                        .04+
                        Math.random()*.35;
                }else{
                    f.power=
                        .82+
                        Math.random()*.18;
                }
            }

            if(L.dead)
                f.power=0;
        }

        this.electric.nextSpark--;

        if(this.electric.nextSpark<=0){
            this.electric.nextSpark=
                28+
                Math.floor(
                    Math.random()*140
                );

            const candidates=[];

            for(const L of this.lamps){
                if(L.dead)continue;

                candidates.push(L);

                if(L.broken){
                    candidates.push(L);
                    candidates.push(L);
                    candidates.push(L);
                }
            }

            if(
                candidates.length&&
                Math.random()<.6
            ){
                const L=
                    candidates[
                        Math.floor(
                            Math.random()*
                            candidates.length
                        )
                    ];

                this.spawnElectricalSpark(
                    L.tx*10+5,
                    14
                );
            }
        }

        for(let i=this.electric.sparks.length-1;i>=0;i--){
            const s=
                this.electric.sparks[i];

            s.x+=s.vx;
            s.y+=s.vy;

            s.vy+=.035;

            s.life--;

            if(Math.random()<.35){
                s.vx+=rng(-.12,.12);

            if(s.life<=0){

                    i,
                    1

        for(const s of this.electric.sparks){

            const sy=
                Math.round(s.y);

            if(
                sx<-10||
                sx>W+10||
                sy<-10||
                sy>H+10

            const a=
                clamp(

            ctx.globalAlpha=
                a*.25;

            ctx.fillRect(

            ctx.fillRect(

                continue;

            const sx=
                L.tx*10+5-cam;

            if(
                sx<-80||
                sx>W+80

            const f=
                this.electric.flicker[i];

            const base=
                L.broken
                ?f.power*.8

            if(base<=.03)

            const radius=
                34+
                base*24;

            const grad=
                ctx.createRadialGradient(
                    sx,
                    16,
                    0,
                    sx,
                    16,
                    radius
                );

            grad.addColorStop(
                0,
                `rgba(255,245,185,${.13*base})`

            grad.addColorStop(
                .2,
                `rgba(255,230,140,${.075*base})`

            grad.addColorStop(
                .5,
                `rgba(220,220,150,${.035*base})`
            );

            grad.addColorStop(
                1,
                "rgba(120,130,100,0)"
            );

            ctx.fillStyle=grad;

            ctx.fillRect(
                sx-radius,
                16-radius,
                radius*2,
                radius*2

            ctx.globalAlpha=
